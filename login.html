<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入 - Creative HK Portfolio</title>
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --text-main: #c9d1d9;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --border: #30363d;
        --success: #238636;
        --error: #da3633;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-container {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo-icon {
        font-size: 3rem;
        margin-bottom: 10px;
      }

      h1 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 10px;
        color: var(--text-main);
      }

      .subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-main);
        font-weight: 500;
      }

      input[type='email'], input[type='password'] {
        width: 100%;
        background: var(--bg-color);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input[type='email']:focus {
        outline: none;
        border-color: var(--accent);
      }

      input[type='email']::placeholder {
        color: var(--text-secondary);
      }

      .btn {
        width: 100%;
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn:hover:not(:disabled) {
        background-color: #79c0ff;
      }

      .btn:disabled {
        background-color: var(--border);
        cursor: not-allowed;
        opacity: 0.6;
      }

      #googleSignInBtn {
        background-color: white;
        color: #1f2937;
        border: 1px solid var(--border);
      }

      #googleSignInBtn:hover:not(:disabled) {
        background-color: #f3f4f6;
      }

      .info-box {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .info-box.info {
        background-color: rgba(88, 166, 255, 0.1);
        border: 1px solid rgba(88, 166, 255, 0.3);
        color: var(--accent);
      }

      .info-box.success {
        background-color: rgba(35, 134, 54, 0.1);
        border: 1px solid rgba(35, 134, 54, 0.3);
        color: var(--success);
      }

      .info-box.error {
        background-color: rgba(218, 54, 51, 0.1);
        border: 1px solid rgba(218, 54, 51, 0.3);
        color: var(--error);
      }

      .info-box-icon {
        font-size: 1.2rem;
        flex-shrink: 0;
      }

      .info-box-content {
        flex: 1;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .hidden {
        display: none !important;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <div class="logo-icon">🏫</div>
        <h1>Creative HK Portfolio</h1>
        <p class="subtitle">使用學校電郵登入</p>
      </div>

      <button type="button" class="btn" id="googleSignInBtn" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="white"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="white"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="white"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="white"/>
        </svg>
        使用 Google 登入
      </button>

      <div id="infoMessage" class="info-box info hidden">
        <span class="info-box-icon">ℹ️</span>
        <div class="info-box-content">
          請使用 Google 帳戶登入
        </div>
      </div>

      <div id="successMessage" class="info-box success hidden">
        <span class="info-box-icon">✅</span>
        <div class="info-box-content"></div>
      </div>

      <div id="errorMessage" class="info-box error hidden">
        <span class="info-box-icon">❌</span>
        <div class="info-box-content"></div>
      </div>
    </div>

    <script>
      // Supabase Configuration
      const SUPABASE_URL = 'https://wnvgjuhxxwnihmjfrcvk.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_MR0Q28M6SwAHDyy5iqdQXA_U26L7s6b';
      
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // DOM Elements
      const googleSignInBtn = document.getElementById('googleSignInBtn');
      const infoMessage = document.getElementById('infoMessage');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');

      // Allowed email domains
      const ALLOWED_DOMAINS = ['@creativehk.edu.hk', '@student.creativehk.edu.hk'];

      // Validate email domain
      function validateEmailDomain(email) {
        const normalizedEmail = email.toLowerCase().trim();
        return ALLOWED_DOMAINS.some(domain => normalizedEmail.endsWith(domain));
      }

      // Show message
      function showMessage(type, message) {
        // Hide all messages
        infoMessage.classList.add('hidden');
        successMessage.classList.add('hidden');
        errorMessage.classList.add('hidden');

        // Show the appropriate message
        if (type === 'success') {
          successMessage.querySelector('.info-box-content').textContent = message;
          successMessage.classList.remove('hidden');
        } else if (type === 'error') {
          errorMessage.querySelector('.info-box-content').textContent = message;
          errorMessage.classList.remove('hidden');
        } else {
          infoMessage.classList.remove('hidden');
        }
      }

      // Handle Google Sign In
      googleSignInBtn.addEventListener('click', async () => {
        googleSignInBtn.disabled = true;
        googleSignInBtn.innerHTML = '<span class="spinner"></span>登入中...';

        try {
          const { data, error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: window.location.origin + '/index.html'
            }
          });

          if (error) {
            throw error;
          }
        } catch (error) {
          console.error('Google Sign In error:', error);
          showMessage('error', error.message || 'Google 登入失敗，請稍後再試。');
          googleSignInBtn.disabled = false;
          googleSignInBtn.innerHTML = '使用 Google 登入';
        }
      });

      // Check if user is already logged in
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          // Already logged in, redirect to main page
          window.location.href = '/index.html';
        }
      });

      // Show initial message
      showMessage('info', '請使用 Google 帳戶登入');
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登入 - Creative HK Portfolio</title>
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --text-main: #c9d1d9;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --border: #30363d;
        --success: #238636;
        --error: #da3633;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-container {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo-icon {
        font-size: 3rem;
        margin-bottom: 10px;
      }

      h1 {
        text-align: center;
        font-size: 1.5rem;
        margin-bottom: 10px;
        color: var(--text-main);
      }

      .subtitle {
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-main);
        font-weight: 500;
      }

      input[type='email'] {
        width: 100%;
        background: var(--bg-color);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      input[type='email']:focus {
        outline: none;
        border-color: var(--accent);
      }

      input[type='email']::placeholder {
        color: var(--text-secondary);
      }

      .btn {
        width: 100%;
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn:hover:not(:disabled) {
        background-color: #79c0ff;
      }

      .btn:disabled {
        background-color: var(--border);
        cursor: not-allowed;
        opacity: 0.6;
      }

      .info-box {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .info-box.info {
        background-color: rgba(88, 166, 255, 0.1);
        border: 1px solid rgba(88, 166, 255, 0.3);
        color: var(--accent);
      }

      .info-box.success {
        background-color: rgba(35, 134, 54, 0.1);
        border: 1px solid rgba(35, 134, 54, 0.3);
        color: var(--success);
      }

      .info-box.error {
        background-color: rgba(218, 54, 51, 0.1);
        border: 1px solid rgba(218, 54, 51, 0.3);
        color: var(--error);
      }

      .info-box-icon {
        font-size: 1.2rem;
        flex-shrink: 0;
      }

      .info-box-content {
        flex: 1;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 8px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .hidden {
        display: none !important;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <div class="logo-icon">🏫</div>
        <h1>Creative HK Portfolio</h1>
        <p class="subtitle">使用學校電郵登入</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">電郵地址</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your.name@creativehk.edu.hk"
            required
            autocomplete="email"
          />
        </div>

        <button type="submit" class="btn" id="submitBtn">
          發送登入連結
        </button>
      </form>

      <div id="infoMessage" class="info-box info">
        <span class="info-box-icon">ℹ️</span>
        <div class="info-box-content">
          請使用書院電郵地址
        </div>
      </div>

      <div id="successMessage" class="info-box success hidden">
        <span class="info-box-icon">✅</span>
        <div class="info-box-content"></div>
      </div>

      <div id="errorMessage" class="info-box error hidden">
        <span class="info-box-icon">❌</span>
        <div class="info-box-content"></div>
      </div>
    </div>

    <script>
      // Supabase Configuration
      const SUPABASE_URL = 'https://wnvgjuhxxwnihmjfrcvk.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_MR0Q28M6SwAHDyy5iqdQXA_U26L7s6b';
      
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // DOM Elements
      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submitBtn');
      const infoMessage = document.getElementById('infoMessage');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');

      // Allowed email domains
      const ALLOWED_DOMAINS = ['@creativehk.edu.hk', '@student.creativehk.edu.hk'];

      // Validate email domain
      function validateEmailDomain(email) {
        const normalizedEmail = email.toLowerCase().trim();
        return ALLOWED_DOMAINS.some(domain => normalizedEmail.endsWith(domain));
      }

      // Show message
      function showMessage(type, message) {
        // Hide all messages
        infoMessage.classList.add('hidden');
        successMessage.classList.add('hidden');
        errorMessage.classList.add('hidden');

        // Show the appropriate message
        if (type === 'success') {
          successMessage.querySelector('.info-box-content').textContent = message;
          successMessage.classList.remove('hidden');
        } else if (type === 'error') {
          errorMessage.querySelector('.info-box-content').textContent = message;
          errorMessage.classList.remove('hidden');
        } else {
          infoMessage.classList.remove('hidden');
        }
      }

      // Handle form submission
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = emailInput.value.trim();

        // Validate email domain
        if (!validateEmailDomain(email)) {
          showMessage('error', '請使用書院電郵地址');
          return;
        }

        // Disable form
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>發送中...';

        try {
          const { error } = await supabaseClient.auth.signInWithOtp({
            email: email,
            options: {
              emailRedirectTo: window.location.origin + '/index.html'
            }
          });

          if (error) {
            throw error;
          }

          // Success
          showMessage('success', '登入連結已發送到您的電郵！請檢查收件箱並點擊連結完成登入。');
          emailInput.value = '';
        } catch (error) {
          console.error('Login error:', error);
          showMessage('error', error.message || '發送登入連結時發生錯誤，請稍後再試。');
        } finally {
          // Re-enable form
          submitBtn.disabled = false;
          submitBtn.textContent = '發送登入連結';
        }
      });

      // Check if user is already logged in
      supabaseClient.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          // Already logged in, redirect to main page
          window.location.href = '/index.html';
        }
      });
    </script>
  </body>
</html>

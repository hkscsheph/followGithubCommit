<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>純 JS 即時多人畫板 (Supabase Broadcast)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #f4f4f9;
        font-family: sans-serif;
        padding-top: 20px;
      }
      #controls {
        margin-bottom: 10px;
        display: flex;
        gap: 15px;
        align-items: center;
      }
      canvas {
        background-color: white;
        border: 2px solid #333;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        cursor: crosshair;
      }
      .status {
        margin-top: 10px;
        font-size: 14px;
        color: #666;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="controls">
      <label
        >畫筆顏色: <input type="color" id="colorPicker" value="#000000"
      /></label>
      <button id="clearBtn">清空畫板</button>
    </div>

    <canvas id="drawingBoard" width="800" height="600"></canvas>

    <div class="status" id="statusText">正在連接 Supabase...</div>

    <script>
      // ==========================================
      // 1. Supabase 初始化設定 (確保這裡只宣告一次)
      // ==========================================
      const SUPABASE_URL = 'https://iwgvgoxqnbcltgqtlcrb.supabase.co';
      const SUPABASE_ANON_KEY =
        'sb_publishable_sF0tzI1z-MNHNZyy99_gdg_R-1t5vp4';

      // 初始化 supabase 客戶端
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

      // ==========================================
      // 2. 畫板與本地繪圖邏輯
      // ==========================================
      const canvas = document.getElementById('drawingBoard');
      const ctx = canvas.getContext('2d');
      const colorPicker = document.getElementById('colorPicker');
      const clearBtn = document.getElementById('clearBtn');
      const statusText = document.getElementById('statusText');

      let isDrawing = false;
      let currentX = 0;
      let currentY = 0;
      let myColor = colorPicker.value;

      // 更新畫筆顏色
      colorPicker.addEventListener('change', (e) => {
        myColor = e.target.value;
      });

      // 核心繪圖函數：畫線
      function drawLine(x0, y0, x1, y1, color, emit) {
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.closePath();

        // 如果 emit 為 true，代表是本地畫的，需要廣播給其他人
        if (!emit) return;

        broadcastDrawEvent(x0, y0, x1, y1, color);
      }

      // 監聽滑鼠事件
      canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        currentX = e.offsetX;
        currentY = e.offsetY;
      });

      canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        drawLine(currentX, currentY, e.offsetX, e.offsetY, myColor, true);
        currentX = e.offsetX;
        currentY = e.offsetY;
      });

      canvas.addEventListener('mouseup', () => {
        isDrawing = false;
      });
      canvas.addEventListener('mouseout', () => {
        isDrawing = false;
      });

      // ==========================================
      // 3. Supabase Broadcast 實時連線邏輯
      // ==========================================

      // 建立名為 'drawing-room' 的頻道
      const room = supabaseClient.channel('drawing-room', {
        config: {
          broadcast: { self: false }, // 不接收自己發送的訊息
        },
      });

      // 訂閱連線狀態
      room.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          statusText.innerText = '✅ 已成功連接！現在可以邀請朋友一起畫畫了。';
          statusText.style.color = 'green';
        } else {
          statusText.innerText = `連線狀態: ${status}`;
        }
      });

      // 發送廣播 (本地繪圖時觸發)
      function broadcastDrawEvent(x0, y0, x1, y1, color) {
        room.send({
          type: 'broadcast',
          event: 'draw',
          payload: { x0, y0, x1, y1, color },
        });
      }

      // 接收廣播 (監聽其他人的繪圖事件)
      room.on('broadcast', { event: 'draw' }, (payload) => {
        const data = payload.payload;
        drawLine(data.x0, data.y0, data.x1, data.y1, data.color, false);
      });

      // ==========================================
      // 4. 清空畫板功能 (廣播同步)
      // ==========================================
      clearBtn.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        room.send({
          type: 'broadcast',
          event: 'clear',
        });
      });

      // 監聽其他人的清空事件
      room.on('broadcast', { event: 'clear' }, () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
    </script>
  </body>
</html>

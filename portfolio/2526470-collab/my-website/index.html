<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的連結導航</title>
    <style>
      /* 基礎樣式設計 */
      body {
        font-family: 'Microsoft JhengHei', '微軟正黑體', sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        width: 90%;
        max-width: 500px;
        text-align: center;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #333;
        margin-bottom: 10px;
      }

      p {
        color: #666;
        margin-bottom: 30px;
      }

      /* 連結按鈕樣式 */
      .link-card {
        display: block;
        text-decoration: none;
        background-color: #ffffff;
        color: #2d3436;
        border: 2px solid #2d3436;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
        font-weight: bold;
        transition: all 0.3s ease;
      }

      /* 滑鼠懸停效果 */
      .link-card:hover {
        background-color: #2d3436;
        color: #ffffff;
        transform: translateY(-3px);
      }

      footer {
        margin-top: 20px;
        font-size: 0.8em;
        color: #aaa;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>ALL MY WEBSITE</h1>
      <p>PUMBA IS A CUTE CAT</p>

      <a
        href="https://emojigameeee.netlify.app/" class="link-card" target="_blank"
        >HKSC emoji game</a
      >
      <a href="https://chatroom-cat-97c6cd.netlify.app/" class="link-card" target="_blank"
        >Purple chat room</a
      >
      <a href="https://www.youtube.com" class="link-card" target="_blank"
        >YouTube 頻道</a
      >
      <a href="https://github.com" class="link-card" target="_blank"
        >GitHub 專案</a
      >
      <a href="mailto:example@email.com" class="link-card">聯繫我 (Email)</a>

      <footer>© 2026 我的網站 - 保留所有權利</footer>
    </div>
  </body>
</html>

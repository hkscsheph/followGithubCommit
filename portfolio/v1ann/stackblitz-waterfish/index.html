<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Ranking Challenge</title>
    <style>
        body {
            margin: 0; background: #121212;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game-container { position: relative; border: 6px solid #333; border-radius: 15px; }
        canvas { background: #0077b6; cursor: none; display: block; border-radius: 10px; }
        .ui-layer {
            position: absolute; top: 10px; width: 100%;
            text-align: center; pointer-events: none;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
        }
        #rank-screen {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            flex-direction: column; justify-content: center; align-items: center;
            border-radius: 10px;
        }
        .rank-emoji { font-size: 80px; margin: 20px; }
        button {
            padding: 10px 20px; font-size: 1.2rem; cursor: pointer;
            background: #ffb703; border: none; border-radius: 5px; font-weight: bold;
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <h2 id="stats">Level: 1 | Goal: 0/5</h2>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="rank-screen">
        <h1>RESULTS</h1>
        <div id="rank-icon" class="rank-emoji"></div>
        <h2 id="rank-text"></h2>
        <p id="final-score"></p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stats = document.getElementById('stats');
    const rankScreen = document.getElementById('rank-screen');

    canvas.width = 400;
    canvas.height = 600;

    let level = 1;
    let collected = 0;
    let goal = 5;
    let score = 0;
    let isGameOver = false;
    let playerX = canvas.width / 2;

    const drops = [];
    const hazards = [];

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        playerX = e.clientX - rect.left;
    });

    function spawn() {
        // Control flow: Don't spawn too much at once
        if (Math.random() < 0.03 && drops.length < 3) {
            drops.push({ x: 30 + Math.random() * (canvas.width - 60), y: -20, speed: 2 + level });
        }
        if (Math.random() < 0.01 + (level * 0.005)) {
            hazards.push({ x: 30 + Math.random() * (canvas.width - 60), y: -20, speed: 3 + level });
        }
    }

    function showRanking() {
        isGameOver = true;
        rankScreen.style.display = 'flex';
        let rank = "";
        let emoji = "";

        if (score >= 200) { rank = "OCEAN KING"; emoji = "👑"; }
        else if (score >= 100) { rank = "GOLD FISH"; emoji = "🥇"; }
        else if (score >= 50) { rank = "SILVER FIN"; emoji = "🥈"; }
        else { rank = "PLANKTON"; emoji = "🥉"; }

        document.getElementById('rank-icon').innerText = emoji;
        document.getElementById('rank-text').innerText = rank;
        document.getElementById('final-score').innerText = "Total Score: " + score;
    }

    function update() {
        if (isGameOver) return;

        spawn();

        // Update Drops
        for (let i = drops.length - 1; i >= 0; i--) {
            drops[i].y += drops[i].speed;
            
            // Check Collection
            if (Math.hypot(drops[i].x - playerX, drops[i].y - (canvas.height - 70)) < 40) {
                drops.splice(i, 1);
                collected++;
                score += 10;
                
                if (collected >= goal) {
                    level++;
                    collected = 0;
                    goal += 3;
                }
            } 
            // FAIL CONDITION: You missed a drop!
            else if (drops[i].y > canvas.height) {
                alert("You missed a drop! You must collect them all.");
                showRanking();
            }
        }

        // Update Hazards (Poo)
        for (let i = hazards.length - 1; i >= 0; i--) {
            hazards[i].y += hazards[i].speed;
            if (Math.hypot(hazards[i].x - playerX, hazards[i].y - (canvas.height - 70)) < 35) {
                showRanking();
            } else if (hazards[i].y > canvas.height) {
                hazards.splice(i, 1);
            }
        }

        stats.innerText = `Level: ${level} | Goal: ${collected}/${goal}`;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";

        // Water Drops
        ctx.font = "30px Arial";
        drops.forEach(d => ctx.fillText("💧", d.x, d.y));

        // Poo
        ctx.font = "35px Arial";
        hazards.forEach(h => ctx.fillText("💩", h.x, h.y));

        // Fish (Player)
        ctx.font = "50px Arial";
        ctx.fillText("🐟", playerX, canvas.height - 70);

        if (!isGameOver) {
            update();
            requestAnimationFrame(draw);
        }
    }

    draw();
</script>
</body>
</html>

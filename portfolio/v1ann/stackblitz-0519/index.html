<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Arcade Game - 上下鍵版</title>
    <style>
        body {
            margin: 0;
            background-color: #0f141d;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #gameCanvas {
            background: linear-gradient(to bottom, #1b2838, #0a0f18);
            border: 4px solid #4f5d75;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 100%;
        }
        .instructions {
            margin-top: 15px;
            font-size: 15px;
            color: #a0aec0;
            text-align: center;
            line-height: 1.6;
        }
        .key-hint {
            background: #2d3748;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <div class="instructions">
        操作方式：按住 <span class="key-hint">上方向鍵 ↑</span> 往上飛行 | 按住 <span class="key-hint">下方向鍵 ↓</span> 往下俯衝<br>
        放開按鍵時水平滑行。躲避紅色障礙物，挑戰最高分數！
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 遊戲狀態
let gameState = 'START'; // START, PLAYING, GAMEOVER
let score = 0;
let bestScore = localStorage.getItem('birdBestScore') ? parseInt(localStorage.getItem('birdBestScore')) : 0;

// 玩家屬性（改為上下鍵主動操作，無被動重力）
const player = {
    x: 120,
    y: 225,
    width: 34,
    height: 26,
    speed: 5, // 上下移動的速度
    color: '#38bdf8' // 天藍色小鳥/飛船
};

// 按鍵狀態監聽
const keys = {
    ArrowUp: false,
    ArrowDown: false
};

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        e.preventDefault();
        keys[e.key] = true;
    }
    // 菜單狀態下按任意鍵或 Enter 鍵開始/重玩
    if (gameState === 'START' || gameState === 'GAMEOVER') {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
            resetGame();
        }
    }
});

window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
        keys[e.key] = false;
    }
});

// 兼容手機與滑鼠點擊（畫麵上半部往上，下半部往下）
canvas.addEventListener('touchstart', handleTouch);
canvas.addEventListener('mousedown', handleTouch);
canvas.addEventListener('touchend', () => { keys.ArrowUp = false; keys.ArrowDown = false; });
canvas.addEventListener('mouseup', () => { keys.ArrowUp = false; keys.ArrowDown = false; });

function handleTouch(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING') {
        resetGame();
        return;
    }
    const rect = canvas.getBoundingClientRect();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const relativeY = clientY - rect.top;
    
    // 點擊畫麵上半部分往上，下半部分往下
    if (relativeY < rect.height / 2) {
        keys.ArrowUp = true;
        keys.ArrowDown = false;
    } else {
        keys.ArrowDown = true;
        keys.ArrowUp = false;
    }
}


// 障礙物管理
let obstacles = [];
let spawnTimer = 0;
let gameSpeed = 5;

function spawnObstacle() {
    // 隨機生成柱子的高度與上下位置
    const minHeight = 50;
    const maxHeight = 250;
    const height = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
    const isTop = Math.random() > 0.5;
    const y = isTop ? 0 : canvas.height - height;

    obstacles.push({
        x: canvas.width,
        y: y,
        width: 45,
        height: height,
        color: '#f43f5e', // 紅色障礙物
        passed: false
    });
}

function resetGame() {
    player.y = canvas.height / 2 - player.height / 2;
    obstacles = [];
    score = 0;
    gameSpeed = 5.5;
    spawnTimer = 0;
    keys.ArrowUp = false;
    keys.ArrowDown = false;
    gameState = 'PLAYING';
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// 遊戲主循環
function gameLoop() {
    // 1. 清除畫麵
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 2. 更新邏輯
    if (gameState === 'PLAYING') {
        // 依據按鍵狀態進行上下移動
        if (keys.ArrowUp) {
            player.y -= player.speed;
        }
        if (keys.ArrowDown) {
            player.y += player.speed;
        }

        // 邊界碰撞檢測（撞到頂部或底部邊界直接淘汰）
        if (player.y < 0 || player.y + player.height > canvas.height) {
            endGame();
        }

        // 生成障礙物
        spawnTimer++;
        if (spawnTimer > 80) { 
            spawnObstacle();
            spawnTimer = 0;
            // 隨分數提高速度，最高速度上限 12
            if (gameSpeed < 12) gameSpeed += 0.15;
        }

        // 障礙物移動與碰撞
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= gameSpeed;

            // 分數計算
            if (!obs.passed && obs.x + obs.width < player.x) {
                score++;
                obs.passed = true;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('birdBestScore', bestScore);
                }
            }

            // 碰撞檢測
            if (checkCollision(player, obs)) {
                endGame();
            }

            // 移出畫麵的障礙物清理
            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }
    }

    // 3. 繪製畫麵
    // 繪製玩家（帶有霓虹發光特效）
    ctx.fillStyle = player.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = player.color;
    // 繪製一個像小鳥/小飛船的三角形或方塊
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.shadowBlur = 0; // 重置發光

    // 繪製障礙物
    obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
    });

    // 繪製 UI 計分板
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px Arial';
    ctx.fillText(`SCORE: ${score}`, 25, 45);
    ctx.fillStyle = '#f59e0b';
    ctx.fillText(`BEST: ${bestScore}`, 25, 75);

    // 狀態菜單覆蓋層
    if (gameState === 'START') {
        drawOverlay('按 上 或 下 方向鍵開始遊戲', 'KARINA BIRD STYLE');
    } else if (gameState === 'GAMEOVER') {
        drawOverlay('遊戲結束！按任意方向鍵重試', 'GAME OVER');
    }

    requestAnimationFrame(gameLoop);
}

function endGame() {
    gameState = 'GAMEOVER';
}

function drawOverlay(subText, mainText) {
    ctx.fillStyle = 'rgba(10, 15, 24, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#f43f5e';
    ctx.font = 'bold 42px Arial';
    ctx.fillText(mainText, canvas.width / 2, canvas.height / 2 - 20);

    ctx.fillStyle = '#ffffff';
    ctx.font = '20px Arial';
    ctx.fillText(subText, canvas.width / 2, canvas.height / 2 + 30);
    ctx.textAlign = 'left'; // 還原對齊方式
}

// 啟動遊戲
gameLoop();
</script>

</body>
</html>

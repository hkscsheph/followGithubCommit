<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridlock Neon - Hard Reflex Game</title>
    <style>
        body {
            margin: 0;
            background-color: #05050a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #ui {
            margin-bottom: 15px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 153, 255, 0.5);
        }
        #gameContainer {
            position: relative;
            border: 4px solid #1a1a3a;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        canvas {
            display: block;
            background: #0a0a16;
        }
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
        }
        h1 {
            color: #ff0055;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }
        p {
            color: #888;
            margin-bottom: 25px;
        }
        button {
            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
        }
        button:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

<div id="ui">SCORE: <span id="score">0</span></div>
<div id="gameContainer">
    <div id="menu">
        <h1 id="menuTitle">GRIDLOCK</h1>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button id="startBtn">START</button>
    </div>
    <canvas id="canvas" width="480" height="480"></canvas>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const uiScore = document.getElementById('score');
const menu = document.getElementById('menu');
const menuTitle = document.getElementById('menuTitle');
const finalScore = document.getElementById('finalScore');
const startBtn = document.getElementById('startBtn');

const GRID_SIZE = 4;
const TILE_SIZE = canvas.width / GRID_SIZE;

// Game states
let player = { x: 1, y: 1 };
let score = 0;
let isDead = false;
let gameLoopId;

// Strike system arrays containing tile statuses
// 0 = safe, 1 = warning (warning flashes), 2 = active hazard
let gridStatus = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
let warningTimers = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));

let baseSpeed = 1000; // ms between attacks
let lastAttackTime = 0;
let warningDuration = 450; // ms player has to react
let lastFrameTime = 0;

// Setup Input Listeners
window.addEventListener('keydown', handleInput);
startBtn.addEventListener('click', initGame);

function handleInput(e) {
    if (isDead) return;
    
    switch(e.key.toLowerCase()) {
        case 'arrowup':
        case 'w':
            if (player.y > 0) player.y--;
            break;
        case 'arrowdown':
        case 's':
            if (player.y < GRID_SIZE - 1) player.y++;
            break;
        case 'arrowleft':
        case 'a':
            if (player.x > 0) player.x--;
            break;
        case 'arrowright':
        case 'd':
            if (player.x < GRID_SIZE - 1) player.x++;
            break;
    }
}

function triggerAttack() {
    const attackType = Math.random();
    
    if (attackType < 0.35) {
        // Random Row Attack
        let row = Math.floor(Math.random() * GRID_SIZE);
        for(let x=0; x<GRID_SIZE; x++) setWarning(x, row);
    } else if (attackType < 0.70) {
        // Random Column Attack
        let col = Math.floor(Math.random() * GRID_SIZE);
        for(let y=0; y<GRID_SIZE; y++) setWarning(col, y);
    } else {
        // Scatter Attack (random clusters)
        let count = Math.floor(Math.random() * 4) + 4; // 4 to 7 random tiles
        for (let i = 0; i < count; i++) {
            let rx = Math.floor(Math.random() * GRID_SIZE);
            let ry = Math.floor(Math.random() * GRID_SIZE);
            setWarning(rx, ry);
        }
    }
}

function setWarning(x, y) {
    if (gridStatus[x][y] === 0) {
        gridStatus[x][y] = 1;
        warningTimers[x][y] = warningDuration;
    }
}

function initGame() {
    player = { x: 1, y: 1 };
    score = 0;
    isDead = false;
    baseSpeed = 900;
    warningDuration = 450;
    gridStatus = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    warningTimers = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
    
    uiScore.innerText = score;
    menu.style.display = 'none';
    
    lastAttackTime = performance.now();
    lastFrameTime = performance.now();
    
    cancelAnimationFrame(gameLoopId);
    gameLoopId = requestAnimationFrame(gameLoop);
}

function gameOver() {
    isDead = true;
    menuTitle.innerText = "GRIDLOCKED";
    finalScore.innerText = score;
    menu.style.display = 'flex';
}

function gameLoop(timestamp) {
    let dt = timestamp - lastFrameTime;
    lastFrameTime = timestamp;

    // Progression: Scale speed and drop warning buffer limits over time
    baseSpeed = Math.max(300, 900 - score * 8);
    warningDuration = Math.max(220, 450 - score * 4);

    // Attack Trigger Ticker
    if (timestamp - lastAttackTime > baseSpeed) {
        triggerAttack();
        lastAttackTime = timestamp;
        score += 1;
        uiScore.innerText = score;
    }

    // Processing Tile Timing State
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            if (gridStatus[x][y] === 1) {
                warningTimers[x][y] -= dt;
                if (warningTimers[x][y] <= 0) {
                    gridStatus[x][y] = 2; // Warning finished -> Activate damage laser
                    warningTimers[x][y] = 250; // Laser duration
                }
            } else if (gridStatus[x][y] === 2) {
                warningTimers[x][y] -= dt;
                if (warningTimers[x][y] <= 0) {
                    gridStatus[x][y] = 0; // Laser ends -> Clear tile
                }
            }
        }
    }

    // Instant Death Verification
    if (gridStatus[player.x][player.y] === 2) {
        gameOver();
    }

    draw();

    if (!isDead) {
        gameLoopId = requestAnimationFrame(gameLoop);
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Lines & Tiles
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            let tx = x * TILE_SIZE;
            let ty = y * TILE_SIZE;

            // Base Tile Backgrounds
            if (gridStatus[x][y] === 1) {
                // Warning Flash
                let flash = Math.sin(performance.now() * 0.02) > 0;
                ctx.fillStyle = flash ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.05)';
            } else if (gridStatus[x][y] === 2) {
                // Dangerous Laser Tile
                ctx.fillStyle = 'rgba(255, 0, 85, 0.25)';
            } else {
                ctx.fillStyle = '#0a0a16';
            }
            ctx.fillRect(tx, ty, TILE_SIZE, TILE_SIZE);

            // Draw Grid Borders
            ctx.strokeStyle = '#161633';
            ctx.lineWidth = 2;
            ctx.strokeRect(tx, ty, TILE_SIZE, TILE_SIZE);

            // Draw Dangerous Laser Overlays
            if (gridStatus[x][y] === 2) {
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0055';
                ctx.strokeRect(tx + 4, ty + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                ctx.shadowBlur = 0;
            }
        }
    }

    // Draw Player Indicator Unit
    let px = player.x * TILE_SIZE + TILE_SIZE / 2;
    let py = player.y * TILE_SIZE + TILE_SIZE / 2;
    let pSize = TILE_SIZE * 0.4;

    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0099ff';
    ctx.fillStyle = '#00dfff';
    ctx.fillRect(px - pSize/2, py - pSize/2, pSize, pSize);
    ctx.shadowBlur = 0;
}

// Show Menu initially
menu.style.display = 'flex';
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無限挑戰：英文打字過關遊戲</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --text-color: #cdd6f4;
            --primary-color: #89b4fa;
            --correct-color: #a6e3a1;
            --wrong-color: #f38ba8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: #252538;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        #level-display {
            font-size: 1.5rem;
            color: #fab387;
            margin-bottom: 10px;
        }

        #word-display {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin: 20px 0;
            min-height: 60px;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
        }

        .letter {
            position: relative;
        }

        .correct { color: var(--correct-color); }
        .wrong { 
            color: var(--wrong-color); 
            animation: shake 0.1s linear 2;
        }
        .current { border-bottom: 3px solid var(--primary-color); }

        #word-input {
            width: 80%;
            padding: 12px 20px;
            font-size: 1.2rem;
            border: 2px solid #45475a;
            border-radius: 8px;
            background-color: #11111b;
            color: #fff;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        #word-input:focus {
            border-color: var(--primary-color);
        }

        #progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #313244;
            border-radius: 4px;
            margin-top: 25px;
            overflow: hidden;
        }

        #progress-bar {
            width: 100%;
            height: 100%;
            background-color: #f38ba8;
            transition: width 0.1s linear;
        }

        /* 經典震動動畫 */
        @keyframes shake {
            0% { transform: translateX(0); }
            50% { transform: translateX(-5px); }
            100% { transform: translateX(5px); }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 27, 0.95);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .hidden { display: none !important; }

        button {
            background-color: var(--primary-color);
            color: #11111b;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #b4befe;
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

<div id="game-container">
    <div class="stats-bar">
        <div>分數: <span id="score">0</span></div>
        <div>WPM: <span id="wpm">0</span></div>
        <div>正確率: <span id="accuracy">100</span>%</div>
    </div>

    <div id="level-display">第 1 關</div>
    
    <div id="word-display"></div>

    <input type="text" id="word-input" autocomplete="off" autofocus placeholder="在此開始打字...">

    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <div id="start-overlay" class="overlay">
        <h2>無限打字挑戰賽</h2>
        <p>考驗你的打字速度與精準度！關卡越高，時間越短。</p>
        <button id="start-btn">開始遊戲</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
        <h2 style="color: var(--wrong-color);">時間到！遊戲結束</h2>
        <p>最終關卡: <span id="final-level">1</span></p>
        <p>最終分數: <span id="final-score">0</span></p>
        <p>平均 WPM: <span id="final-wpm">0</span></p>
        <button id="restart-btn">再試一次</button>
    </div>
</div>

<script>
    // 基礎單字庫（依長度或常用度自動調整）
    const wordBank = [
        "apple", "banana", "cherry", "dragon", "elephant", "forest", "guitar", "honest", "island", "jacket",
        "kitten", "lemon", "monkey", "nature", "orange", "purple", "queen", "rabbit", "shadow", "tiger",
        "umbrella", "violet", "window", "yellow", "zebra", "quantum", "galaxy", "victory", "journey", "horizon",
        "phoenix", "wizard", "crystal", "monarch", "vortex", "eclipse", "miracle", "thunder", "blizzard", "tsunami"
    ];

    // 擴充字母池，用於高關卡隨機生成更長更難的字串
    const alphabet = "abcdefghijklmnopqrstuvwxyz";

    let level = 1;
    let score = 0;
    let currentWord = "";
    let timeLeft = 100; // 百分比
    let timerInterval = null;
    let baseTime = 6000; // 第一關基礎時間 6 秒 (毫秒)
    
    // 數據統計變數
    let totalCorrectKeystrokes = 0;
    let totalKeystrokes = 0;
    let startTime = null;

    const wordDisplay = document.getElementById('word-display');
    const wordInput = document.getElementById('word-input');
    const scoreDisplay = document.getElementById('score');
    const wpmDisplay = document.getElementById('wpm');
    const accuracyDisplay = document.getElementById('accuracy');
    const levelDisplay = document.getElementById('level-display');
    const progressBar = document.getElementById('progress-bar');
    
    const startOverlay = document.getElementById('start-overlay');
    const gameoverOverlay = document.getElementById('gameover-overlay');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // 初始化與事件綁定
    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    wordInput.addEventListener('input', handleInput);

    function startGame() {
        level = 1;
        score = 0;
        totalCorrectKeystrokes = 0;
        totalKeystrokes = 0;
        startTime = Date.now();
        
        startOverlay.classList.add('hidden');
        gameoverOverlay.classList.add('hidden');
        wordInput.value = "";
        wordInput.disabled = false;
        wordInput.focus();

        updateStats();
        nextLevel();
    }

    // 生成當前關卡的單字
    function generateWord(lvl) {
        if (lvl <= 5) {
            // 前 5 關從字庫隨機挑選
            return wordBank[Math.floor(Math.random() * wordBank.length)];
        } else {
            // 5 關以上，根據關卡數動態生成隨機字串，長度遞增
            let length = Math.min(5 + Math.floor(lvl / 3), 15); 
            let randomStr = "";
            for (let i = 0; i < length; i++) {
                randomStr += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
            }
            return randomStr;
        }
    }

    function nextLevel() {
        levelDisplay.innerText = `第 ${level} 關`;
        currentWord = generateWord(level);
        renderWord();
        wordInput.value = "";
        
        // 重新計算時間：每升一關，時間減少（但設有下限 2 秒）
        let gameTime = Math.max(baseTime - (level * 250), 2000); 
        startTimer(gameTime);
    }

    function renderWord() {
        wordDisplay.innerHTML = "";
        currentWord.split("").forEach((char, index) => {
            const span = document.createElement('span');
            span.classList.add('letter');
            if (index === 0) span.classList.add('current');
            span.innerText = char;
            wordDisplay.appendChild(span);
        });
    }

    function handleInput(e) {
        const inputValue = wordInput.value;
        const spans = wordDisplay.querySelectorAll('.letter');
        totalKeystrokes++;

        let isCorrectSoFar = true;

        spans.forEach((span, index) => {
            // 清除之前的狀態
            span.classList.remove('correct', 'wrong', 'current');

            if (index < inputValue.length) {
                if (inputValue['index'] === currentWord['index'] && inputValue[index] === currentWord[index]) {
                    span.classList.add('correct');
                } else {
                    span.classList.add('wrong');
                    isCorrectSoFar = false;
                }
            } else if (index === inputValue.length) {
                span.classList.add('current');
            }
        });

        // 統計精準度
        if (inputValue.length > 0 && inputValue[inputValue.length - 1] === currentWord[inputValue.length - 1]) {
            totalCorrectKeystrokes++;
        }

        updateStats();

        // 過關條件：完全輸入正確且長度相符
        if (inputValue === currentWord) {
            clearInterval(timerInterval);
            score += level * 10; // 越高等分數越多
            level++;
            setTimeout(nextLevel, 100); // 稍微延遲讓玩家看到全綠色的反饋
        }
    }

    function startTimer(duration) {
        clearInterval(timerInterval);
        let elapsed = 0;
        const intervalTime = 50; // 每 50 毫秒更新一次畫面

        timerInterval = setInterval(() => {
            elapsed += intervalTime;
            let percentage = 100 - (elapsed / duration * 100);
            progressBar.style.width = `${Math.max(percentage, 0)}%`;

            if (elapsed >= duration) {
                gameOver();
            }
        }, intervalTime);
    }

    function updateStats() {
        // 計算 WPM (每 5 個正確字元算作一個單字)
        const timePassedMinutes = (Date.now() - startTime) / 60000;
        const wpm = timePassedMinutes > 0 ? Math.round((totalCorrectKeystrokes / 5) / timePassedMinutes) : 0;
        
        // 計算正確率
        const accuracy = totalKeystrokes > 0 ? Math.round((totalCorrectKeystrokes / totalKeystrokes) * 100) : 100;

        scoreDisplay.innerText = score;
        wpmDisplay.innerText = wpm;
        accuracyDisplay.innerText = accuracy;
    }

    function gameOver() {
        clearInterval(timerInterval);
        wordInput.disabled = true;

        document.getElementById('final-level').innerText = level;
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-wpm').innerText = wpmDisplay.innerText;

        gameoverOverlay.classList.remove('hidden');
    }
</script>

</body>
</html>

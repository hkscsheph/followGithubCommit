<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Puzzle Game</title>
    <style>
        body {
            margin: 0;
            background-color: #faf8ef;
            color: #776e65;
            font-family: "Clear Sans", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .header {
            width: 340px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 48px;
            margin: 0;
            font-weight: bold;
        }
        .score-container {
            background: #bbada0;
            padding: 5px 15px;
            border-radius: 3px;
            color: #fff;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        #scoreDisplay {
            font-size: 20px;
            display: block;
        }
        #gameContainer {
            position: relative;
            width: 340px;
            height: 340px;
            background: #bbada0;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 10px;
            width: 100%;
            height: 100%;
        }
        .cell {
            background: rgba(238, 228, 218, 0.35);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: #776e65;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }
        /* Tile Colors based on 2048 values */
        .tile-2 { background: #eee4da; }
        .tile-4 { background: #ede0c8; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 20px; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 20px; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 20px; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 16px; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 16px; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            display: none;
        }
        #overlay h2 { font-size: 32px; margin: 0 0 10px 0; }
        button {
            background: #8f7a66;
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #9e8a78; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

<div class="header">
    <h1>2048</h1>
    <div class="score-container">SCORE<span id="scoreDisplay">0</span></div>
</div>

<div id="gameContainer">
    <div id="overlay">
        <h2 id="overText">Game Over!</h2>
        <button id="restartBtn">Try Again</button>
    </div>
    <div class="grid" id="grid"></div>
</div>

<script>
const gridElement = document.getElementById('grid');
const scoreDisplay = document.getElementById('scoreDisplay');
const overlay = document.getElementById('overlay');
const overText = document.getElementById('overText');
const restartBtn = document.getElementById('restartBtn');

let board = Array(16).fill(0);
let score = 0;
let isPlaying = true;

window.addEventListener('keydown', handleInput);
restartBtn.addEventListener('click', initGame);

function initGame() {
    board = Array(16).fill(0);
    score = 0;
    isPlaying = true;
    overlay.style.display = 'none';
    scoreDisplay.innerText = score;
    spawnTile();
    spawnTile();
    render();
}

function render() {
    gridElement.innerHTML = '';
    for (let i = 0; i < 16; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[i] > 0) {
            cell.innerText = board[i];
            cell.classList.add(`tile-${board[i]}`);
        }
        gridElement.appendChild(cell);
    }
}

function spawnTile() {
    const empties = board.map((val, idx) => val === 0 ? idx : null).filter(val => val !== null);
    if (empties.length > 0) {
        const randomIdx = empties[Math.floor(Math.random() * empties.length)];
        board[randomIdx] = Math.random() < 0.9 ? 2 : 4;
    }
}

function handleInput(e) {
    if (!isPlaying) return;
    let moved = false;

    switch(e.key) {
        case 'ArrowLeft':  case 'a': moved = moveLeft(); break;
        case 'ArrowRight': case 'd': moved = moveRight(); break;
        case 'ArrowUp':    case 'w': moved = moveUp(); break;
        case 'ArrowDown':  case 's': moved = moveDown(); break;
        default: return;
    }

    if (moved) {
        spawnTile();
        render();
        scoreDisplay.innerText = score;
        
        if (checkWin()) {
            endGame(true);
        } else if (checkGameOver()) {
            endGame(false);
        }
    }
}

// Slide and merge row helper logic
function slideRow(row) {
    let filtered = row.filter(val => val !== 0);
    for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
            filtered[i] *= 2;
            score += filtered[i];
            filtered.splice(i + 1, 1);
        }
    }
    while (filtered.length < 4) {
        filtered.push(0);
    }
    return filtered;
}

function moveLeft() {
    let changed = false;
    for (let r = 0; r < 4; r++) {
        let startIdx = r * 4;
        let row = board.slice(startIdx, startIdx + 4);
        let nextRow = slideRow(row);
        if (JSON.stringify(row) !== JSON.stringify(nextRow)) changed = true;
        for (let c = 0; c < 4; c++) board[startIdx + c] = nextRow[c];
    }
    return changed;
}

function moveRight() {
    let changed = false;
    for (let r = 0; r < 4; r++) {
        let startIdx = r * 4;
        let row = board.slice(startIdx, startIdx + 4).reverse();
        let nextRow = slideRow(row).reverse();
        if (JSON.stringify(row.reverse()) !== JSON.stringify(nextRow)) changed = true;
        for (let c = 0; c < 4; c++) board[startIdx + c] = nextRow[c];
    }
    return changed;
}

function moveUp() {
    let changed = false;
    for (let c = 0; c < 4; c++) {
        let row = [board[c], board[c + 4], board[c + 8], board[c + 12]];
        let nextRow = slideRow(row);
        if (JSON.stringify(row) !== JSON.stringify(nextRow)) changed = true;
        for (let r = 0; r < 4; r++) board[c + r * 4] = nextRow[r];
    }
    return changed;
}

function moveDown() {
    let changed = false;
    for (let c = 0; c < 4; c++) {
        let row = [board[c], board[c + 4], board[c + 8], board[c + 12]].reverse();
        let nextRow = slideRow(row).reverse();
        if (JSON.stringify(row.reverse()) !== JSON.stringify(nextRow)) changed = true;
        for (let r = 0; r < 4; r++) board[c + r * 4] = nextRow[r];
    }
    return changed;
}

function checkWin() {
    return board.includes(2048);
}

function checkGameOver() {
    if (board.includes(0)) return false;
    // Check horizontal or vertical matches remaining
    for (let i = 0; i < 16; i++) {
        if (i % 4 < 3 && board[i] === board[i + 1]) return false;
        if (i < 12 && board[i] === board[i + 4]) return false;
    }
    return true;
}

function endGame(won) {
    isPlaying = false;
    overText.innerText = won ? "You Win!" : "Game Over!";
    overlay.style.display = 'flex';
}

// Start game automatically on mount
initGame();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Rescue: Ranking Edition</title>
    <style>
        body {
            margin: 0; background: #0a0a0a;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; color: white; font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        #game-container { position: relative; border: 4px solid #444; border-radius: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        canvas { background: linear-gradient(to bottom, #00b4d8, #0077b6); cursor: none; display: block; border-radius: 11px; }
        .ui-layer {
            position: absolute; top: 15px; width: 100%;
            text-align: center; pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #rank-screen {
            display: none; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            flex-direction: column; justify-content: center; align-items: center;
            border-radius: 11px; z-index: 10;
        }
        .rank-emoji { font-size: 100px; margin-bottom: 10px; }
        button {
            margin-top: 20px; padding: 12px 30px; font-size: 1.1rem; cursor: pointer;
            background: #00f2ff; border: none; border-radius: 50px; font-weight: bold; color: #000;
        }
        button:hover { background: #fff; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

<div id="game-container">
    <div class="ui-layer">
        <h2 id="stats">Level: 1 | Collected: 0/5</h2>
    </div>
    
    <canvas id="gameCanvas"></canvas>

    <div id="rank-screen">
        <h1 style="color: #ffde59;">MISSION ENDED</h1>
        <div id="rank-icon" class="rank-emoji"></div>
        <h2 id="rank-text" style="letter-spacing: 2px;"></h2>
        <p id="final-score" style="font-size: 1.2rem;"></p>
        <button onclick="location.reload()">RETRY CHALLENGE</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stats = document.getElementById('stats');
    const rankScreen = document.getElementById('rank-screen');

    canvas.width = 400;
    canvas.height = 600;

    let level = 1;
    let collected = 0;
    let goal = 5;
    let score = 0;
    let isGameOver = false;
    let playerX = canvas.width / 2;
    
    // Limits to keep the game fair
    let pooCooldown = 0; 

    const drops = [];
    const hazards = [];

    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        playerX = e.clientX - rect.left;
        // Keep fish inside bounds
        if (playerX < 25) playerX = 25;
        if (playerX > canvas.width - 25) playerX = canvas.width - 25;
    });

    function spawn() {
        // Water drops: Spawns if there aren't too many already
        if (Math.random() < 0.03 && drops.length < 3) {
            drops.push({ 
                x: 30 + Math.random() * (canvas.width - 60), 
                y: -20, 
                speed: 2.5 + (level * 0.4) 
            });
        }

        // Poo Hazards: Now with a strict cooldown so they don't "poo too much"
        if (pooCooldown > 0) {
            pooCooldown--;
        } else if (Math.random() < 0.015 && hazards.length < 2) {
            hazards.push({ 
                x: 30 + Math.random() * (canvas.width - 60), 
                y: -20, 
                speed: 3 + (level * 0.3) 
            });
            pooCooldown = 100; // Wait about 1.5 seconds before another can spawn
        }
    }

    function showRanking() {
        isGameOver = true;
        rankScreen.style.display = 'flex';
        let rank = "";
        let emoji = "";

        // Ranking System
        if (score >= 300) { rank = "LEGENDARY WHALE"; emoji = "🐋"; }
        else if (score >= 150) { rank = "GREAT SHARK"; emoji = "🦈"; }
        else if (score >= 70) { rank = "CLEAN FISH"; emoji = "🐠"; }
        else { rank = "MUD SKIPPER"; emoji = "🦐"; }

        document.getElementById('rank-icon').innerText = emoji;
        document.getElementById('rank-text').innerText = rank;

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的心情日記</title>
    <style>
        :root {
            --primary-color: #a2d2ff;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h2 { text-align: center; color: #555; }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
        }

        .mood-options {
            display: flex;
            justify-content: space-around;
            font-size: 1.5rem;
        }

        .mood-options label {
            cursor: pointer;
            transition: transform 0.2s;
            padding: 5px;
        }

        .mood-options input { display: none; }

        .mood-options input:checked + span {
            background: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: #bde0fe;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover { background-color: #a2d2ff; }

        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }

        .log-item {
            background: #fff;
            border-left: 5px solid var(--primary-color);
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .log-date { font-size: 0.8rem; color: #888; }
        .log-mood { font-size: 1.2rem; margin-right: 10px; }
        .delete-btn {
            position: absolute;
            right: 10px;
            top: 10px;
            color: #ffafcc;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🌟 心情記錄日記</h2>
    
    <div class="input-group">
        <div class="mood-options">
            <label><input type="radio" name="mood" value="😊" checked><span>😊</span></label>
            <label><input type="radio" name="mood" value="😕"><span>😕</span></label>
            <label><input type="radio" name="mood" value="😢"><span>😢</span></label>
            <label><input type="radio" name="mood" value="😡"><span>😡</span></label>
            <label><input type="radio" name="mood" value="🤩"><span>🤩</span></label>
        </div>
        <textarea id="note" placeholder="現在在想什麼呢？"></textarea>
        <button onclick="addLog()">記錄</button>
    </div>

    <hr>

    <div id="logs">
        </div>
</div>

<script>
    function addLog() {
        const mood = document.querySelector('input[name="mood"]:checked').value;
        const note = document.getElementById('note').value;
        const logsContainer = document.getElementById('logs');
        
        if (note.trim() === "") {
            alert("寫點東西吧！");
            return;
        }

        const now = new Date();
        const timeString = `${now.getMonth() + 1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

        const logItem = document.createElement('div');
        logItem.className = 'log-item';
        logItem.innerHTML = `
            <span class="delete-btn" onclick="this.parentElement.remove()">刪除</span>
            <div class="log-date">${timeString}</div>
            <div><span class="log-mood">${mood}</span>${note}</div>
        `;

        logsContainer.prepend(logItem);
        
        // 清空輸入框
        document.getElementById('note').value = "";
    }
</script>

</body>
</html>

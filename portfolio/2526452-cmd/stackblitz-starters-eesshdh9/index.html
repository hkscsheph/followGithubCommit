<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字世界編輯器</title>
    <style>
      :root {
        /* 編輯器風格配色 */
        --bg-color: #2b2b2b; /* 外圍介面深灰 */
        --grid-bg: #000000; /* 編輯區全黑 */
        --grid-line: #1a4040; /* 暗青色網格線 */
        --text-color: #cccccc; /* 預設文字色 */
        --border-color: #555555; /* 面板邊界線 */

        /* 物件顏色（保持鮮豔度以在黑底上突顯） */
        --human-color: #ffffff; /* 人類改為白色較像一般文字 */
        --elf-color: #88ff88;
        --dwarf-color: #ffaa44;
        --dragon-color: #ff4444;
        --fire-color: #ff5500;
        --meteor-color: #ffaa00;
        --nuke-color: #33ff33;
        --plague-color: #cc55ff;
        --weapon-color: #00ffff; /* 武器改為青色 */
        --cat-color: #ffbba0;
        --penguin-color: #e0e0e0;
        --sealion-color: #c08050;
        --seal-color: #a0c0d0;
        --boss-color: #ff0055;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        /* 使用明體/細明體來重現圖片中硬朗的文字感 */
        font-family: 'PMingLiU', 'MingLiU', 'Microsoft JhengHei', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        padding: 0;
        height: 100vh;
        box-sizing: border-box;
        user-select: none;
        overflow: hidden;
      }

      /* 模擬應用程式標題列 */
      h1 {
        width: 100%;
        background-color: #d4d4d4;
        color: #000;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 2px;
        margin: 0;
        padding: 4px 10px;
        border-bottom: 2px solid #000;
        text-shadow: none;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      /* 控制面板 - 編輯器工具列風格 */
      .control-panel {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-top: 5px;
        padding: 10px;
        background-color: #1e1e1e;
        border: 1px solid var(--border-color);
        width: 98vw;
        box-sizing: border-box;
      }

      .controls {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-start;
      }

      /* 方正式按鈕 */
      button {
        background: #000;
        color: #ddd;
        border: 1px solid #666;
        padding: 4px 10px;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: none;
        letter-spacing: normal;
      }

      button:hover {
        background: #444;
        color: #fff;
        border-color: #999;
      }

      /* 簡化按鈕邊線，用顏色字體區分 */
      button.btn-human {
        border-left: 4px solid var(--human-color);
      }
      button.btn-elf {
        border-left: 4px solid var(--elf-color);
      }
      button.btn-dwarf {
        border-left: 4px solid var(--dwarf-color);
      }
      button.btn-dragon {
        border-left: 4px solid var(--dragon-color);
      }

      button.btn-cat {
        border-left: 4px solid var(--cat-color);
      }
      button.btn-penguin {
        border-left: 4px solid var(--penguin-color);
      }
      button.btn-sealion {
        border-left: 4px solid var(--sealion-color);
      }
      button.btn-seal {
        border-left: 4px solid var(--seal-color);
      }

      button.btn-fire {
        border-left: 4px solid var(--fire-color);
      }
      button.btn-meteor {
        border-left: 4px solid var(--meteor-color);
      }
      button.btn-nuke {
        border-left: 4px solid var(--nuke-color);
      }
      button.btn-plague {
        border-left: 4px solid var(--plague-color);
      }
      button.btn-weapon {
        border-left: 4px solid var(--weapon-color);
      }

      button.btn-boss {
        border-left: 4px solid var(--boss-color);
        color: var(--boss-color);
      }

      button#btn-audio {
        border-color: #555;
        color: #888;
      }
      button#btn-audio.active {
        color: #000;
        background-color: #88ff88;
        border-color: #55cc55;
      }

      /* 世界網格 - 暗青色網格，貼齊邊緣 */
      #world-container {
        background: var(--grid-bg);
        width: 98vw;
        max-width: 1600px;
        flex: 1;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 10px;
        border: 2px solid #555;
        box-sizing: border-box;
        padding: 0;
      }

      #world {
        display: grid;
        width: 100%;
        height: 100%;
        gap: 0; /* 移除間距，使用 border 繪製網格 */
        border-top: 1px solid var(--grid-line);
        border-left: 1px solid var(--grid-line);
      }

      .cell {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(10px, 2vmin, 20px);
        font-weight: normal;
        border-right: 1px solid var(--grid-line);
        border-bottom: 1px solid var(--grid-line);
        box-sizing: border-box;
        position: relative; /* 供 Boss 的黃色外框定位 */
      }

      /* 統計區 */
      #stats {
        display: flex;
        gap: 20px;
        margin: 5px 0;
        font-size: 14px;
        color: #ccc;
        background: #1e1e1e;
        padding: 5px 15px;
        border: 1px solid #555;
        width: 98vw;
        box-sizing: border-box;
        max-width: 1600px;
      }

      /* 歷史日誌 */
      #log-container {
        width: 98vw;
        max-width: 1600px;
        border: 1px solid #555;
        padding: 5px 10px;
        height: 100px;
        background: #000;
        margin-bottom: 5px;
        position: relative;
        box-sizing: border-box;
        overflow: hidden;
      }

      #log-container::before {
        content: '屬性與日誌';
        position: absolute;
        top: 0;
        right: 0;
        background: #555;
        color: #000;
        padding: 0 5px;
        font-size: 12px;
        font-family: sans-serif;
      }

      #log {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 100%;
        font-size: 13px;
        line-height: 1.4;
      }

      .log-entry {
        opacity: 0.8;
      }

      .log-entry:last-child {
        opacity: 1;
        color: #fff;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <h1>= 文字世界編輯器 v1.0 =</h1>

    <div id="world-container">
      <div id="world"></div>
    </div>

    <div id="stats">
      <span id="stat-human" style="color: var(--human-color)">人: 0</span>
      <span id="stat-elf" style="color: var(--elf-color)">精: 0</span>
      <span id="stat-dwarf" style="color: var(--dwarf-color)">矮: 0</span>
      <span id="stat-dragon" style="color: var(--dragon-color)">龍: 0</span>
      <span id="stat-wild" style="color: #aaaaaa">野: 0</span>
    </div>

    <div id="log-container">
      <div id="log"></div>
    </div>

    <div class="control-panel">
      <div class="controls">
        <button class="btn-human" onclick="spawnEntity('HUMAN')">
          新增 人類
        </button>
        <button class="btn-elf" onclick="spawnEntity('ELF')">新增 精靈</button>
        <button class="btn-dwarf" onclick="spawnEntity('DWARF')">
          新增 矮人
        </button>
        <button class="btn-dragon" onclick="spawnEntity('DRAGON')">
          新增 龍族
        </button>
      </div>
      <div class="controls">
        <button class="btn-cat" onclick="spawnSuperNeutral('CAT')">
          放置 貓咪
        </button>
        <button class="btn-penguin" onclick="spawnSuperNeutral('PENGUIN')">
          放置 企鵝
        </button>
        <button class="btn-sealion" onclick="spawnSuperNeutral('SEALION')">
          放置 海獅
        </button>
        <button class="btn-seal" onclick="spawnSuperNeutral('SEAL')">
          放置 海豹
        </button>
      </div>
      <div class="controls">
        <button class="btn-fire" onclick="triggerDisaster('FIRE')">
          執行 火焰
        </button>
        <button class="btn-meteor" onclick="triggerDisaster('METEOR')">
          執行 隕石
        </button>
        <button class="btn-nuke" onclick="triggerDisaster('NUKE')">
          執行 核彈
        </button>
        <button class="btn-plague" onclick="triggerDisaster('PLAGUE')">
          執行 瘟疫
        </button>
        <button class="btn-weapon" onclick="spawnWeapons()">生成 武器</button>
      </div>
      <div class="controls">
        <button class="btn-boss" onclick="spawnBoss('CHAIN_DRAGON')">
          召喚 鎖刃龍
        </button>
        <button id="btn-audio" onclick="toggleAudio()">音效: 關閉</button>
      </div>
    </div>

    <script>
      // 世界設定
      const WORLD_WIDTH = 35;
      const WORLD_HEIGHT = 18;
      const TICK_RATE = 800; // 更新頻率 (毫秒)
      const MAX_POPULATION_PER_RACE = 20; // 每個種族的繁殖數量上限
      const MAX_BUILDINGS_PER_RACE = 2; // 每個種族的建築數量上限

      // 武器設定
      const WEAPON_TYPES = [
        { id: 'SWORD', name: '劍', char: '劍', color: '#cccccc', bonus: 1 },
        { id: 'SPEAR', name: '長槍', char: '槍', color: '#aaccaa', bonus: 1 },
        {
          id: 'GREATSWORD',
          name: '大劍',
          char: '斬',
          color: '#ffaaaa',
          bonus: 2,
        },
      ];

      // 種族設定
      const RACES = {
        HUMAN: {
          id: 'HUMAN',
          name: '人類',
          stages: ['人', '兵', '將', '王'],
          color: 'var(--human-color)',
          buildingChar: '城',
          buildingName: '城塞',
          buildingColor: '#aaaaaa',
        },
        ELF: {
          id: 'ELF',
          name: '精靈',
          stages: ['精', '靈', '賢', '聖'],
          color: 'var(--elf-color)',
          buildingChar: '樹',
          buildingName: '聖樹',
          buildingColor: '#66aa66',
        },
        DWARF: {
          id: 'DWARF',
          name: '矮人',
          stages: ['矮', '匠', '鋼', '鑽'],
          color: 'var(--dwarf-color)',
          buildingChar: '堡',
          buildingName: '堡壘',
          buildingColor: '#886644',
        },
        DRAGON: {
          id: 'DRAGON',
          name: '龍族',
          stages: ['龍', '魔', '霸', '祖'],
          color: 'var(--dragon-color)',
          buildingChar: '巢',
          buildingName: '龍巢',
          buildingColor: '#aa4444',
        },
      };

      // 中立/野生生物設定
      const NEUTRALS = {
        SLIME: {
          id: 'SLIME',
          name: '史萊姆',
          stages: ['史'],
          color: '#55ccaa',
        },
        BEAST: { id: 'BEAST', name: '野獸', stages: ['獸'], color: '#aa8855' },
      };

      const SUPER_NEUTRALS = {
        CAT: {
          id: 'CAT',
          name: '貓咪',
          stages: ['貓'],
          color: 'var(--cat-color)',
        },
        PENGUIN: {
          id: 'PENGUIN',
          name: '企鵝',
          stages: ['企'],
          color: 'var(--penguin-color)',
        },
        SEALION: {
          id: 'SEALION',
          name: '海獅',
          stages: ['獅'],
          color: 'var(--sealion-color)',
        },
        SEAL: {
          id: 'SEAL',
          name: '海豹',
          stages: ['豹'],
          color: 'var(--seal-color)',
        },
      };

      const BOSSES = {
        CHAIN_DRAGON: {
          id: 'CHAIN_DRAGON',
          name: '鎖刃龍',
          stages: ['鎖'],
          color: 'var(--boss-color)',
        },
      };

      const DISASTERS = {
        FIRE: {
          name: '火焰',
          radius: 2,
          char: '炎',
          color: 'var(--fire-color)',
        },
        METEOR: {
          name: '隕石',
          radius: 5,
          char: '隕',
          color: 'var(--meteor-color)',
        },
        NUKE: {
          name: '核彈',
          radius: 15,
          char: '核',
          color: 'var(--nuke-color)',
        },
        PLAGUE: {
          name: '瘟疫',
          radius: 4,
          char: '毒',
          color: 'var(--plague-color)',
        },
      };

      // 修改：空白格子不顯示點，依靠 CSS 網格線
      const EMPTY_CHAR = '';

      // 狀態
      let entities = [];
      let domGrid = [];
      let logs = [];
      let effects = [];
      let buildings = [];
      let items = [];

      let isPlagueActive = false;
      let plagueCapacity = 0;

      // --- 音效引擎 (Web Audio API) ---
      let audioCtx;
      let isAudioEnabled = false;
      let bgmOscillator;
      let bgmGain;
      let bgmLfo;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function toggleAudio() {
        const btn = document.getElementById('btn-audio');
        if (!isAudioEnabled) {
          initAudio();
          isAudioEnabled = true;
          btn.innerText = '音效: 開啟';
          btn.classList.add('active');
          playBGM();
          addLog('系統', '已開啟背景音樂與音效。', '#88ff88');
        } else {
          isAudioEnabled = false;
          btn.innerText = '音效: 關閉';
          btn.classList.remove('active');
          stopBGM();
          addLog('系統', '已關閉音效。', '#aaaaaa');
        }
      }

      function playSfx(type) {
        if (!isAudioEnabled || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'spawn') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
          gainNode.gain.setValueAtTime(0.05, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'hit') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
          gainNode.gain.setValueAtTime(0.05, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'disaster') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(100, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.8);
          gainNode.gain.setValueAtTime(0.1, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
          osc.start(now);
          osc.stop(now + 0.8);
        } else if (type === 'weapon') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
          gainNode.gain.setValueAtTime(0.05, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'boss') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(50, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 1.5);
          gainNode.gain.setValueAtTime(0.15, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
          osc.start(now);
          osc.stop(now + 1.5);
        } else if (type === 'build') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.setValueAtTime(800, now + 0.05);
          gainNode.gain.setValueAtTime(0.05, now);
          gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        }
      }

      function playBGM() {
        if (bgmOscillator) return;
        bgmOscillator = audioCtx.createOscillator();
        bgmGain = audioCtx.createGain();
        bgmOscillator.type = 'triangle';
        bgmOscillator.frequency.value = 55;

        bgmLfo = audioCtx.createOscillator();
        bgmLfo.type = 'sine';
        bgmLfo.frequency.value = 0.1;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 5;
        bgmLfo.connect(lfoGain);
        lfoGain.connect(bgmOscillator.frequency);

        bgmGain.gain.value = 0.03;

        bgmOscillator.connect(bgmGain);
        bgmGain.connect(audioCtx.destination);

        bgmOscillator.start();
        bgmLfo.start();
      }

      function stopBGM() {
        if (bgmOscillator) {
          bgmOscillator.stop();
          if (bgmLfo) bgmLfo.stop();
          bgmOscillator.disconnect();
          bgmOscillator = null;
        }
      }

      // 初始化 DOM 網格
      function initWorld() {
        const worldEl = document.getElementById('world');

        worldEl.style.gridTemplateColumns = `repeat(${WORLD_WIDTH}, 1fr)`;
        worldEl.style.gridTemplateRows = `repeat(${WORLD_HEIGHT}, 1fr)`;

        for (let y = 0; y < WORLD_HEIGHT; y++) {
          domGrid[y] = [];
          for (let x = 0; x < WORLD_WIDTH; x++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = EMPTY_CHAR;
            worldEl.appendChild(cell);
            domGrid[y][x] = cell;
          }
        }

        addLog('系統', '網格初始化完成，等待編譯...');
        updateStats();
        setInterval(worldTick, TICK_RATE);
      }

      function spawnEntity(raceId) {
        let attempts = 0;
        let x, y;
        do {
          x = Math.floor(Math.random() * WORLD_WIDTH);
          y = Math.floor(Math.random() * WORLD_HEIGHT);
          attempts++;
        } while (getEntityAt(x, y) && attempts < 50);

        if (attempts >= 50) return;

        const race = RACES[raceId];
        entities.push({
          race: race,
          level: 0,
          hp: 2,
          weapon: null,
          x: x,
          y: y,
          id: Math.random().toString(36).substr(2, 9),
        });

        playSfx('spawn');
        addLog('生成', `【${race.name}】建立於 (${x}, ${y})。`, race.color);
        drawWorld();
        updateStats();
      }

      function spawnWeapons() {
        let count = 3 + Math.floor(Math.random() * 3);
        let spawned = 0;
        for (let i = 0; i < count; i++) {
          let x = Math.floor(Math.random() * WORLD_WIDTH);
          let y = Math.floor(Math.random() * WORLD_HEIGHT);

          if (!getEntityAt(x, y) && !getBuildingAt(x, y) && !getItemAt(x, y)) {
            let wType =
              WEAPON_TYPES[Math.floor(Math.random() * WEAPON_TYPES.length)];
            items.push({
              x: x,
              y: y,
              type: wType,
              id: Math.random().toString(36).substr(2, 9),
            });
            spawned++;
          }
        }
        if (spawned > 0) {
          playSfx('weapon');
          addLog('系統', `生成了 ${spawned} 件武器。`, 'var(--weapon-color)');
          drawWorld();
        }
      }

      function getEntityAt(x, y) {
        return entities.find((e) => e.x === x && e.y === y);
      }
      function getBuildingAt(x, y) {
        return buildings.find((b) => b.x === x && b.y === y);
      }
      function getItemAt(x, y) {
        return items.find((i) => i.x === x && i.y === y);
      }

      function spawnNeutral() {
        const types = Object.keys(NEUTRALS);
        const availableTypes = types.filter(
          (type) => entities.filter((e) => e.race.id === type).length < 5
        );
        if (availableTypes.length === 0) return;

        let attempts = 0;
        let x, y;
        do {
          x = Math.floor(Math.random() * WORLD_WIDTH);
          y = Math.floor(Math.random() * WORLD_HEIGHT);
          attempts++;
        } while ((getEntityAt(x, y) || getBuildingAt(x, y)) && attempts < 10);

        if (attempts < 10) {
          const raceId =
            availableTypes[Math.floor(Math.random() * availableTypes.length)];
          const race = NEUTRALS[raceId];
          entities.push({
            race: race,
            level: 0,
            hp: race.id === 'BEAST' ? 2 : 1,
            weapon: null,
            x: x,
            y: y,
            isNeutral: true,
            id: Math.random().toString(36).substr(2, 9),
          });
          updateStats();
        }
      }

      function spawnSuperNeutral(id) {
        const race = SUPER_NEUTRALS[id];
        let currentCount = entities.filter((e) => e.race.id === id).length;
        if (currentCount >= 5) return;

        let attempts = 0;
        let x, y;
        do {
          x = Math.floor(Math.random() * WORLD_WIDTH);
          y = Math.floor(Math.random() * WORLD_HEIGHT);
          attempts++;
        } while (getEntityAt(x, y) && attempts < 50);

        if (attempts >= 50) return;

        entities.push({
          race: race,
          level: 0,
          hp: 2,
          weapon: null,
          x: x,
          y: y,
          isNeutral: true,
          isSuperNeutral: true,
          id: Math.random().toString(36).substr(2, 9),
        });

        playSfx('spawn');
        addLog('放置', `【${race.name}】放置於 (${x}, ${y})。`, race.color);
        drawWorld();
        updateStats();
      }

      function spawnBoss(id) {
        const race = BOSSES[id];
        if (entities.filter((e) => e.isBoss).length >= 1) return;

        let attempts = 0;
        let x, y;
        do {
          x = Math.floor(Math.random() * WORLD_WIDTH);
          y = Math.floor(Math.random() * WORLD_HEIGHT);
          attempts++;
        } while (getEntityAt(x, y) && attempts < 50);

        if (attempts >= 50) return;

        entities.push({
          race: race,
          level: 0,
          hp: 40,
          weapon: {
            id: 'CHAIN_BLADE',
            name: '真·鎖刃',
            char: '刃',
            color: 'var(--boss-color)',
            bonus: 4,
          },
          x: x,
          y: y,
          isNeutral: false,
          isBoss: true,
          id: Math.random().toString(36).substr(2, 9),
        });

        playSfx('boss');
        addLog('事件', `⚠️ 終極實體【${race.name}】已載入！`, race.color);
        drawWorld();
        updateStats();
      }

      function applyDamage(entity, amount) {
        entity.hp -= amount;
        if (entity.hp <= 0) {
          if (trySurvive(entity)) {
            entity.hp = 1;
            return false;
          }
          return true;
        }
        return false;
      }

      function trySurvive(entity) {
        const survivalRates = [0, 0.4, 0.7, 0.95];
        if (Math.random() < survivalRates[entity.level]) {
          if (Math.random() < 0.2)
            addLog(
              '狀態',
              `【${entity.race.stages[entity.level]}】抵抗了銷毀。`,
              entity.race.color
            );
          return true;
        }
        return false;
      }

      function endPlague() {
        isPlagueActive = false;
        for (let e of entities) e.isInfected = false;
      }

      function worldTick() {
        if (
          entities.length === 0 &&
          effects.length === 0 &&
          buildings.length === 0
        )
          return;

        let wildCount = entities.filter((e) => e.isNeutral).length;
        if (wildCount < 25 && Math.random() < 0.2) spawnNeutral();

        effects = effects.filter((ef) => {
          ef.life -= 1;
          return ef.life > 0;
        });

        let shuffledEntities = [...entities].sort(() => Math.random() - 0.5);
        let toRemove = new Set();
        let activeInfections = 0;

        for (let e of shuffledEntities) {
          if (toRemove.has(e.id)) continue;

          if (e.isInfected) {
            activeInfections++;
            if (Math.random() < 0.08) {
              if (applyDamage(e, 1)) {
                toRemove.add(e.id);
                plagueCapacity--;
                if (plagueCapacity <= 0) endPlague();
                continue;
              }
            }
            if (isPlagueActive && Math.random() < 0.2) {
              for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                  if (dx === 0 && dy === 0) continue;
                  let neighbor = getEntityAt(e.x + dx, e.y + dy);
                  if (
                    neighbor &&
                    !neighbor.isInfected &&
                    !toRemove.has(neighbor.id) &&
                    !neighbor.isBoss
                  ) {
                    if (Math.random() < 0.4) neighbor.isInfected = true;
                  }
                }
              }
            }
          }

          if (e.hp === 1 && Math.random() < 0.02) e.hp = 2;

          if (!e.isNeutral && !e.isBoss && e.level < 3) {
            let evoChance =
              e.level === 0 ? 0.01 : e.level === 1 ? 0.005 : 0.001;
            if (Math.random() < evoChance) {
              e.level++;
              addLog(
                '升級',
                `【${e.race.name}】屬性提升為【${e.race.stages[e.level]}】。`,
                '#ffffbb'
              );
            }
          }

          let raceBuildingCount = buildings.filter(
            (b) => b.race.id === e.race.id
          ).length;
          if (
            !e.isNeutral &&
            !e.isBoss &&
            raceBuildingCount < MAX_BUILDINGS_PER_RACE &&
            Math.random() < 0.005 &&
            !getBuildingAt(e.x, e.y)
          ) {
            buildings.push({
              race: e.race,
              x: e.x,
              y: e.y,
              hp: 4,
              id: Math.random().toString(36).substr(2, 9),
            });
            playSfx('build');
          }

          let dx = Math.floor(Math.random() * 3) - 1;
          let dy = Math.floor(Math.random() * 3) - 1;

          if (dx === 0 && dy === 0) continue;

          let nx = e.x + dx;
          let ny = e.y + dy;
          if (nx < 0 || nx >= WORLD_WIDTH || ny < 0 || ny >= WORLD_HEIGHT)
            continue;

          let targetEntity = getEntityAt(nx, ny);
          let targetBuilding = getBuildingAt(nx, ny);

          if (!targetEntity) {
            if (targetBuilding && targetBuilding.race.id !== e.race.id) {
              if (e.isNeutral) continue;
              let dmg =
                e.race.id === 'DRAGON' || e.level >= 2 || e.isBoss ? 3 : 1;
              if (e.weapon) dmg += e.weapon.bonus;

              targetBuilding.hp -= dmg;
              if (targetBuilding.hp <= 0) {
                buildings = buildings.filter((b) => b.id !== targetBuilding.id);
                e.x = nx;
                e.y = ny;
              }
            } else {
              e.x = nx;
              e.y = ny;
            }
          } else if (!toRemove.has(targetEntity.id)) {
            handleInteraction(e, targetEntity, toRemove);
          }
        }

        if (toRemove.size > 0) {
          for (let e of entities) {
            if (toRemove.has(e.id) && e.weapon)
              items.push({
                x: e.x,
                y: e.y,
                type: e.weapon,
                id: Math.random().toString(36).substr(2, 9),
              });
          }
          entities = entities.filter((e) => !toRemove.has(e.id));
          updateStats();
        }

        for (let e of entities) {
          if (!e.weapon && !e.isNeutral) {
            let itemOnGround = getItemAt(e.x, e.y);
            if (itemOnGround) {
              e.weapon = itemOnGround.type;
              items = items.filter((i) => i.id !== itemOnGround.id);
              playSfx('weapon');
              addLog(
                '裝備',
                `【${e.race.stages[e.level]}】裝備了【${e.weapon.name}】。`,
                'var(--weapon-color)'
              );
            }
          }
        }

        if (isPlagueActive && activeInfections === 0 && toRemove.size === 0)
          isPlagueActive = false;
        drawWorld();
      }

      function tryReproduce(parent) {
        let raceCount = entities.filter(
          (e) => e.race.id === parent.race.id
        ).length;
        if (raceCount >= MAX_POPULATION_PER_RACE) return;

        if (Math.random() < 0.15) {
          let emptySpots = [];
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              let nx = parent.x + dx;
              let ny = parent.y + dy;
              if (nx >= 0 && nx < WORLD_WIDTH && ny >= 0 && ny < WORLD_HEIGHT) {
                if (!getEntityAt(nx, ny)) emptySpots.push({ x: nx, y: ny });
              }
            }
          }

          if (emptySpots.length > 0) {
            let spot =
              emptySpots[Math.floor(Math.random() * emptySpots.length)];
            entities.push({
              race: parent.race,
              level: 0,
              hp: 2,
              weapon: null,
              x: spot.x,
              y: spot.y,
              id: Math.random().toString(36).substr(2, 9),
            });
            if (Math.random() < 0.2) playSfx('spawn');
            updateStats();
          }
        }
      }

      function handleInteraction(attacker, defender, toRemove) {
        if (attacker.isSuperNeutral || defender.isSuperNeutral) return;

        if (attacker.isBoss || defender.isBoss) {
          let boss = attacker.isBoss ? attacker : defender;
          let victim = attacker.isBoss ? defender : attacker;
          if (victim.isBoss) return;

          if (applyDamage(victim, 5)) {
            toRemove.add(victim.id);
            playSfx('hit');
            if (attacker.isBoss) {
              attacker.x = defender.x;
              attacker.y = defender.y;
            }
          }

          let counterChance =
            victim.level * 0.15 + (victim.weapon ? 0.2 : 0.05);
          if (Math.random() < counterChance && !toRemove.has(victim.id)) {
            let dmg = victim.weapon ? victim.weapon.bonus : 1;
            if (applyDamage(boss, dmg)) {
              addLog('事件', `目標【${boss.race.name}】已被銷毀。`, '#ffcc00');
              toRemove.add(boss.id);
              playSfx('hit');
            }
          }
          return;
        }

        if (attacker.race.id === defender.race.id) {
          if (!attacker.isNeutral && !defender.isNeutral)
            tryReproduce(attacker);
          return;
        }
        if (attacker.isNeutral && defender.isNeutral) return;

        if (attacker.race.id === 'DRAGON') {
          if (applyDamage(defender, 2)) {
            toRemove.add(defender.id);
            playSfx('hit');
            attacker.x = defender.x;
            attacker.y = defender.y;
          }
          return;
        }
        if (defender.race.id === 'DRAGON') {
          if (applyDamage(attacker, 2)) {
            toRemove.add(attacker.id);
            playSfx('hit');
          }
          return;
        }

        if (defender.isNeutral && !attacker.isNeutral) {
          if (applyDamage(defender, 1)) {
            attacker.hp = 2;
            toRemove.add(defender.id);
            playSfx('hit');
            attacker.x = defender.x;
            attacker.y = defender.y;
          }
          return;
        }
        if (attacker.isNeutral && !defender.isNeutral) {
          if (attacker.race.id === 'BEAST') {
            if (applyDamage(defender, 1)) {
              toRemove.add(defender.id);
              playSfx('hit');
              attacker.x = defender.x;
              attacker.y = defender.y;
            }
          }
          return;
        }

        if (Math.random() > 0.5) {
          let winner, loser;
          let attackerAdvantage = attacker.level - defender.level;
          if (attacker.weapon) attackerAdvantage += attacker.weapon.bonus;
          if (defender.weapon) attackerAdvantage -= defender.weapon.bonus;

          if (Math.random() > 0.5 - attackerAdvantage * 0.15) {
            winner = attacker;
            loser = defender;
          } else {
            winner = defender;
            loser = attacker;
          }

          if (applyDamage(loser, 1)) {
            toRemove.add(loser.id);
            playSfx('hit');
            if (winner === attacker) {
              attacker.x = defender.x;
              attacker.y = defender.y;
            }
          } else {
            playSfx('hit');
          }
        }
      }

      // 修改：完全重構的渲染引擎，極致模仿編輯器 UI
      function drawWorld() {
        // 重置所有網格
        for (let y = 0; y < WORLD_HEIGHT; y++) {
          for (let x = 0; x < WORLD_WIDTH; x++) {
            let cell = domGrid[y][x];
            cell.innerText = EMPTY_CHAR;
            cell.style.color = 'var(--text-color)';
            cell.style.outline = 'none';
            cell.style.textDecoration = 'none';
            cell.style.backgroundColor = 'transparent';
            cell.style.fontWeight = 'normal';
            cell.style.zIndex = '1';
          }
        }

        // 繪製建築 (用背景色反白標示)
        for (let b of buildings) {
          let cell = domGrid[b.y][b.x];
          cell.innerText = b.race.buildingChar;
          cell.style.color = b.race.buildingColor;
        }

        // 繪製地上的武器
        for (let item of items) {
          let cell = domGrid[item.y][item.x];
          cell.innerText = item.type.char;
          cell.style.color = item.type.color;
        }

        // 繪製生物
        for (let e of entities) {
          let cell = domGrid[e.y][e.x];

          // 為了保持網格方正，強制只顯示一個字元
          let charStr = e.race.stages[e.level];

          // 建築與生物重疊時加底色區分
          if (getBuildingAt(e.x, e.y)) {
            cell.style.backgroundColor = '#333333';
          }

          if (e.isBoss) {
            charStr = e.race.stages[0]; // 只取第一字，例如「鎖」
            cell.style.outline = `2px solid #ffff00`; // 模仿圖片中的黃色選取框
            cell.style.outlineOffset = '-2px'; // 讓框不蓋掉網格線
            cell.style.zIndex = '10';
            cell.style.color = e.race.color;
          } else {
            cell.style.color = e.race.color;
            if (e.level >= 2 && !e.isNeutral) {
              cell.style.fontWeight = 'bold'; // 高等級稍微加粗
            }
          }

          // 若裝備武器，則以武器顏色的底線表示，不另外塞字
          if (e.weapon && !e.isBoss) {
            cell.style.textDecoration = 'underline';
            cell.style.textDecorationColor = e.weapon.color;
            cell.style.textDecorationThickness = '2px';
          }

          // 特殊狀態顯示優先級最高
          if (e.hp === 1 && Math.random() < 0.4) {
            charStr = '危';
            cell.style.color = '#ff4444';
          } else if (e.isInfected && Math.random() < 0.3) {
            charStr = '病';
            cell.style.color = 'var(--plague-color)';
          }

          cell.innerText = charStr;
        }

        // 繪製特效
        for (let ef of effects) {
          if (
            ef.y >= 0 &&
            ef.y < WORLD_HEIGHT &&
            ef.x >= 0 &&
            ef.x < WORLD_WIDTH
          ) {
            let cell = domGrid[ef.y][ef.x];
            cell.innerText = ef.char;
            cell.style.color = ef.color;
            cell.style.backgroundColor = 'rgba(100, 0, 0, 0.4)'; // 天災有暗紅底色
          }
        }
      }

      function triggerDisaster(type) {
        const d = DISASTERS[type];
        const cx = Math.floor(Math.random() * WORLD_WIDTH);
        const cy = Math.floor(Math.random() * WORLD_HEIGHT);

        let casualties = 0;
        let infectedCount = 0;
        let toRemove = new Set();
        let bToRemove = new Set();

        for (let y = 0; y < WORLD_HEIGHT; y++) {
          for (let x = 0; x < WORLD_WIDTH; x++) {
            const dist = Math.hypot(x - cx, y - cy);
            if (dist <= d.radius) {
              let entity = getEntityAt(x, y);
              if (entity) {
                if (type === 'PLAGUE') {
                  if (!entity.isInfected && !entity.isBoss) {
                    entity.isInfected = true;
                    infectedCount++;
                  }
                } else {
                  if (applyDamage(entity, 2)) {
                    toRemove.add(entity.id);
                    casualties++;
                  }
                }
              }

              if (type !== 'PLAGUE') {
                let building = getBuildingAt(x, y);
                if (building) {
                  building.hp -= 5;
                  if (building.hp <= 0) bToRemove.add(building.id);
                }
              }
              effects.push({
                x: x,
                y: y,
                char: d.char,
                color: d.color,
                life: 2 + Math.random() * 3,
              });
            }
          }
        }

        if (toRemove.size > 0) {
          for (let e of entities) {
            if (toRemove.has(e.id) && e.weapon)
              items.push({
                x: e.x,
                y: e.y,
                type: e.weapon,
                id: Math.random().toString(36).substr(2, 9),
              });
          }
          entities = entities.filter((e) => !toRemove.has(e.id));
          updateStats();
        }

        if (bToRemove.size > 0)
          buildings = buildings.filter((b) => !bToRemove.has(b.id));

        if (type === 'PLAGUE') {
          if (infectedCount > 0) {
            if (!isPlagueActive) {
              isPlagueActive = true;
              plagueCapacity = Math.max(3, Math.floor(entities.length * 0.4));
            }
            addLog(
              '執行',
              `執行程式碼【${d.name}】，影響範圍 ${infectedCount}。`,
              d.color
            );
            playSfx('disaster');
          }
        } else {
          addLog(
            '執行',
            `執行程式碼【${d.name}】，銷毀物件 ${casualties}。`,
            d.color
          );
          playSfx('disaster');
        }
        drawWorld();
      }

      function updateStats() {
        let counts = { HUMAN: 0, ELF: 0, DWARF: 0, DRAGON: 0, WILD: 0 };
        for (let e of entities) {
          if (e.isNeutral) counts.WILD++;
          else counts[e.race.id]++;
        }
        document.getElementById('stat-human').innerText = `人: ${counts.HUMAN}`;
        document.getElementById('stat-elf').innerText = `精: ${counts.ELF}`;
        document.getElementById('stat-dwarf').innerText = `矮: ${counts.DWARF}`;
        document.getElementById(
          'stat-dragon'
        ).innerText = `龍: ${counts.DRAGON}`;
        document.getElementById('stat-wild').innerText = `野: ${counts.WILD}`;
      }

      function addLog(type, message, color = 'var(--text-color)') {
        const logEl = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString('en-US', {
          hour12: false,
          hour: 'numeric',
          minute: 'numeric',
          second: 'numeric',
        });
        entry.innerHTML = `<span style="color:#777">[${time}] ${type} &gt;</span> <span style="color:${color}">${message}</span>`;

        logEl.appendChild(entry);
        logs.push(entry);
        if (logs.length > 5) {
          let oldEntry = logs.shift();
          logEl.removeChild(oldEntry);
        }
      }

      window.onload = initWorld;
    </script>
  </body>

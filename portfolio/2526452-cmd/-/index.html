<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 即時聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* 簡單的 CSS 樣式讓介面好看一點 */
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; background-color: #f4f4f9; }
        h2 { text-align: center; color: #333; }
        
        #chat-window {
            border: 1px solid #ddd;
            background: white;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .message { margin-bottom: 8px; padding: 8px; border-radius: 5px; background: #eee; max-width: 80%; }
        .message strong { color: #2c3e50; }
        .message .time { font-size: 0.7em; color: #666; margin-left: 5px; }

        .controls { display: flex; gap: 5px; }
        input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #username { width: 20%; }
        #message-input { flex-grow: 1; }
        button { padding: 10px 20px; background-color: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #34b379; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

    <h2>💬 即時聊天室</h2>

    <div id="chat-window">
        <div style="text-align:center; color:#888; margin-top: 20px;">載入中...</div>
    </div>

    <div class="controls">
        <input type="text" id="username" placeholder="暱稱" value="訪客">
        <input type="text" id="message-input" placeholder="輸入訊息..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">傳送</button>
    </div>

    <script>
        // --- 1. Supabase 設定 ---
        // 使用你提供的 Publishable Key (注意：這裡不使用 Secret Key)
        const SUPABASE_URL = 'https://gzojagtmyrptkrpirxqy.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_A3LiEJYlX0zBPcIQ0Drw-Q_0oOepQg1'; 

        // 初始化客戶端
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const chatWindow = document.getElementById('chat-window');
        const messageInput = document.getElementById('message-input');
        const usernameInput = document.getElementById('username');
        const sendBtn = document.getElementById('send-btn');

        // --- 2. 載入歷史訊息 ---
        async function fetchMessages() {
            const { data, error } = await _supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true }) // 舊訊息在上面
                .limit(50); // 限制只抓最後 50 筆

            if (error) {
                console.error('讀取錯誤:', error);
                chatWindow.innerHTML = `<div style="text-align:center; color:red;">讀取失敗，請檢查 Console</div>`;
            } else {
                chatWindow.innerHTML = ''; // 清空載入文字
                data.forEach(msg => appendMessage(msg));
                scrollToBottom();
            }
        }

        // --- 3. 監聽即時更新 (Realtime) ---
        function subscribeToMessages() {
            const channel = _supabase
                .channel('room1') // 定義頻道名稱
                .on(
                    'postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'messages' }, 
                    (payload) => {
                        console.log('收到新訊息:', payload);
                        appendMessage(payload.new); // 將新訊息加入畫面
                        scrollToBottom();
                    }
                )
                .subscribe();
        }

        // --- 4. 發送訊息功能 ---
        async function sendMessage() {
            const content = messageInput.value.trim();
            const username = usernameInput.value.trim() || '匿名';

            if (!content) return;

            // 鎖定按鈕避免重複發送
            sendBtn.disabled = true;
            sendBtn.innerText = '傳送中...';

            const { error } = await _supabase
                .from('messages')
                .insert([{ content: content, username: username }]);

            if (error) {
                alert('發送失敗: ' + error.message);
                console.error(error);
            } else {
                messageInput.value = ''; // 清空輸入框
            }

            // 恢復按鈕
            sendBtn.disabled = false;
            sendBtn.innerText = '傳送';
        }

        // --- 輔助功能：將訊息加到 DOM ---
        function appendMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';
            
            // 簡單的時間格式化
            const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // 避免 XSS 攻擊 (將 HTML 標籤轉義)
            const safeUsername = escapeHtml(msg.username);
            const safeContent = escapeHtml(msg.content);

            div.innerHTML = `<strong>${safeUsername}</strong><span class="time">${time}</span><br>${safeContent}`;
            chatWindow.appendChild(div);
        }

        // 捲動到底部
        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // 防 XSS 簡單處理
        function escapeHtml(text) {
            if (!text) return text;
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // 綁定 Enter 鍵發送
        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        // --- 程式進入點 ---
        fetchMessages();     // 1. 抓舊資料
        subscribeToMessages(); // 2. 訂閱新資料

    </script>
</body>
</html>

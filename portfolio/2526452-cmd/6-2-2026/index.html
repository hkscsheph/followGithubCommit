<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>死寂聊天室</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Metal+Mania&family=Special+Elite&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- 全局設定：黑暗與血色 --- */
      body {
        background-color: #050505;
        color: #b30000; /* 暗紅色文字 */
        font-family: 'Special Elite', cursive; /* 打字機風格 */
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-image: radial-gradient(circle, transparent 20%, #000 90%),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 1px,
            #111 1px,
            #111 2px
          );
        background-size: cover;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 標題特效 */
      h2 {
        font-family: 'Creepster', system-ui;
        text-align: center;
        font-size: 3em;
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 4px 4px 0px #330000;
        animation: flicker 3s infinite;
        margin-bottom: 5px;
      }

      /* 狀態列 */
      #status-bar {
        text-align: center;
        color: #555;
        font-family: 'Metal Mania', cursive;
        margin-bottom: 20px;
        letter-spacing: 2px;
      }

      /* --- 聊天視窗：舊螢幕風格 --- */
      #chat-window {
        border: 2px solid #550000;
        background: rgba(10, 0, 0, 0.8);
        height: 500px;
        overflow-y: scroll;
        padding: 20px;
        box-shadow: 0 0 20px rgba(139, 0, 0, 0.3) inset;
        position: relative;
        scrollbar-width: thin;
        scrollbar-color: #500 #111;
      }

      /* 捲軸美化 */
      #chat-window::-webkit-scrollbar {
        width: 10px;
      }
      #chat-window::-webkit-scrollbar-track {
        background: #111;
      }
      #chat-window::-webkit-scrollbar-thumb {
        background: #600;
        border-radius: 5px;
      }

      /* --- 訊息氣泡：撕裂感 --- */
      .message {
        margin-bottom: 20px;
        padding: 15px;
        border-left: 4px solid #800;
        background: linear-gradient(
          90deg,
          rgba(50, 0, 0, 0.4) 0%,
          transparent 100%
        );
        position: relative;
        animation: slideIn 0.3s ease-out;
      }

      .message strong {
        color: #ff4444;
        font-size: 1.2em;
        font-family: 'Metal Mania', cursive;
        letter-spacing: 1px;
      }

      .time {
        font-size: 0.7em;
        color: #444;
        float: right;
      }

      .message div {
        margin-top: 5px;
        color: #ccc;
        text-shadow: 1px 1px 2px #000;
      }

      /* --- 多媒體特效：尋獲錄影帶風格 --- */
      video {
        width: 100%;
        border: 1px solid #333;
        /* 讓影片看起來像舊錄影帶 */
        filter: sepia(0.5) contrast(1.2) hue-rotate(-20deg) grayscale(0.3);
        margin-top: 10px;
      }
      audio {
        width: 100%;
        filter: invert(1); /* 反轉顏色讓播放器變黑 */
        margin-top: 10px;
      }

      /* --- 控制區：儀式祭壇 --- */
      .controls {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        border-top: 1px solid #333;
        padding-top: 20px;
      }

      input[type='text'] {
        background: #000;
        border: 1px solid #500;
        color: #fff;
        padding: 12px;
        font-family: 'Special Elite', cursive;
        outline: none;
      }
      input[type='text']:focus {
        border-color: #f00;
        box-shadow: 0 0 10px #500;
      }

      #username {
        width: 20%;
      }
      #message-input {
        flex-grow: 1;
      }

      /* --- 按鈕：符咒風格 --- */
      button {
        background-color: #220000;
        color: #a00;
        border: 1px solid #600;
        padding: 10px 20px;
        cursor: pointer;
        font-family: 'Special Elite', cursive;
        font-weight: bold;
        transition: all 0.2s;
        text-transform: uppercase;
      }

      button:hover {
        background-color: #500;
        color: #fff;
        box-shadow: 0 0 15px #f00;
        text-shadow: 0 0 5px #fff;
      }

      /* 錄音中特效：脈動的心臟 */
      #record-btn.recording {
        background-color: #800;
        color: #fff;
        border-color: #f00;
        animation: heartbeat 1s infinite;
      }

      /* --- 動畫定義 --- */
      @keyframes flicker {
        0%,
        19%,
        21%,
        23%,
        25%,
        54%,
        56%,
        100% {
          opacity: 1;
          text-shadow: 0 0 10px #ff0000;
        }
        20%,
        24%,
        55% {
          opacity: 0.5;
          text-shadow: none;
        }
      }

      @keyframes heartbeat {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
        }
        70% {
          transform: scale(1.1);
          box-shadow: 0 0 0 10px rgba(255, 0, 0, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
        }
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* CRT 掃描線覆蓋層 */
      .crt-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
            rgba(18, 16, 16, 0) 50%,
            rgba(0, 0, 0, 0.25) 50%
          ),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.06),
            rgba(0, 255, 0, 0.02),
            rgba(0, 0, 255, 0.06)
          );
        background-size: 100% 2px, 3px 100%;
        pointer-events: none; /* 讓點擊穿透 */
        z-index: 999;
      }

      #video-input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="crt-overlay"></div>

    <h2>† 死寂聊天室 †</h2>
    <div id="status-bar">...連結靈界中...</div>

    <div id="chat-window"></div>

    <div class="controls">
      <input type="text" id="username" placeholder="代號" value="生存者" />
      <input
        type="text"
        id="message-input"
        placeholder="留下最後遺言..."
        autocomplete="off"
      />

      <button id="send-btn" onclick="sendText()">⚰️ 獻祭</button>
      <button id="record-btn" onclick="toggleRecording()">👻 招魂(錄音)</button>
      <button
        id="video-btn"
        onclick="document.getElementById('video-input').click()"
      >
        📼 詛咒錄影帶
      </button>
      <input
        type="file"
        id="video-input"
        accept="video/*"
        onchange="handleVideoUpload(this)"
      />
    </div>

    <script>
      // Supabase 設定 (保持不變)
      const SUPABASE_URL = 'https://gzojagtmyrptkrpirxqy.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_A3LiEJYlX0zBPcIQ0Drw-Q_0oOepQg1';
      const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      const chatWindow = document.getElementById('chat-window');
      const statusBar = document.getElementById('status-bar');

      let mediaRecorder;
      let audioChunks = [];
      let isRecording = false;

      // --- 核心邏輯 (與之前完全相同，只改了提示文字) ---

      async function saveMessageToDB(content, type) {
        const username =
          document.getElementById('username').value || '不明物體';
        const { error } = await _supabase
          .from('messages')
          .insert([{ content: content, username: username }]);

        if (error) {
          console.error(error);
          statusBar.innerText = '☠️ 儀式失敗...';
          statusBar.style.color = 'red';
        }
      }

      function sendText() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text) return;
        saveMessageToDB(text, 'text');
        input.value = '';
      }

      async function toggleRecording() {
        const btn = document.getElementById('record-btn');
        if (!isRecording) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true,
            });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = (event) =>
              audioChunks.push(event.data);
            mediaRecorder.onstop = async () => {
              const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
              await uploadFileAndSend(audioBlob, 'audio', 'haunted_voice.webm');
            };
            mediaRecorder.start();
            isRecording = true;
            btn.classList.add('recording');
            btn.innerText = '🩸 停止儀式';
            statusBar.innerText = '靈體錄製中...';
          } catch (err) {
            alert('麥克風被靈體干擾: ' + err);
          }
        } else {
          mediaRecorder.stop();
          isRecording = false;
          btn.classList.remove('recording');
          btn.innerText = '👻 招魂(錄音)';
          mediaRecorder.stream.getTracks().forEach((track) => track.stop());
        }
      }

      async function handleVideoUpload(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 50 * 1024 * 1024) {
          alert('檔案太大，怨念太重');
          return;
        }
        await uploadFileAndSend(file, 'video', file.name);
        input.value = '';
      }

      async function uploadFileAndSend(fileBody, msgType, fileName) {
        statusBar.innerText = `正在上傳詛咒媒介 ${msgType}...`;
        const uniqueName = `${Date.now()}_${Math.random()
          .toString(36)
          .substr(2, 9)}_${fileName}`;
        const filePath = `${msgType}s/${uniqueName}`;

        const { error } = await _supabase.storage
          .from('chat_images')
          .upload(filePath, fileBody);
        if (error) {
          console.error(error);
          statusBar.innerText = '上傳被封印';
          return;
        }

        const { data: urlData } = _supabase.storage
          .from('chat_images')
          .getPublicUrl(filePath);
        await saveMessageToDB(urlData.publicUrl, msgType);
        statusBar.innerText = '詛咒已發送';
        setTimeout(() => (statusBar.innerText = '...連結靈界中...'), 2000);
      }

      function appendMessage(msg) {
        const div = document.createElement('div');
        div.className = 'message';

        // 讓時間看起來比較詭異
        const time = new Date(msg.created_at).toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
        });
        const safeUser = escapeHtml(msg.username);

        let contentHtml = '';
        if (msg.msg_type === 'audio') {
          contentHtml = `<audio controls src="${msg.content}"></audio>`;
        } else if (msg.msg_type === 'video') {
          contentHtml = `<video controls src="${msg.content}"></video>`;
        } else {
          contentHtml = `<div>${escapeHtml(msg.content)}</div>`;
        }

        div.innerHTML = `<strong>${safeUser}</strong><span class="time">${time}</span>${contentHtml}`;
        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }

      async function init() {
        const { data } = await _supabase
          .from('messages')
          .select('*')
          .order('created_at', { ascending: true })
          .limit(50);
        if (data) data.forEach(appendMessage);

        _supabase
          .channel('room1')
          .on(
            'postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'messages' },
            (payload) => {
              appendMessage(payload.new);
              // 收到新訊息時的額外恐怖特效 (選用)
              document.body.style.textShadow = '2px 0 0 red, -2px 0 0 blue';
              setTimeout(() => (document.body.style.textShadow = 'none'), 200);
            }
          )
          .subscribe();
      }

      function escapeHtml(text) {
        if (!text) return '';
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      init();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>校園藝術導遊 - Nintendo 3DS 風格</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

        :root {
            --nintendo-dark: #1a1a1a;
            --nintendo-panel: #242424;
            --nintendo-border: #3d3d3d;
            --gold-accent: #d4af37;
            --cyan-accent: #00e5ff;
            --map-bg: #121212;
        }

        body { 
            background-color: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Roboto', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        #app-container { 
            width: 100%; 
            max-width: 414px; 
            height: 100vh; 
            max-height: 896px; 
            background-color: var(--nintendo-dark); 
            position: relative; 
            overflow: hidden; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-left: 2px solid #333;
            border-right: 2px solid #333;
        }

        .serif-title { font-family: 'Noto Serif TC', serif; }

        /* 3DS 觸控按鈕立體風格 */
        .btn-tactile {
            background: linear-gradient(to bottom, #3a3a3a, #222);
            border: 1px solid #555;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.5);
            color: #999;
            transition: all 0.1s;
            white-space: nowrap;
        }
        .btn-tactile.active {
            background: linear-gradient(to bottom, #2a2a2a, #111);
            border-color: var(--gold-accent);
            color: var(--gold-accent);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.05);
        }
        .btn-tactile:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        /* 藍圖地圖網格背景 */
        .blueprint-bg {
            background-color: var(--map-bg);
            background-image: 
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 15px 15px;
        }

        /* SVG 地圖元素樣式 */
        .svg-wall { fill: none; stroke: #4f4f4f; stroke-width: 0.8; filter: drop-shadow(0 0 1px rgba(255,255,255,0.1)); }
        .svg-room { fill: rgba(255,255,255,0.03); stroke: #3f3f3f; stroke-width: 0.5; transition: fill 0.3s; }
        .svg-room:hover { fill: rgba(212, 175, 55, 0.1); }
        .svg-text { fill: #666; font-size: 2px; font-family: 'Roboto', sans-serif; font-weight: bold; text-anchor: middle; }
        .svg-text-small { fill: #555; font-size: 1.5px; font-family: 'Roboto', sans-serif; text-anchor: middle; }
        .svg-stairs { fill: rgba(255,255,255,0.05); stroke: none; }
        .svg-void { fill: none; stroke: #333; stroke-width: 0.3; stroke-dasharray: 1 1; }

        /* 地圖標記點 */
        .marker-found {
            background: radial-gradient(circle, #fff, #aaa);
            border: 2px solid var(--gold-accent);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            color: #000;
        }

        @keyframes pulse-gold {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        .marker-unfound {
            background-color: var(--gold-accent);
            animation: pulse-gold 2s infinite;
            border: 2px solid #fff;
        }

        /* 相機 UI */
        .camera-ui-border { position: absolute; width: 40px; height: 40px; border-color: var(--cyan-accent); }
        .tl { top: 20px; left: 20px; border-top: 3px solid; border-left: 3px solid; }
        .tr { top: 20px; right: 20px; border-top: 3px solid; border-right: 3px solid; }
        .bl { bottom: 20px; left: 20px; border-bottom: 3px solid; border-left: 3px solid; }
        .br { bottom: 20px; right: 20px; border-bottom: 3px solid; border-right: 3px solid; }

        @keyframes scan-sweep {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(500%); }
        }
        .scan-laser {
            position: absolute; width: 100%; height: 2px;
            background: var(--cyan-accent);
            box-shadow: 0 0 15px 5px rgba(0, 229, 255, 0.4);
            animation: scan-sweep 3s linear infinite;
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

<div id="app-container" class="flex flex-col">
    
    <!-- 頂部 Header -->
    <header class="bg-[#111] p-4 flex justify-between items-center border-b border-nintendo-border relative z-10 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded border border-gold-accent flex items-center justify-center bg-black shadow-[0_0_10px_rgba(212,175,55,0.2)]">
                <span class="text-gold-accent font-serif font-bold">AR</span>
            </div>
            <div>
                <h1 class="text-base font-bold tracking-widest text-gray-100 serif-title">校園隱藏藝術特展</h1>
                <p class="text-[9px] text-gray-500 uppercase tracking-widest">Digital Curator System</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-[9px] text-gray-400 uppercase">Archive</p>
            <p class="text-lg font-bold text-gold-accent font-mono" id="progress-text">0/5</p>
        </div>
    </header>

    <!-- 畫面 1: 地圖模式 -->
    <main id="view-map" class="flex-1 flex flex-col relative h-full">
        
        <!-- 樓層切換控制器 (可水平滑動) -->
        <div class="bg-nintendo-panel p-2 border-b border-nintendo-border z-10 overflow-hidden relative">
            <div class="flex gap-2 overflow-x-auto hide-scroll pb-1 px-1" id="floor-selector">
                <button onclick="switchFloor('GF')" id="btn-GF" class="btn-tactile px-4 py-2 text-xs font-bold rounded">G/F 劇院大堂</button>
                <button onclick="switchFloor('1F')" id="btn-1F" class="btn-tactile px-4 py-2 text-xs font-bold rounded">1/F 工作室區</button>
                <button onclick="switchFloor('2F')" id="btn-2F" class="btn-tactile px-4 py-2 text-xs font-bold rounded">2/F 球場/圖書館</button>
                <button onclick="switchFloor('3F')" id="btn-3F" class="btn-tactile px-4 py-2 text-xs font-bold rounded">3/F 教室區</button>
                <button onclick="switchFloor('5F')" id="btn-5F" class="btn-tactile px-4 py-2 text-xs font-bold rounded">5/F 頂層教室</button>
            </div>
            <!-- 滑動提示漸層 -->
            <div class="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-nintendo-panel to-transparent pointer-events-none"></div>
        </div>

        <!-- 互動地圖區域 -->
        <div class="flex-1 relative blueprint-bg overflow-hidden flex items-center justify-center p-2" id="map-area">
            
            <div class="relative w-full aspect-[4/3] max-w-[380px]">
                <!-- SVG 地圖繪製區 -->
                <svg id="svg-map" class="w-full h-full absolute inset-0 drop-shadow-md" viewBox="0 0 100 75" xmlns="http://www.w3.org/2000/svg">
                    <!-- 動態載入樓層藍圖 -->
                </svg>

                <!-- 塗鴉標記點容器 -->
                <div id="markers-container" class="absolute inset-0 pointer-events-none"></div>
            </div>

            <!-- 地圖疊加層 UI -->
            <div class="absolute bottom-4 left-4 bg-black/70 border border-[#444] px-3 py-2 rounded text-[10px] text-gray-300 backdrop-blur-md shadow-lg">
                <p class="mb-1.5 flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 bg-gold-accent rounded-full animate-pulse"></span> 偵測到藝術品</p>
                <p class="flex items-center gap-2"><span class="inline-block w-2.5 h-2.5 bg-gray-300 rounded-full border border-gray-500"></span> 已解鎖檔案</p>
            </div>
            
            <div class="absolute top-4 right-4 text-gray-600 font-mono text-[10px] text-right">
                SCANNER: ACTIVE <br> <span id="map-id-display" class="text-cyan-accent opacity-70">DATA_LINK_ESTABLISHED</span>
            </div>
        </div>
    </main>

    <!-- 畫面 2: AR 掃描模式 -->
    <main id="view-scanner" class="absolute inset-0 bg-black z-20 hidden flex flex-col">
        <div class="absolute inset-0 opacity-30 bg-[url('https://images.unsplash.com/photo-1595123550441-d3ccfb96dd5f?q=80&w=800&auto=format&fit=crop')] bg-cover bg-center filter blur-sm"></div>
        <div class="absolute inset-0 z-10 pointer-events-none" style="background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px); background-size: 20px 20px;"></div>
        
        <div class="relative z-30 flex-1 flex flex-col items-center justify-center">
            <div class="absolute top-6 right-6 flex items-center gap-2 text-red-500 font-mono text-[10px] bg-black/50 px-2 py-1 rounded">
                <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div> REC
            </div>

            <p class="text-white text-sm mb-10 font-bold tracking-widest bg-black/60 px-4 py-2 rounded-full border border-[#444] backdrop-blur-sm">請將鏡頭對準實體牆面</p>
            
            <div class="w-64 h-64 relative overflow-hidden bg-cyan-accent/5 backdrop-blur-sm rounded-lg">
                <div class="camera-ui-border tl"></div>
                <div class="camera-ui-border tr"></div>
                <div class="camera-ui-border bl"></div>
                <div class="camera-ui-border br"></div>
                <div class="scan-laser"></div>

                <div id="scan-success" class="absolute inset-0 flex flex-col items-center justify-center hidden bg-cyan-900/40 backdrop-blur-md transition-all duration-300">
                    <div class="w-12 h-12 border-2 border-cyan-accent rounded-full flex items-center justify-center mb-3 bg-black/50 shadow-[0_0_15px_rgba(0,229,255,0.8)]">
                        <span class="text-cyan-accent text-xl">✓</span>
                    </div>
                    <p class="font-bold tracking-widest text-cyan-accent text-sm drop-shadow-[0_0_5px_rgba(0,229,255,1)]">數據擷取成功</p>
                </div>
            </div>

            <button onclick="cancelScan()" class="mt-16 btn-tactile px-8 py-3 rounded text-xs font-bold tracking-widest uppercase">
                Abort Scan [X]
            </button>
        </div>
    </main>

    <!-- 畫面 3: 導覽解說卡 (上下雙螢幕) -->
    <main id="view-detail" class="absolute inset-0 bg-nintendo-dark z-30 hidden flex flex-col">
        
        <!-- 上螢幕: 視覺展示 -->
        <div class="h-[40%] bg-[#0a0a0a] relative border-b-2 border-black z-20 flex items-center justify-center shadow-[0_10px_20px_rgba(0,0,0,0.8)]">
            <div class="absolute inset-0 shadow-[inset_0_0_30px_rgba(0,0,0,1)] z-10 pointer-events-none"></div>
            
            <img id="detail-image" src="" alt="Artwork" class="w-full h-full object-cover opacity-90 transition-opacity duration-500">
            
            <button onclick="closeDetail()" class="absolute top-4 left-4 bg-black/60 text-white w-8 h-8 border border-[#555] rounded-full flex items-center justify-center z-20 hover:bg-[#444] active:scale-90 backdrop-blur-sm">
                ✕
            </button>
            
            <div class="absolute bottom-3 right-3 z-20 flex gap-1">
                <span class="w-2 h-2 bg-gray-500 rounded-full"></span>
                <span class="w-2 h-2 bg-white rounded-full shadow-[0_0_5px_#fff]"></span>
            </div>
        </div>

        <!-- 下螢幕: 資訊與操作 -->
        <div class="h-[60%] bg-nintendo-panel p-5 overflow-y-auto relative flex flex-col">
            
            <div class="mb-3">
                <div class="flex items-center gap-2 mb-1">
                    <span id="detail-floor" class="text-nintendo-dark bg-gold-accent font-bold text-[10px] px-1.5 py-0.5 rounded shadow">1F</span>
                    <span class="text-gray-400 text-[9px] tracking-widest uppercase" id="detail-room">Room 105</span>
                </div>
                <h2 id="detail-title" class="text-xl font-bold text-white mt-1 serif-title tracking-wide">藝術品標題</h2>
                <p id="detail-artist" class="text-[11px] text-gray-400 mt-1 uppercase tracking-wider">Creator // Unknown</p>
            </div>

            <div class="w-full h-px bg-gradient-to-r from-nintendo-border via-gray-500 to-nintendo-border mb-4"></div>

            <div class="flex-1 overflow-y-auto pr-2 custom-scroll mb-4">
                <p id="detail-desc" class="text-gray-300 text-xs leading-relaxed text-justify opacity-90">
                    載入詳細資料中...
                </p>
            </div>

            <!-- 語音導覽播放器 -->
            <div class="mt-auto bg-[#1a1a1a] border border-[#333] rounded-lg p-3 flex items-center gap-3 shadow-inner relative overflow-hidden">
                <div class="absolute left-0 top-0 bottom-0 w-1 bg-gold-accent"></div>
                <button id="btn-audio" onclick="playAudioGuide()" class="w-10 h-10 shrink-0 rounded-full bg-gradient-to-b from-gray-700 to-gray-800 border border-gray-500 flex items-center justify-center text-white shadow-md active:scale-95 transition-transform">
                    ▶
                </button>
                <div class="flex-1">
                    <p class="text-[10px] text-gold-accent mb-1 flex justify-between tracking-wider">
                        <span>策展人導覽 (Audio)</span>
                        <span id="audio-time" class="font-mono">00:00</span>
                    </p>
                    <div class="w-full h-1.5 bg-black rounded-full overflow-hidden border border-[#333]">
                        <div id="audio-progress" class="w-0 h-full bg-gold-accent transition-all duration-100 ease-linear shadow-[0_0_5px_rgba(212,175,55,0.8)]"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 破關模態框 -->
    <div id="modal-complete" class="absolute inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-6 backdrop-blur-sm transition-opacity duration-500">
        <div class="bg-nintendo-panel border border-gold-accent rounded-xl p-8 text-center max-w-[320px] w-full relative overflow-hidden shadow-[0_0_30px_rgba(212,175,55,0.2)]">
            <div class="absolute -right-8 -top-8 w-24 h-24 bg-gold-accent opacity-10 rounded-full blur-xl"></div>
            <div class="text-gold-accent text-5xl mb-4 serif-title drop-shadow-[0_2px_5px_rgba(0,0,0,1)]">❖</div>
            <h2 class="text-lg font-bold text-white mb-1 tracking-widest">全區域掃描完成</h2>
            <p class="text-gray-400 text-[10px] mb-6 uppercase tracking-widest">All artifacts documented</p>
            <p class="text-gray-300 text-xs mb-8 leading-relaxed">
                恭喜！您已成功解鎖校園內所有隱藏的空間藝術，數據已上傳至主伺服器。獲得數位成就：<span class="text-gold-accent font-bold">空間探索大師</span>。
            </p>
            <button onclick="closeModal()" class="w-full btn-tactile text-gold-accent border-gold-accent font-bold py-3 text-sm rounded shadow">
                確認 (A)
            </button>
        </div>
    </div>

</div>

<script>

        '3F': `

            <!-- 底部教室排 -->
            <rect x="10" y="45" width="12" height="20" class="svg-room"/><text x="16" y="56" class="svg-text">310</text>
            <rect x="22" y="45" width="12" height="20" class="svg-room"/><text x="28" y="56" class="svg-text">309</text>
            <rect x="34" y="45" width="12" height="20" class="svg-room"/><text x="40" y="56" class="svg-text">308</text>
            <rect x="46" y="45" width="12" height="20" class="svg-room"/><text x="52" y="56" class="svg-text">307</text>
            <rect x="58" y="45" width="12" height="20" class="svg-room"/><text x="64" y="56" class="svg-text">306</text>
            <rect x="70" y="45" width="12" height="20" class="svg-room"/><text x="76" y="56" class="svg-text">305</text>
        `,
        '5F': `
            <!-- 5/F: 頂層教室 (5xx) -->
            <path class="svg-wall" d="M 5 5 L 95 5 L 95 70 L 5 70 Z" />
            
            <rect x="38" y="25" width="45" height="15" class="svg-void"/>
            <text x="60.5" y="33" class="svg-text-small" fill="#444">ATRIUM VOID</text>
            
            <rect x="18" y="25" width="20" height="15" class="svg-room"/><text x="28" y="33" class="svg-text">513 CRITIC ROOM</text>
            
            <!-- 頂部教室 -->
            <rect x="5" y="5" width="12" height="15" class="svg-room"/><text x="11" y="13" class="svg-text">511</text>
            <rect x="17" y="5" width="12" height="15" class="svg-room"/><text x="23" y="13" class="svg-text">512</text>
            <rect x="65" y="5" width="15" height="15" class="svg-room"/><text x="72.5" y="13" class="svg-text">501-502</text>
            
            <!-- 底部教室排 -->
            <rect x="10" y="45" width="12" height="20" class="svg-room"/><text x="16" y="56" class="svg-text">510</text>
            <rect x="22" y="45" width="12" height="20" class="svg-room"/><text x="28" y="56" class="svg-text">509</text>
            <rect x="34" y="45" width="12" height="20" class="svg-room"/><text x="40" y="56" class="svg-text">508</text>
            <rect x="46" y="45" width="12" height="20" class="svg-room"/><text x="52" y="56" class="svg-text">507</text>
            <rect x="58" y="45" width="12" height="20" class="svg-room"/><text x="64" y="56" class="svg-text">506</text>
            <rect x="70" y="45" width="12" height="20" class="svg-room"/><text x="76" y="56" class="svg-text">505</text>
        `
    };

    /* =====================================================================
       尋寶資料庫 (針對各樓層地圖設計的藝術品)
       ===================================================================== */
    const artworks = [
        {
            id: 'art_gf', floor: 'GF', room: 'GALLERY', 
            x: '50%', y: '58%', // 畫廊中間
            title: '重力扭曲的石柱', artist: '多媒體藝術學系',
            description: '在這個看似普通的畫廊空間中，透過 AR 掃描會發現一根漂浮且扭曲的虛擬羅馬柱。這是學生對傳統博物館建築結構的反叛，象徵數位時代下「空間」的定義已被打破。',
            image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop'
        },
        {
            id: 'art_1f', floor: '1F', room: '105 MAKER LAB', 
            x: '32%', y: '60%', // 創客實驗室
            title: '金屬巨獸的誕生', artist: '機電創客社',
            description: '在 Maker Lab 外牆上有一道不明顯的黑色焦痕。掃描後，一隻由廢棄電路板和齒輪組成的虛擬機械獸會從牆壁中躍出。這代表著實驗室裡日夜運作的創造力與能量。',
            image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800&auto=format&fit=crop'
        },
        {
            id: 'art_2f', floor: '2F', room: 'BASKETBALL COURT', 
            x: '45%', y: '25%', // 球場中央
            title: '拋物線的軌跡', artist: '視覺藝術系 x 體育室',
            description: '站在二樓俯瞰籃球場中央。透過螢幕，你可以看到歷年來在這座球場上投出的「致勝三分球」的虛擬發光軌跡，這些光束交織成一張美麗的幾何光網。',
            image: 'https://images.unsplash.com/photo-1519861531473-9200262188bf?q=80&w=800&auto=format&fit=crop'
        },
        {
            id: 'art_3f', floor: '3F', room: 'ATRIUM VOID', 
            x: '50%', y: '33%', // 三樓中庭邊緣
            title: '知識的瀑布', artist: '圖書資訊管理學系',
            description: '走到 3 樓中庭的邊緣向下望。AR 裝置會將底下的空間轉化為一個深不見底的數據深淵，無數由0與1組成的藍色光流如同瀑布般傾瀉而下，震撼力十足。',
            image: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=800&auto=format&fit=crop'
        },
        {
            id: 'art_5f', floor: '5F', room: '513 CRITIC ROOM', 
            x: '28%', y: '33%', // 513 評圖室
            title: '無聲的辯論', artist: '建築與設計學院',
            description: '513 評圖室是無數學生歷經挫折與成長的地方。掃描室外的空白牆面，會浮現出過去十年來教授們留下的紅筆批改痕跡，以及學生的草圖碎片，形成一幅充滿張力的拼貼壁畫。',
            image: 'https://images.unsplash.com/photo-1513364776144-60967b0f800f?q=80&w=800&auto=format&fit=crop'
        }
    ];

    /* =====================================================================
       系統邏輯
       ===================================================================== */
    const state = {
        currentFloor: '1F',
        foundArtworks: [],
        activeScanId: null,
        audioTimer: null
    };

    const dom = {
        mapArea: document.getElementById('svg-map'),
        markersContainer: document.getElementById('markers-container'),
        viewMap: document.getElementById('view-map'),
        viewScanner: document.getElementById('view-scanner'),
        viewDetail: document.getElementById('view-detail'),
        scanSuccess: document.getElementById('scan-success'),
        progressText: document.getElementById('progress-text'),
        modalComplete: document.getElementById('modal-complete'),
        btnAudio: document.getElementById('btn-audio'),
        audioProgress: document.getElementById('audio-progress'),
        audioTime: document.getElementById('audio-time')
    };

    function init() {
        switchFloor('1F'); // 預設顯示 1 樓
    }

    function switchFloor(floor) {
        state.currentFloor = floor;
        
        // 更新按鈕狀態
        const floors = ['GF', '1F', '2F', '3F', '5F'];
        floors.forEach(f => {
            const btn = document.getElementById(`btn-${f}`);
            if(f === floor) {
                btn.classList.add('active');
                // 自動將選中的按鈕滾動到可視範圍 (針對手機版)
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            } else {
                btn.classList.remove('active');
            }
        });

        // 注入對應的 SVG 地圖
        dom.mapArea.innerHTML = floorMaps[floor] || floorMaps['1F'];
        
        renderMarkers();
    }

    function renderMarkers() {
        dom.markersContainer.innerHTML = ''; 
        
        const currentArtworks = artworks.filter(a => a.floor === state.currentFloor);
        
        currentArtworks.forEach(art => {
            const isFound = state.foundArtworks.includes(art.id);
            const marker = document.createElement('div');
            
            // 使用 absolute 定位，並允許點擊 (pointer-events-auto 因為父層設定了 none)
            marker.style.left = art.x;
            marker.style.top = art.y;
            marker.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 cursor-pointer z-10 transition-transform hover:scale-110 pointer-events-auto';
            
            if (isFound) {
                marker.innerHTML = `<div class="w-5 h-5 rounded-full marker-found flex items-center justify-center text-[10px] font-bold">i</div>`;
                marker.onclick = () => showDetail(art);
            } else {
                marker.innerHTML = `<div class="w-4 h-4 rounded-full marker-unfound"></div>`;
                marker.onclick = () => startScan(art.id);
            }
            
            dom.markersContainer.appendChild(marker);
        });
    }

    function startScan(artId) {
        state.activeScanId = artId;
        dom.viewMap.classList.add('hidden');
        dom.viewScanner.classList.remove('hidden');
        dom.scanSuccess.classList.add('hidden');

        // 模擬掃描需要 2.5 秒
        setTimeout(() => {
            if(state.activeScanId === artId) processScanSuccess(artId);
        }, 2500);
    }

    function cancelScan() {
        state.activeScanId = null;
        dom.viewScanner.classList.add('hidden');
        dom.viewMap.classList.remove('hidden');
    }

    function processScanSuccess(artId) {
        dom.scanSuccess.classList.remove('hidden'); 
        
        if (!state.foundArtworks.includes(artId)) {
            state.foundArtworks.push(artId);
            dom.progressText.innerText = `${state.foundArtworks.length}/${artworks.length}`;
        }

        setTimeout(() => {
            const art = artworks.find(a => a.id === artId);
            showDetail(art);
            dom.viewScanner.classList.add('hidden');
            renderMarkers(); 
        }, 1200);
    }

    function showDetail(art) {
        document.getElementById('detail-image').src = art.image;
        document.getElementById('detail-title').innerText = art.title;
        document.getElementById('detail-artist').innerText = `Creator // ${art.artist}`;
        document.getElementById('detail-desc').innerText = art.description;
        document.getElementById('detail-floor').innerText = art.floor;
        document.getElementById('detail-room').innerText = art.room;
        
        dom.viewMap.classList.add('hidden');
        dom.viewDetail.classList.remove('hidden');
        
        resetAudioPlayer();
    }

    function closeDetail() {
        dom.viewDetail.classList.add('hidden');
        dom.viewMap.classList.remove('hidden');
        resetAudioPlayer(); 
        
        // 如果全部收集完畢，顯示恭喜畫面
        if (state.foundArtworks.length === artworks.length) {
            setTimeout(() => {
                dom.modalComplete.classList.remove('hidden');
                dom.modalComplete.classList.remove('opacity-0');
            }, 500);
        }
    }

    // --- 語音播放器邏輯 ---
    function resetAudioPlayer() {
        clearInterval(state.audioTimer);
        dom.btnAudio.innerHTML = '▶';
        dom.btnAudio.classList.remove('text-gold-accent');
        dom.audioProgress.style.width = '0%';
        dom.audioTime.innerText = '00:00';
        dom.btnAudio.disabled = false;
    }

    function playAudioGuide() {
        if(dom.btnAudio.disabled) return;
        
        dom.btnAudio.disabled = true;
        dom.btnAudio.innerHTML = '❚❚'; 
        dom.btnAudio.classList.add('text-gold-accent');

        let progress = 0;
        const totalDuration = 12; // 模擬 12 秒
        
        state.audioTimer = setInterval(() => {
            progress += 0.1;
            const percent = (progress / totalDuration) * 100;
            dom.audioProgress.style.width = `${percent}%`;
            
            const seconds = Math.floor(progress);
            dom.audioTime.innerText = `00:${seconds.toString().padStart(2, '0')}`;

            if (progress >= totalDuration) {
                resetAudioPlayer();
            }
        }, 100);
    }

    function closeModal() {
        dom.modalComplete.classList.add('hidden');
    }

    // 啟動 App
    window.onload = init;

</script>
</body>

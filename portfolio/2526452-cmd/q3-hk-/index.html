<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港語 KongYu | 香港潮語百科</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans HK', sans-serif; }
        /* 霓虹燈效果 */
        .neon-text { text-shadow: 0 0 10px rgba(250, 204, 21, 0.7); }
        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen" 
      x-data="slangApp()">

    <nav class="fixed top-0 w-full z-50 bg-gray-900/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-black text-yellow-400 tracking-tighter neon-text cursor-pointer" @click="resetSearch">
                        KONG YU
                    </span>
                    <span class="ml-2 text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded">v2.0</span>
                </div>
                <div>
                    <button @click="openSubmitModal" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-2 px-4 rounded-full transition duration-300 shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                        + 投稿潮語
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
        
        <div class="text-center mb-16 space-y-4">
            <h1 class="text-4xl md:text-6xl font-black text-white mb-2">
                今日你 <span class="text-yellow-400">Firm</span> 唔 Firm？
            </h1>
            <p class="text-gray-400 text-lg md:text-xl">
                全港最大潮語數據庫，拒絕做老餅，一秒解鎖 00 後語言。
            </p>

            <div class="max-w-2xl mx-auto relative mt-8">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input 
                    type="text" 
                    x-model="search"
                    placeholder="搜尋：0尊、自肥、Fam..." 
                    class="block w-full pl-12 pr-4 py-4 bg-gray-800 border-2 border-gray-700 rounded-2xl text-white placeholder-gray-500 focus:outline-none focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400 transition text-lg"
                >
            </div>

            <div class="flex flex-wrap justify-center gap-2 mt-6">
                <template x-for="cat in categories" :key="cat">
                    <button 
                        @click="filterCategory = cat"
                        :class="filterCategory === cat ? 'bg-yellow-400 text-black border-yellow-400' : 'bg-transparent text-gray-400 border-gray-600 hover:border-gray-400'"
                        class="px-4 py-1.5 rounded-full border text-sm font-medium transition duration-200"
                        x-text="cat === 'all' ? '全部 All' : cat">
                    </button>
                </template>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="item in filteredList" :key="item.id">
                <div 
                    @click="openDetail(item)"
                    class="group bg-gray-800 rounded-2xl p-6 border border-gray-700 hover:border-yellow-400 cursor-pointer transition duration-300 transform hover:-translate-y-1 hover:shadow-xl relative overflow-hidden"
                >
                    <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-yellow-400/10 rounded-full blur-2xl group-hover:bg-yellow-400/20 transition"></div>

                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-3xl font-bold text-white group-hover:text-yellow-400 transition" x-text="item.word"></h2>
                        <span 
                            class="px-2 py-1 text-xs rounded bg-gray-700 text-gray-300" 
                            x-text="item.category">
                        </span>
                    </div>
                    <p class="text-gray-400 mb-4 line-clamp-2" x-text="item.desc"></p>
                    <div class="flex items-center text-sm text-yellow-500 font-medium">
                        <span>點擊查看例句</span>
                        <svg class="w-4 h-4 ml-1 group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                    </div>
                </div>
            </template>
            
            <div x-show="filteredList.length === 0" class="col-span-full text-center py-12">
                <p class="text-gray-500 text-xl">搵唔到相關潮語，可能太新未 Update？</p>
                <button @click="openSubmitModal" class="mt-4 text-yellow-400 hover:underline">👉 即刻投稿教我</button>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-800 bg-gray-900 py-8 text-center">
        <p class="text-gray-500">© 2025 KongYu 港語. Made for Hong Kong.</p>
    </footer>

    <div x-show="selectedItem" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" @click="selectedItem = null" x-transition.opacity></div>
        
        <div class="bg-gray-800 w-full max-w-lg rounded-2xl shadow-2xl border border-gray-700 relative z-10 overflow-hidden" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-90"
             x-transition:enter-end="opacity-100 scale-100">
            
            <div class="p-8">
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <h2 class="text-4xl font-black text-yellow-400 mb-2" x-text="selectedItem?.word"></h2>
                        <div class="flex gap-2">
                             <span class="text-sm bg-gray-700 px-2 py-1 rounded text-gray-300" x-text="selectedItem?.category"></span>
                             <span class="text-sm border border-gray-600 px-2 py-1 rounded text-gray-400" x-text="'🔥 熱度: ' + selectedItem?.heat"></span>
                        </div>
                    </div>
                    <button @click="selectedItem = null" class="text-gray-400 hover:text-white">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-1">意思 Definition</h3>
                        <p class="text-xl text-white leading-relaxed" x-text="selectedItem?.desc"></p>
                    </div>

                    <div class="bg-gray-900/50 p-4 rounded-xl border border-gray-700/50">
                        <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wide mb-2">例句 Example</h3>
                        <p class="text-lg text-green-400 italic font-medium" x-text="`“${selectedItem?.example}”`"></p>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-700 flex justify-between items-center">
                    <button class="flex items-center text-gray-400 hover:text-red-400 transition space-x-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        <span>Like</span>
                    </button>
                    <button class="text-gray-400 hover:text-white text-sm">分享 Share</button>
                </div>
            </div>
        </div>
    </div>

    <div x-show="isSubmitOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" @click="isSubmitOpen = false"></div>
        <div class="bg-gray-800 w-full max-w-md rounded-2xl p-8 relative z-10 border border-gray-600">
            <h3 class="text-2xl font-bold mb-4 text-white">投稿新潮語</h3>
            <p class="text-gray-400 mb-4 text-sm">幫手 Update 個 Database，好人一生平安。</p>
            <input type="text" placeholder="潮語名稱" class="w-full mb-3 p-3 bg-gray-900 rounded border border-gray-700 text-white">
            <textarea placeholder="意思係咩？" class="w-full mb-4 p-3 bg-gray-900 rounded border border-gray-700 text-white h-24"></textarea>
            <div class="flex justify-end gap-3">
                <button @click="isSubmitOpen = false" class="px-4 py-2 text-gray-400 hover:text-white">取消</button>
                <button @click="isSubmitOpen = false; alert('多謝投稿！審核後會上架。')" class="px-6 py-2 bg-yellow-400 text-black font-bold rounded-lg hover:bg-yellow-300">提交</button>
            </div>
        </div>
    </div>

    <script>
        function slangApp() {
            return {
                search: '',
                filterCategory: 'all',
                selectedItem: null,
                isSubmitOpen: false,
                categories: ['all', '日常', '工作', '讚賞', '負面', '網上用語'],
                
                // 模擬數據庫 (JSON Data)
                database: [
                    { id: 1, word: 'Firm', category: '讚賞', heat: '🔥🔥🔥🔥', desc: '形容事情很穩妥、計畫很完美，或者人很可靠。也可以用來表示「肯定」。', example: '你個 Idea 好 Firm 喎，一於去馬！' },
                    { id: 2, word: '0尊', category: '負面', heat: '🔥🔥🔥', desc: '「零尊重」的縮寫。當遇到無禮貌、被冒犯的情況時使用。', example: '佢遲到一個鐘仲要無悔意，真係 0尊。' },
                    { id: 3, word: 'Fam', category: '日常', heat: '🔥🔥🔥', desc: '來自英文 Family，指像家人一樣親近的朋友、死黨。', example: '今晚同班 Fam 出去飲野。' },
                    { id: 4, word: '點部署', category: '網上用語', heat: '🔥🔥', desc: '源於討論區，意指「現在情況這樣，應該如何計畫/行動？」，通常帶有無助或尋求建議的語氣。', example: '女神已讀不回，點部署？' },
                    { id: 5, word: '自肥', category: '工作', heat: '🔥🔥🔥🔥', desc: '利用職務之便或主辦活動的權力，謀取私利或讓自己享受。', example: '個監製搞個選美節目根本係自肥計畫！' },
                    { id: 6, word: '世一', category: '讚賞', heat: '🔥🔥🔥🔥🔥', desc: '「世界第一」的縮寫，形容某人或某事物最優秀，無可取代。', example: '姜濤真係世一！' },
                    { id: 7, word: 'SLDPK', category: '負面', heat: '🔥🔥', desc: '「笑撚到仆街」的拼音縮寫，形容事情極度好笑。', example: '睇完條片真係 SLDPK。' },
                    { id: 8, word: 'Emo', category: '日常', heat: '🔥🔥🔥', desc: '情緒低落、憂鬱、感性時刻 (Emotional)。通常在深夜發生。', example: '一到凌晨 3 點就開始 Emo。' },
                    { id: 9, word: '大癲', category: '讚賞', heat: '🔥🔥', desc: '形容事情極度誇張、瘋狂，通常帶有正面或驚嘆意味。', example: '個演唱會嘉賓陣容簡直係大癲！' },
                ],

                // 計算屬性：過濾後的列表
                get filteredList() {
                    return this.database.filter(item => {
                        const matchSearch = item.word.toLowerCase().includes(this.search.toLowerCase()) || 
                                          item.desc.toLowerCase().includes(this.search.toLowerCase());
                        const matchCat = this.filterCategory === 'all' || item.category === this.filterCategory;
                        return matchSearch && matchCat;
                    });
                },

                openDetail(item) {
                    this.selectedItem = item;
                },
                openSubmitModal() {
                    this.isSubmitOpen = true;
                },
                resetSearch() {
                    this.search = '';
                    this.filterCategory = 'all';
                }
            }
        }
    </script>
</body>
</html>

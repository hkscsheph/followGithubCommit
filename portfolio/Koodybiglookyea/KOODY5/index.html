<!DOCTYPE html>
<html>
<head>
    <title>Snake.io with AI</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a0a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; text-shadow: 2px 2px 4px #000; }
        .leaderboard { position: absolute; top: 20px; right: 20px; color: white; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>
    <div id="ui">
        <h1>Score: <span id="score">20</span></h1>
        <p>Mouse to Steer | Click to Boost</p>
    </div>
    <div class="leaderboard" id="leaderboard">
        <strong>Leaderboard</strong><br>
        <div id="list"></div>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const MAP_SIZE = 3000;
let foods = [];
let snakes = [];

// Configuration
const CONFIG = {
    baseSpeed: 3,
    boostSpeed: 6,
    turnSpeed: 0.12,
    botCount: 15,
    foodCount: 300
};

class Snake {
    constructor(x, y, color, name, isPlayer = false) {
        this.x = x; this.y = y;
        this.color = color;
        this.name = name;
        this.isPlayer = isPlayer;
        this.radius = 12;
        this.angle = Math.random() * Math.PI * 2;
        this.body = [];
        this.length = 30; // Initial segments
        this.speed = CONFIG.baseSpeed;
        this.isBoosting = false;
        this.dead = false;
    }

    update() {
        if (this.dead) return;

        // Movement Logic
        this.speed = this.isBoosting ? CONFIG.boostSpeed : CONFIG.baseSpeed;
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;

        // Constraints
        if (this.x < 0 || this.x > MAP_SIZE || this.y < 0 || this.y > MAP_SIZE) this.die();

        // Body tracking
        this.body.unshift({ x: this.x, y: this.y });
        if (this.body.length > this.length) this.body.pop();

        // Check Food Collision
        foods.forEach((f, i) => {
            if (Math.hypot(this.x - f.x, this.y - f.y) < this.radius + f.r) {
                this.length += f.r;
                foods.splice(i, 1);
                spawnFood();
            }
        });
    }

    die() {
        this.dead = true;
        // Turn body into food
        for (let i = 0; i < this.body.length; i += 5) {
            foods.push({ x: this.body[i].x, y: this.body[i].y, r: 5, color: this.color });
        }
    }

    draw(camX, camY) {
        if (this.dead) return;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.radius * 2;

        ctx.beginPath();
        this.body.forEach((p, i) => {
            if (i === 0) ctx.moveTo(p.x + camX, p.y + camY);
            else ctx.lineTo(p.x + camX, p.y + camY);
        });
        ctx.stroke();

        // Eyes
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x + camX + Math.cos(this.angle)*5, this.y + camY + Math.sin(this.angle)*5, 4, 0, 7);
        ctx.fill();
    }
}

// Initialize Player
const player = new Snake(MAP_SIZE/2, MAP_SIZE/2, "#00d2ff", "You", true);
snakes.push(player);

// Initialize Bots
for(let i=0; i<CONFIG.botCount; i++) {
    snakes.push(new Snake(Math.random()*MAP_SIZE, Math.random()*MAP_SIZE, `hsl(${Math.random()*360}, 70%, 50%)`, "Bot_"+i));
}

function spawnFood() {
    foods.push({
        x: Math.random() * MAP_SIZE,
        y: Math.random() * MAP_SIZE,
        r: Math.random() * 4 + 2,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`
    });
}
for(let i=0; i<CONFIG.foodCount; i++) spawnFood();

function loop() {
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const camX = canvas.width / 2 - player.x;
    const camY = canvas.height / 2 - player.y;

    // Draw Grid
    ctx.strokeStyle = "#222";
    for(let i=0; i<=MAP_SIZE; i+=100) {
        ctx.beginPath(); ctx.moveTo(i+camX, camY); ctx.lineTo(i+camX, MAP_SIZE+camY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(camX, i+camY); ctx.lineTo(MAP_SIZE+camX, i+camY); ctx.stroke();
    }

    // Update & Draw Snakes
    snakes.forEach(s => {
        if (s.isPlayer) {
            const targetAngle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
            let diff = targetAngle - s.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            s.angle += diff * CONFIG.turnSpeed;
            document.getElementById("score").innerText = Math.floor(s.length);
        } else if (!s.dead) {
            // Bot AI: Randomly jitter angle and steer toward center if hitting walls
            s.angle += (Math.random() - 0.5) * 0.2;
            if (s.x < 100 || s.x > MAP_SIZE-100 || s.y < 100 || s.y > MAP_SIZE-100) {
                s.angle += 0.2;
            }
        }

        // Collision Check (Head vs other Bodies)
        snakes.forEach(other => {
            if (s === other || other.dead) return;
            other.body.forEach((part, index) => {
                if (index < 5) return; // Don't hit own neck
                if (Math.hypot(s.x - part.x, s.y - part.y) < s.radius + 5) {
                    s.die();
                }
            });
        });

        s.update();
        s.draw(camX, camY);
    });

    // Draw Food
    foods.forEach(f => {
        ctx.fillStyle = f.color;
        ctx.beginPath(); ctx.arc(f.x + camX, f.y + camY, f.r, 0, 7); ctx.fill();
    });

    // Clean up dead snakes & Respawn
    if (player.dead) {
        ctx.fillStyle = "white"; ctx.font = "40px Arial";
        ctx.fillText("WASTED - Refresh to Restart", canvas.width/2 - 200, canvas.height/2);
    }

    requestAnimationFrame(loop);
}

// Mouse Tracking
let mouse = { x: 0, y: 0 };
window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener("mousedown", () => player.isBoosting = true);
window.addEventListener("mouseup", () => player.isBoosting = false);

loop();
</script>
</body>
</html>

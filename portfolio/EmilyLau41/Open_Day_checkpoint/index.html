<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>3D 校園導覽 - 照片打卡點</title>
    <style>
      body {
        margin: 0;
        background: #121212;
        font-family: -apple-system, sans-serif;
        overflow: hidden;
        touch-action: none;
      }

      /* 底部樓層按鈕 */
      #ui-layer {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(15px);
        padding: 8px;
        border-radius: 20px;
        z-index: 100;
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 90%;
        max-width: 400px;
      }
      .floor-btn {
        flex: 1;
        margin: 0 4px;
        padding: 12px 0;
        border: none;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 14px;
        font-weight: 600;
      }
      .active {
        background: #007aff !important;
        box-shadow: 0 0 15px #007aff;
      }

      /* 照片彈窗樣式 */
      #photo-modal {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        width: 80%;
        max-width: 300px;
        background: white;
        border-radius: 20px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        z-index: 200;
        transition: 0.3s;
      }
      #photo-modal.show {
        display: flex;
        transform: translate(-50%, -50%) scale(1);
      }
      #modal-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        background: #eee;
      }
      #modal-info {
        padding: 15px;
        text-align: center;
      }
      #modal-info h4 {
        margin: 0;
        color: #333;
      }
      #close-btn {
        margin-top: 10px;
        padding: 8px;
        background: #007aff;
        color: white;
        border: none;
        border-radius: 10px;
        width: 100%;
        cursor: pointer;
      }
      #modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        z-index: 150;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="modal-overlay" onclick="closeModal()"></div>
    <div id="photo-modal">
      <img id="modal-img" src="" alt="位置照片" />
      <div id="modal-info">
        <h4 id="modal-title">地點名稱</h4>
        <button id="close-btn" onclick="closeModal()">關閉</button>
      </div>
    </div>

    <div id="ui-layer">
      <button class="floor-btn active" onclick="focusFloor(0)">G</button>
      <button class="floor-btn" onclick="focusFloor(1)">1F</button>
      <button class="floor-btn" onclick="focusFloor(2)">2F</button>
      <button class="floor-btn" onclick="focusFloor(3)">3F</button>
      <button class="floor-btn" onclick="focusFloor(4)">4F</button>
      <button class="floor-btn" onclick="focusFloor(5)">5F</button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x121212);
      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(15, 20, 15);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const floorHeight = 5;
      const floors = [];
      const floorFiles = [
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/G_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/1_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/2_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/3_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/4_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/5_F.svg',
      ];

      const markerGroup = new THREE.Group();
      scene.add(markerGroup);

      // --- 設定 Checkpoints 座標與照片 ---
      // img 這裡可以放網址或是 local 的圖片檔名
      const checkpoints = [
        {
          floor: 0,
          x: -2,
          z: 2,
          label: '校園畫廊',
          img: 'https://picsum.photos/400/300?random=1',
        },
        {
          floor: 1,
          x: -5,
          z: 1,
          label: '陶藝工作室',
          img: 'https://picsum.photos/400/300?random=2',
        },
        {
          floor: 4,
          x: 0,
          z: 0,
          label: '圖書館',
          img: 'https://picsum.photos/400/300?random=3',
        },
      ];

      const loader = new THREE.TextureLoader();
      floorFiles.forEach((file, index) => {
        const texture = loader.load(file);
        const floorPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(20, 10),
          new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide,
          })
        );
        floorPlane.rotation.x = -Math.PI / 2;
        floorPlane.position.y = index * floorHeight;
        scene.add(floorPlane);
        floors.push(floorPlane);
      });

      // 建立打卡點標記
      checkpoints.forEach((cp) => {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.4, 16, 16),
          new THREE.MeshBasicMaterial({ color: 0xffd700 }) // 金色小球
        );
        mesh.position.set(cp.x, cp.floor * floorHeight + 0.6, cp.z);
        mesh.userData = cp; // 把資料存進去
        mesh.visible = cp.floor === 0;
        markerGroup.add(mesh);
      });

      window.focusFloor = (idx) => {
        const btns = document.querySelectorAll('.floor-btn');
        btns.forEach((btn, i) => btn.classList.toggle('active', i === idx));
        floors.forEach((f, i) => (f.material.opacity = i === idx ? 1.0 : 0.05));
        markerGroup.children.forEach(
          (m) => (m.visible = m.userData.floor === idx)
        );
        controls.target.set(0, idx * floorHeight, 0);
      };

      // --- 點擊偵測 ---
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (event) => {
        // 排除點到 UI 按鈕的情況
        if (event.target.tagName === 'BUTTON') return;

        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(markerGroup.children);

        if (intersects.length > 0) {
          const data = intersects[0].object.userData;
          openModal(data.label, data.img);
        }
      });

      // --- 彈窗控制功能 ---
      window.openModal = (title, imgSrc) => {
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('photo-modal').classList.add('show');
      };

      window.closeModal = () => {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('photo-modal').classList.remove('show');
      };

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>AI 幾何辨識 - 進階圖案版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            background: #121212;
            overflow: hidden;
            font-family: 'Segoe UI', '微軟正黑體', sans-serif;
        }

        #input_video {
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            opacity: 0.15;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 200;
            background: rgba(25, 25, 25, 0.9);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: white;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #res {
            font-size: 36px;
            color: #00ffcc;
            font-weight: 800;
            display: block;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        #indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            box-shadow: 0 0 8px #ff4444;
        }

        button {
            background: linear-gradient(135deg, #00ffcc, #00aba9);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
            color: #121212;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }

        .hint {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>

<body>
    <img id="input_video" autoplay playsinline></img>
    <div class="ui">
        <div class="status-box">
            <div id="indicator"></div>
            <span id="state_text">等待相機權限...</span>
        </div>
        <span>辨識結果：</span>
        <span id="res">---</span>
        <button onclick="startCapture()">啟動螢幕 / 相機擷取</button>
        <div class="hint">
            • <b>繪製：</b>伸出食指 (其他手指收起)<br>
            • <b>停止/辨識：</b>張開手掌 (五指伸展)<br>
            • <b>支援：</b>直線、圓形、正方形、三角形、愛心
        </div>
    </div>

    <script>
        let hands, pg, path = [], handResults = null, isDrawing = false;
        const imgElement = document.getElementById('input_video');
        class FeedbackEffect {
    constructor(x, y, color) {
        this.particles = [];
        for (let i = 0; i < 40; i++) {
            this.particles.push({
                x: x,
                y: y,
                vx: random(-5, 5),
                vy: random(-5, 5),
                life: 255,
                c: color
            });
        }
    }

    update() {
        this.particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 8; // 消失速度
        });
        this.particles = this.particles.filter(p => p.life > 0);
    }

    show() {
        noStroke();
        this.particles.forEach(p => {
            fill(red(p.c), green(p.c), blue(p.c), p.life);
            ellipse(p.x, p.y, random(5, 15));
        });
    }
}

let activeEffects = []; // 存放畫面上正在跑的特效

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pg = createGraphics(windowWidth, windowHeight);
            pg.stroke(0, 255, 204);
            pg.strokeWeight(8);
            pg.strokeCap(ROUND);
            pg.strokeJoin(ROUND);

            hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.7 });
            hands.onResults(r => handResults = r.multiHandLandmarks);
        }

        // 前端修正
        async function startCapture() {
            // 不再需要 navigator.mediaDevices.getUserMedia
            // 直接將 proxy URL 設定給 video 標籤
            imgElement.crossOrigin = "anonymous"; // 避免畫布污染 (Canvas Tainting)
            imgElement.src = "http://localhost:3000/video_feed";

            imgElement.onload = () => {
                const loop = async () => {
                    if (!imgElement.paused) await hands.send({ image: imgElement });
                    requestAnimationFrame(loop);
                };
                loop();
            };
        }

        function draw() {
            clear();
            image(pg, 0, 0);

            if (handResults && handResults.length > 0) {
                let pts = handResults[0];
                let x = (1 - pts[8].x) * width;
                let y = pts[8].y * height;

                // --- 核心修改：手勢判斷邏輯 ---
                
                // 1. 食指伸直 (繪製模式)：食指尖(8) 高於 食指根(6)，且中指尖(12) 低於 中指根(10) [代表只有食指伸出]
                let isPointing = pts[8].y < pts[6].y && pts[12].y > pts[10].y;

                // 2. 五指伸開 (停止/辨識模式)：大拇指到小拇指的尖端都處於伸展狀態
                // 簡化判斷：食指(8)、中指(12)、無名指(16)、小指(20) 的 y 座標都小於其對應的第二關節
                let isFiveFingers = pts[8].y < pts[6].y && 
                                    pts[12].y < pts[10].y && 
                                    pts[16].y < pts[14].y && 
                                    pts[20].y < pts[18].y;

                const indicator = document.getElementById('indicator');
                const stateText = document.getElementById('state_text');

                if (isPointing) {
                    // 進入繪製狀態
                    indicator.style.background = "#00ffcc";
                    indicator.style.boxShadow = "0 0 10px #00ffcc";
                    stateText.innerText = "正在錄製軌跡...";

                    if (!isDrawing) { 
                        path = []; 
                        pg.clear(); 
                        isDrawing = true; 
                    }

                    if (path.length > 0) {
                        let lastP = path[path.length - 1];
                        x = lerp(lastP.x, x, 0.2);
                        y = lerp(lastP.y, y, 0.2);
                    }

                    path.push({ x, y });
                    if (path.length > 1) {
                        let p = path[path.length - 2];
                        pg.line(p.x, p.y, x, y);
                    }
                } 
                else if (isFiveFingers) {
                    // 偵測到五指伸出：觸發辨識並停止繪製
                    indicator.style.background = "#ff4444";
                    indicator.style.boxShadow = "0 0 10px #ff4444";
                    stateText.innerText = "偵測到辨識手勢！";

                    if (isDrawing && path.length > 15) {
                        analyzeShape(path);
                    }
                    isDrawing = false;
                }
                else {
                    // 其他手勢 (如握拳)：靜止狀態
                    indicator.style.background = "orange";
                    indicator.style.boxShadow = "0 0 10px orange";
                    stateText.innerText = "等待指令 (食指繪製 / 五指辨識)";
                    isDrawing = false; 
                }

                // 繪製指尖游標
                fill(255);
                noStroke();
                ellipse(x, y, 12, 12);
                noFill();
                stroke(0, 255, 204);
                ellipse(x, y, 20, 20);
            }
            function draw() {
    clear();
    image(pg, 0, 0);

    // ... 原有的手勢辨識邏輯 ...

    // 更新並繪製所有特效
    for (let i = activeEffects.length - 1; i >= 0; i--) {
        activeEffects[i].update();
        activeEffects[i].show();
        if (activeEffects[i].particles.length === 0) {
            activeEffects.splice(i, 1);
        }
    }
}
        }
        function analyzeShape(pts) {
    // ... 原有的計算邏輯 (xs, ys, minX, maxX, centerY 等) ...
    
    let centerX = (Math.min(...pts.map(p => p.x)) + Math.max(...pts.map(p => p.x))) / 2;
    let centerY = (Math.min(...pts.map(p => p.y)) + Math.max(...pts.map(p => p.y))) / 2;

    // --- 修改後的決策區域 ---
    let effectColor = color(255);
    
    if (isHeart) {
        guess = "❤️ 愛心 (Heart)";
        effectColor = color(255, 50, 100); // 粉紅火花
    } else if (varCoeff < 0.15) { 
        guess = "🔥 圓形 (Fire Circle)";
        effectColor = color(255, 100, 0); // 橘色火焰
    } else if (isTopMid && bottomW > w * 0.7) {
        guess = "🔺 三角形 (Electric)";
        effectColor = color(255, 255, 0); // 黃色閃電感
    } else {
        guess = "⬜ 正方形 (Portal)";
        effectColor = color(0, 200, 255); // 藍色傳送門感
    }

    // 觸發特效
    activeEffects.push(new FeedbackEffect(centerX, centerY, effectColor));
    
    document.getElementById('res').innerText = guess;
    
    // 辨識完自動清空畫布 (選擇性)
    setTimeout(() => pg.clear(), 1000); 
}
    
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            let newPg = createGraphics(windowWidth, windowHeight);
            newPg.image(pg, 0, 0);
            pg = newPg;
        }
    </script>
</body>

</html>

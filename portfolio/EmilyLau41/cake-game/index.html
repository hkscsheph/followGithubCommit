<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>3D 頂級蛋糕大師 - 藍莓與奶油</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: 'Microsoft JhengHei', sans-serif;
        background: #fff5f8;
      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        padding: 25px;
        box-sizing: border-box;
      }
      .order-panel {
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 25px;
        border: 3px solid #ffb6c1;
        width: 300px;
        pointer-events: auto;
        color: #d81b60;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        pointer-events: auto;
        flex-wrap: wrap;
        justify-content: center;
        width: 95%;
      }
      button {
        padding: 15px 22px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 15px;
        font-weight: bold;
        transition: 0.2s;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.1);
      }
      button:active {
        transform: translateY(4px);
        box-shadow: none;
      }

      .btn-cake-v {
        background: #f4d03f;
        color: #5d4037;
      }
      .btn-cake-c {
        background: #4e2c0e;
        color: white;
      }
      .btn-cream {
        background: #ffffff;
        color: #ff69b4;
        border: 1px solid #ffdae9;
      }
      .btn-strawberry {
        background: #ff4d4d;
        color: white;
      }
      .btn-blueberry {
        background: #4b0082;
        color: white;
      }
      .btn-serve {
        background: #ff1493;
        color: white;
        padding: 15px 40px;
      }

      #feedback {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 50px;
        font-weight: bold;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="ui">
      <div class="order-panel">
        <h2 style="margin: 0">👩‍🍳 頂級蛋糕大師</h2>
        <p
          id="order-items"
          style="
            font-size: 18px;
            margin: 15px 0;
            font-weight: bold;
            color: #ff1493;
          "
        ></p>
        <div style="font-size: 18px">得分: <span id="score">0</span></div>
      </div>
      <div id="feedback"></div>
      <div class="controls">
        <button class="btn-cake-v" onclick="add('cake')">🍰 原味胚</button>
        <button class="btn-cake-c" onclick="add('choco')">🍫 巧克力胚</button>
        <button class="btn-cream" onclick="add('cream')">🍦 覆蓋奶油</button>
        <button class="btn-strawberry" onclick="add('strawberry')">
          🍓 豐盛草莓
        </button>
        <button class="btn-blueberry" onclick="add('blueberry')">
          🫐 藍莓派對
        </button>
        <button class="btn-serve" onclick="serve()">🎁 完美出餐</button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      let score = 0,
        currentOrder = [],
        playerStack = [];
      const names = {
        cake: '原味胚',
        choco: '巧克力胚',
        cream: '奶油',
        strawberry: '草莓',
        blueberry: '藍莓',
      };

      // --- Scene Setup ---
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfff5f8);
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(0, 10, 15);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);
      new OrbitControls(camera, renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 20, 10);
      light.castShadow = true;
      scene.add(light);

      const plate = new THREE.Mesh(
        new THREE.CylinderGeometry(5.5, 6, 0.4, 64),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 })
      );
      plate.receiveShadow = true;
      scene.add(plate);

      window.newOrder = function () {
        const types = ['cake', 'choco', 'cream', 'strawberry', 'blueberry'];
        const len = Math.floor(Math.random() * 3) + 3;
        currentOrder = [Math.random() > 0.5 ? 'cake' : 'choco'];
        for (let i = 1; i < len; i++)
          currentOrder.push(types[Math.floor(Math.random() * types.length)]);
        document.getElementById('order-items').innerText = currentOrder
          .map((t) => names[t])
          .join(' ➔ ');
      };

      window.add = function (type) {
        let mesh, h;
        const currentTotalH = playerStack.reduce((s, i) => s + i.h, 0);

        if (type === 'cake' || type === 'choco') {
          mesh = new THREE.Mesh(
            new THREE.CylinderGeometry(3.5, 3.5, 1.2, 32),
            new THREE.MeshStandardMaterial({
              color: type === 'cake' ? 0xf9e4b7 : 0x4e2c0e,
              roughness: 0.8,
            })
          );
          h = 1.2;
        } else if (type === 'cream') {
          // 奶油覆蓋效果
          mesh = new THREE.Mesh(
            new THREE.CapsuleGeometry(3.7, 0.1, 10, 32),
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.05 })
          );
          mesh.scale.set(1, 0.5, 1);
          h = 0.5;
        } else if (type === 'strawberry') {
          mesh = new THREE.Group();
          for (let i = 0; i < 6; i++) {
            const s = new THREE.Group();
            const b = new THREE.Mesh(
              new THREE.SphereGeometry(0.5, 12, 12),
              new THREE.MeshStandardMaterial({
                color: 0xff0000,
                emissive: 0x220000,
              })
            );
            b.scale.set(1, 1.3, 1);
            const l = new THREE.Mesh(
              new THREE.CylinderGeometry(0.3, 0.05, 0.1, 8),
              new THREE.MeshStandardMaterial({ color: 0x228b22 })
            );
            l.position.y = 0.6;
            s.add(b, l);
            const ang = (i / 6) * Math.PI * 2;
            const r = 1.8 + Math.random() * 0.5;
            s.position.set(Math.cos(ang) * r, 0, Math.sin(ang) * r);
            s.rotation.y = Math.random() * Math.PI;
            mesh.add(s);
          }
          h = 1.3;
        } else if (type === 'blueberry') {
          // --- 藍莓派對效果 ---
          mesh = new THREE.Group();
          for (let i = 0; i < 8; i++) {
            const b = new THREE.Mesh(
              new THREE.SphereGeometry(0.35, 12, 12),
              new THREE.MeshStandardMaterial({
                color: 0x4b0082,
                roughness: 0.1,
                emissive: 0x050010,
              })
            );
            const ang = (i / 8) * Math.PI * 2;
            const r = 2.0 + Math.random() * 0.6;
            b.position.set(Math.cos(ang) * r, 0, Math.sin(ang) * r);
            mesh.add(b);
          }
          h = 0.6;
        }

        mesh.position.set(0, currentTotalH + 10, 0);
        mesh.traverse((c) => {
          if (c.isMesh) c.castShadow = true;
        });
        scene.add(mesh);
        playerStack.push({
          mesh,
          type,
          h,
          targetY: currentTotalH + h / 2 + 0.1,
        });
      };

      window.serve = function () {
        const fb = document.getElementById('feedback');
        const hasBase = playerStack.some(
          (i) => i.type === 'cake' || i.type === 'choco'
        );
        if (!hasBase) {
          fb.innerText = '⚠️ 必須要有蛋糕胚！';
          fb.style.color = '#ff4d4d';
          setTimeout(() => (fb.innerText = ''), 1000);
          return;
        }

        const match =
          JSON.stringify(playerStack.map((i) => i.type)) ===
          JSON.stringify(currentOrder);
        if (match) {
          score += 500;
          fb.innerText = '✨ 完美的奶油藍莓蛋糕！';
          fb.style.color = '#ff1493';
        } else {
          score = Math.max(0, score - 100);
          fb.innerText = '❌ 做錯囉，再試一次';
          fb.style.color = '#ff4d4d';
        }
        document.getElementById('score').innerText = score;
        setTimeout(() => (fb.innerText = ''), 1500);
        playerStack.forEach((i) => scene.remove(i.mesh));
        playerStack = [];
        newOrder();
      };

      function animate() {
        requestAnimationFrame(animate);
        playerStack.forEach((i) => {
          if (i.mesh.position.y > i.targetY) i.mesh.position.y -= 0.45;
        });
        renderer.render(scene, camera);
      }

      newOrder();
      animate();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>校園導覽- 2D Map</title>
    <style>
      :root {
        --primary: #007aff;
        --bg-glass: rgba(255, 255, 255, 0.85);
        --shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      }

      body {
        margin: 0;
        background: #f8f9fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        overflow: hidden;
        touch-action: none;
      }

      /* 頂部標題 */
      #header {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        padding: 10px 20px;
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      #header h1 {
        margin: 0;
        font-size: 18px;
        color: #333;
      }

      /* 右側樓層控制面板 */
      #ui-layer {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: var(--bg-glass);
        backdrop-filter: blur(10px);
        padding: 10px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        z-index: 100;
      }
      .floor-btn {
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 15px;
        background: #fff;
        color: #666;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }
      .floor-btn:hover {
        background: #f0f0f0;
      }
      .floor-btn.active {
        background: var(--primary);
        color: white;
        transform: scale(1.1);
      }

      /* 照片彈窗 (Modal) */
      #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        display: none;
        z-index: 150;
        backdrop-filter: blur(4px);
      }
      #photo-modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        width: 90%;
        max-width: 360px;
        background: white;
        border-radius: 24px;
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 200;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
      }
      #photo-modal.show {
        display: flex;
        transform: translate(-50%, -50%) scale(1);
      }
      #modal-img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        background: #eee;
      }
      #modal-info {
        padding: 20px;
        text-align: center;
      }
      #modal-title {
        margin: 0 0 10px 0;
        font-size: 20px;
        color: #1d1d1f;
      }
      #modal-desc {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
      }
      #close-btn {
        padding: 12px;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 12px;
        width: 100%;
        font-weight: 600;
        cursor: pointer;
      }

      /* 座標偵錯提示 (開發時可用) */
      #debug-coord {
        position: absolute;
        bottom: 10px;
        left: 10px;
        font-size: 10px;
        color: #999;
        pointer-events: none;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="header"><h1>校園2D地圖</h1></div>

    <div id="modal-overlay" onclick="closeModal()"></div>
    <div id="photo-modal">
      <img id="modal-img" src="" />
      <div id="modal-info">
        <h4 id="modal-title"></h4>
        <p id="modal-desc">這裡可以放該地點的詳細介紹文字。</p>
        <button id="close-btn" onclick="closeModal()">返回地圖</button>
      </div>
    </div>

    <div id="ui-layer">
      <button class="floor-btn" onclick="focusFloor(5)">5F</button>
      <button class="floor-btn" onclick="focusFloor(4)">4F</button>
      <button class="floor-btn" onclick="focusFloor(3)">3F</button>
      <button class="floor-btn" onclick="focusFloor(2)">2F</button>
      <button class="floor-btn" onclick="focusFloor(1)">1F</button>
      <button class="floor-btn active" onclick="focusFloor(0)">G</button>
    </div>

    <div id="debug-coord">點擊地圖以獲取標記座標</div>

      ];
      const markerGroup = new THREE.Group();
      scene.add(markerGroup);

      // 標記圖示 (使用您提供的 Flaticon 或自定義 PNG)
      const iconTexture = loader.load(
        'https://cdn-icons-png.flaticon.com/512/684/684908.png'
      );

      // 地點資料庫
      const checkpoints = [
        {
          floor: 0,
          x: -2,
          z: 2,
          label: '學校大門',
          img: 'https://picsum.photos/600/400?random=1',
          desc: '這是學校的主入口，開放時間 07:00 - 21:00。',
        },
        {
          floor: 1,
          x: 3,
          z: -1,
          label: '美術教室',
          img: 'https://picsum.photos/600/400?random=2',
          desc: '位於一樓西側，擁有豐富的繪畫器材。',
        },
        {
          floor: 0,
          x: 4,
          z: 3,
          label: '圖書館',
          img: 'https://picsum.photos/600/400?random=3',
          desc: '安靜的閱覽空間，內有萬冊藏書。',
        },
      ];

      // --- 建立樓層 ---
      floorFiles.forEach((file, index) => {
        // 這裡載入你的地圖檔案
        const texture = loader.load(file, (tex) => {
          tex.colorSpace = THREE.SRGBColorSpace;
        });
        const floorPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(16, 10), // 根據你的地圖比例調整
          new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            visible: index === 0,
          })
        );
        floorPlane.rotation.x = -Math.PI / 2;
        scene.add(floorPlane);
        floors.push(floorPlane);
      });

      // --- 建立標記 ---
      checkpoints.forEach((cp) => {
        const spriteMat = new THREE.SpriteMaterial({
          map: iconTexture,
          color: 0x007aff,
        });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(0.8, 0.8, 1);
        sprite.position.set(cp.x, 0.2, cp.z);
        sprite.userData = cp;
        sprite.visible = cp.floor === 0;
        markerGroup.add(sprite);
      });

      // --- 功能函數 ---
      window.focusFloor = (idx) => {
        document.querySelectorAll('.floor-btn').forEach((btn) => {
          btn.classList.toggle(
            'active',
            parseInt(btn.innerText) === idx ||
              (btn.innerText === 'G' && idx === 0)
          );
        });

        floors.forEach((f, i) => (f.visible = i === idx));
        markerGroup.children.forEach(
          (m) => (m.visible = m.userData.floor === idx)
        );
      };

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        // 偵測點擊標記
        const intersects = raycaster.intersectObjects(markerGroup.children);
        if (intersects.length > 0) {
          const data = intersects[0].object.userData;
          openModal(data);
        }

        // 開發模式：顯示座標
        const planeIntersects = raycaster.intersectObjects(floors);
        if (planeIntersects.length > 0) {
          const p = planeIntersects[0].point;
          document.getElementById(
            'debug-coord'
          ).innerText = `開發座標：x: ${p.x.toFixed(2)}, z: ${p.z.toFixed(2)}`;
        }
      });

      window.openModal = (data) => {
        document.getElementById('modal-title').innerText = data.label;
        document.getElementById('modal-desc').innerText = data.desc;
        document.getElementById('modal-img').src = data.img;
        document.getElementById('modal-overlay').style.display = 'block';
        document.getElementById('photo-modal').style.display = 'flex';
        setTimeout(
          () => document.getElementById('photo-modal').classList.add('show'),
          10
        );
      };

      window.closeModal = () => {
        document.getElementById('modal-overlay').style.display = 'none';
        document.getElementById('photo-modal').classList.remove('show');
        setTimeout(
          () => (document.getElementById('photo-modal').style.display = 'none'),
          300
        );
      };

      // 適應視窗大小
      window.addEventListener('resize', () => {
        const aspect = window.innerWidth / window.innerHeight;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>

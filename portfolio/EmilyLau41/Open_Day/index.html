<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>3D 互動校園導覽地圖</title>
    <style>
      body {
        margin: 0;
        background: #1a1a1a;
        font-family: 'Microsoft JhengHei', sans-serif;
        overflow: hidden;
      }

      /* 左側控制面板 */
      #ui-layer {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 100;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        width: 150px;
      }

      h3 {
        margin: 0 0 15px 0;
        color: #333;
        font-size: 18px;
        border-bottom: 2px solid #007bff;
      }

      .floor-btn {
        display: block;
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        background: white;
        font-size: 14px;
        font-weight: bold;
      }

      .floor-btn:hover {
        background: #f0f7ff;
        border-color: #007bff;
      }
      .active {
        background: #007bff !important;
        color: white;
        border-color: #0056b3;
      }

      #reset-btn {
        margin-top: 15px;
        background: #f8f9fa;
        color: #666;
        border: 1px dashed #ccc;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="ui-layer">
      <h3>樓層選擇</h3>
      <button class="floor-btn" onclick="focusFloor(5)">5 樓</button>
      <button class="floor-btn" onclick="focusFloor(4)">4 樓</button>
      <button class="floor-btn" onclick="focusFloor(3)">3 樓</button>
      <button class="floor-btn" onclick="focusFloor(2)">2 樓</button>
      <button class="floor-btn" onclick="focusFloor(1)">1 樓</button>
      <button class="floor-btn active" onclick="focusFloor(0)">
        地面層 (G)
      </button>
      <button class="floor-btn" id="reset-btn" onclick="resetView()">
        重置視角
      </button>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

      // 1. 基本場景設定
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x222222); // 背景深灰色

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(25, 25, 25);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // 軌道控制 (滑鼠旋轉、縮放)
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const floors = [];
      const floorFiles = [
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/G_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/1_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/2_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/3_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/4_F.svg',
        'https://raw.githubusercontent.com/hkscpeterng/hksc-interactive-map/49e0da69e1fa86ad172ad05908e237f92cfee6db/5_F.svg',
      ];
      const floorHeight = 5; // 樓層間距

      // 2. 載入 SVG 紋理並建立樓層平面
      const loader = new THREE.TextureLoader();

      floorFiles.forEach((file, index) => {
        const texture = loader.load(file, (tex) => {
          // 提高解析度與清晰度
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        });

        const geometry = new THREE.PlaneGeometry(20, 10); // 根據地圖比例調整
        const material = new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
          opacity: 0.8,
        });

        const floorPlane = new THREE.Mesh(geometry, material);
        floorPlane.rotation.x = -Math.PI / 2; // 水平放置
        floorPlane.position.y = index * floorHeight;

        scene.add(floorPlane);
        floors.push(floorPlane);
      });

      // 3. 互動功能：聚焦特定樓層
      window.focusFloor = (floorIndex) => {
        // 更新按鈕樣式
        const btns = document.querySelectorAll('.floor-btn');
        btns.forEach((btn, i) => {
          // 索引反轉以匹配按鈕順序 (5,4,3,2,1,0)
          btn.classList.toggle('active', 5 - i === floorIndex);
        });

        // 樓層透明度切換
        floors.forEach((floor, i) => {
          if (i === floorIndex) {
            floor.material.opacity = 1.0;
            // 相機焦點移至該樓層中心
            controls.target.set(0, i * floorHeight, 0);
          } else {
            floor.material.opacity = 0.1; // 其他樓層淡出
          }
        });
      };

      // 重置視角
      window.resetView = () => {
        floors.forEach((f) => (f.material.opacity = 0.8));
        controls.target.set(0, 10, 0);
        camera.position.set(25, 25, 25);
        document
          .querySelectorAll('.floor-btn')
          .forEach((b) => b.classList.remove('active'));
      };

      // 環境光
      scene.add(new THREE.AmbientLight(0xffffff, 1));

      // 4. 動畫迴圈
      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      // 視窗縮放處理
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
      focusFloor(0); // 初始聚焦在地面層
    </script>
  </body>
</html>

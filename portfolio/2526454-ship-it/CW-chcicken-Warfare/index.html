<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONARCH v42.1: CHRONOS_SYNC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&display=swap');
        :root { --blue: #0099ff; --red: #ff0033; --void: #bc13fe; --cyan: #00f2ff; --bg: #010103; }
        body, html { margin: 0; padding: 0; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: #fff; }
        
        /* OVERLAYS */
        #overlay, #pause-overlay { position: absolute; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        #overlay { background: radial-gradient(circle, #08081a 0%, #000 100%); }
        #pause-overlay { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; z-index: 2500; }

        .menu-card { border: 2px solid var(--cyan); padding: 60px; text-align: center; background: rgba(0,0,0,0.9); box-shadow: 0 0 100px rgba(0, 242, 255, 0.15); }
        .play-btn { background: transparent; border: 2px solid #fff; color: #fff; padding: 20px 100px; font-family: 'Orbitron'; cursor: pointer; letter-spacing: 12px; font-size: 1.3rem; transition: 0.5s; text-transform: uppercase; }
        .play-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 50px var(--cyan); }
        .resume-btn { border-color: var(--void); color: var(--void); margin-top: 20px; }
        .resume-btn:hover { background: var(--void); color: #fff; box-shadow: 0 0 50px var(--void); }

        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 100; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; opacity: 0; transition: 1s; }
        .ui-panel { background: rgba(0,0,0,0.85); border: 2px solid var(--cyan); padding: 20px; backdrop-filter: blur(10px); }
        .wave-disp { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); text-align: center; }
        #wave-val { font-family: 'Orbitron'; font-size: 4.5rem; text-shadow: 0 0 30px var(--void); margin: 0; }
        
        #inventory { display: flex; justify-content: center; gap: 30px; align-items: flex-end; }
        .slot { width: 90px; height: 90px; border: 2px solid #222; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; position: relative; overflow: hidden; }
        .slot.active { border-color: var(--cyan); box-shadow: 0 0 30px var(--cyan); transform: translateY(-15px); }
        .slot.ready { border-color: var(--void); box-shadow: 0 0 35px var(--void); color: var(--void); }
        .bar { position: absolute; bottom: 0; left: 0; height: 6px; background: var(--cyan); width: 100%; transition: 0.3s; }

        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 10px var(--cyan); }
        #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 500; }
        #vignette { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.3) 100%); opacity: 0; pointer-events: none; transition: 0.1s; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

    <div id="overlay">
        <div class="menu-card">
            <h1 style="font-family:'Orbitron'; font-size:3.5rem; letter-spacing:15px; margin:0;">MONARCH_V42</h1>
            <p style="color:var(--void); letter-spacing:8px; margin-bottom:40px;">CURSED_POULTRY_WAVES</p>
            <button class="play-btn" id="start-game">INITIALIZE_SYNC</button>
        </div>
    </div>

    <div id="pause-overlay">
        <div class="menu-card" style="border-color: var(--void);">
            <h1 style="font-family:'Orbitron'; font-size:3rem; letter-spacing:10px; margin:0; color: var(--void);">SYSTEM_PAUSED</h1>
            <p style="color:#fff; letter-spacing:4px; margin-bottom:30px; opacity: 0.6;">TEMPORAL_STASIS_ACTIVE</p>
            <button class="play-btn resume-btn" id="resume-game">RESUME_SYNC</button>
        </div>
    </div>

    <div id="flash"></div>
    <div id="vignette"></div>

    <div id="hud">
        <div class="wave-disp">
            <div style="font-size: 0.8rem; letter-spacing: 8px; color: var(--cyan);">SECTOR_PURGE</div>
            <h1 id="wave-val">WAVE 1</h1>
            <div id="mob-stats" style="letter-spacing: 3px; color: #666;">THREATS_IN_BOUNDS: 0</div>
        </div>

        <div style="display: flex; justify-content: space-between; width: 100%;">
            <div class="ui-panel">
                <div style="font-size: 0.7rem; color: var(--cyan); letter-spacing: 4px;">PULSE_HEART</div>
                <div style="font-family:'Orbitron'; font-size: 2.2rem;" id="hp-txt">100%</div>
            </div>
            <div class="ui-panel" style="text-align: right; border-color: var(--void);">
                <div style="font-size: 0.7rem; color: var(--void); letter-spacing: 4px;">SOUL_CURSE</div>
                <div style="font-family:'Orbitron'; font-size: 2.2rem;" id="soul-txt">0 / 15</div>
            </div>
        </div>

        <div id="crosshair"></div>

        <div id="inventory">
            <div class="slot active" id="slot1">
                <span id="ammo-txt" style="font-size:1.5rem; font-weight:900;">15</span>
                <span style="font-size: 0.5rem;">TECHNIQUE</span>
                <div class="bar" id="ammo-bar"></div>
            </div>
            <div class="slot" id="slot2">
                <span style="font-size:1.1rem;">IMPACT</span>
                <span style="font-size: 0.5rem;">FIST</span>
            </div>
            <div class="slot" id="slotQ">
                <span style="font-weight:900; font-size:1.2rem;">VOID</span>
                <span style="font-size: 0.5rem;">[Q]</span>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class MonarchGame {
            constructor() {
                this.isLive = false;
                this.isPaused = false;
                this.mobs = [];
                this.bullets = [];
                this.clock = new THREE.Clock();
                
                this.waveNum = 1;
                this.waveQueue = 0;
                this.isWaveRunning = false;

                this.stats = { hp: 100, souls: 0, ammo: 15, max: 15, mode: 1, reloading: false };
                this.crouched = false;
                this.keys = { w:0, a:0, s:0, d:0, c:0, space:0 };
                this.phys = { v: new THREE.Vector3(), spd: 140, cSpd: 70, g: 250, h: 20, cH: 10, kb: new THREE.Vector3() };
                
                this.handTargPos = new THREE.Vector3(2.5, -2.5, -4);
                this.handTargRot = new THREE.Euler(0, 0, 0);

                this.initApp();
                this.initWorld();
                this.initGojoHand();
                this.initInputs();
                this.gameLoop();
            }

            initApp() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x010103);
                this.scene.fog = new THREE.FogExp2(0xff007f, 0.0002);

                this.cam = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 50000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(this.renderer.domElement);

                this.yaw = new THREE.Object3D();
                this.pitch = new THREE.Object3D();
                this.yaw.position.y = this.phys.h;
                this.yaw.add(this.pitch);
                this.pitch.add(this.cam);
                this.scene.add(this.yaw);
                this.scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            }

            initWorld() {
                const grid = new THREE.GridHelper(60000, 160, 0xff007f, 0x111122);
                this.scene.add(grid);
                for(let i=0; i<300; i++) {
                    const h = 500 + Math.random()*5000;
                    const p = new THREE.Mesh(new THREE.BoxGeometry(200, h, 200), new THREE.MeshStandardMaterial({color: 0x000, emissive: 0x00f2ff, emissiveIntensity: 0.2}));
                    p.position.set((Math.random()-0.5)*40000, h/2, (Math.random()-0.5)*40000);
                    this.scene.add(p);
                }
            }

            initGojoHand() {
                this.hand = new THREE.Group();
                const scale = 0.9;
                const arm = new THREE.Mesh(new THREE.BoxGeometry(1.3 * scale, 1.3 * scale, 5 * scale), new THREE.MeshStandardMaterial({color: 0x111111}));
                this.fist = new THREE.Mesh(new THREE.BoxGeometry(2.1 * scale, 2.1 * scale, 2.1 * scale), new THREE.MeshStandardMaterial({color: 0xffdbac, emissive: 0x0099ff, emissiveIntensity: 0.4}));
                this.fist.position.z = -3.5 * scale;
                this.hand.add(arm, this.fist);
                this.hand.position.copy(this.handTargPos);
                this.pitch.add(this.hand);
            }

            togglePause() {
                // Ignore pause if the start screen is still visible
                if(document.getElementById('overlay').style.display !== 'none') return;
                
                this.isPaused = !this.isPaused;
                const pLayer = document.getElementById('pause-overlay');
                
                if(this.isPaused) {
                    pLayer.style.display = 'flex';
                    document.exitPointerLock();
                } else {
                    pLayer.style.display = 'none';
                    document.body.requestPointerLock();
                }
            }

            initInputs() {
                document.getElementById('start-game').onclick = () => {
                    document.body.requestPointerLock();
                    document.getElementById('overlay').style.opacity = '0';
                    document.getElementById('hud').style.opacity = '1';
                    setTimeout(() => {
                        document.getElementById('overlay').style.display = 'none';
                        this.isLive = true;
                        this.launchWave();
                    }, 800);
                };

                // Resume button listener
                document.getElementById('resume-game').onclick = () => this.togglePause();

                document.addEventListener('pointerlockchange', () => { 
                    const wasLive = this.isLive;
                    this.isLive = (document.pointerLockElement === document.body);
                    
                    // If we lost pointer lock but aren't officially "Paused", trigger the pause menu
                    if(!this.isLive && wasLive && !this.isPaused) {
                        this.togglePause();
                    }
                });
                
                window.addEventListener('mousemove', (e) => {
                    if(!this.isLive || this.isPaused) return;
                    this.yaw.rotation.y -= e.movementX * 0.002;
                    this.pitch.rotation.x -= e.movementY * 0.002;
                    this.pitch.rotation.x = Math.max(-1.5, Math.min(1.5, this.pitch.rotation.x));
                });

                window.addEventListener('keydown', (e) => {
                    const k = e.key.toLowerCase();
                    
                    // Pause/Resume Key
                    if(k === 'p' || e.key === 'Escape') this.togglePause();
                    
                    if(this.isPaused) return;

                    if(k in this.keys) this.keys[k] = 1;
                    if(k === '1') this.setMode(1);
                    if(k === '2') this.setMode(2);
                    if(k === 'r') this.reloadAmmo();
                    if(k === 'q') this.useVoid();
                    if(k === 'c') this.crouched = !this.crouched;
                });

                window.addEventListener('keyup', (e) => { if(e.key.toLowerCase() in this.keys) this.keys[e.key.toLowerCase()] = 0; });
                window.addEventListener('mousedown', () => { if(this.isLive && !this.isPaused) this.handleCombat(); });
            }

            setMode(m) {
                this.stats.mode = m;
                document.getElementById('slot1').classList.toggle('active', m === 1);
                document.getElementById('slot2').classList.toggle('active', m === 2);
                if(m === 2) {
                    this.handTargPos.set(0, -1.8, -4.5);
                    this.fist.material.emissive.setHex(0xff0033);
                } else {
                    this.handTargPos.set(2.5, -2.5, -4);
                    this.fist.material.emissive.setHex(0x0099ff);
                }
            }

            launchWave() {
                this.isWaveRunning = true;
                this.waveQueue = 5 + (this.waveNum * 6);
                document.getElementById('wave-val').innerText = `WAVE ${this.waveNum}`;
                this.spawnManager();
            }

            spawnManager() {
                // Don't spawn while paused
                if(this.isPaused) {
                    setTimeout(() => this.spawnManager(), 500);
                    return;
                }
                if(this.waveQueue > 0 && this.isWaveRunning) {
                    this.spawnChicken();
                    this.waveQueue--;
                    setTimeout(() => this.spawnManager(), Math.max(600, 2000 - (this.waveNum * 250)));
                }
            }

            spawnChicken() {
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.BoxGeometry(10,12,10), new THREE.MeshStandardMaterial({color: 0xffffff}));
                const beak = new THREE.Mesh(new THREE.ConeGeometry(2,4,4), new THREE.MeshStandardMaterial({color: 0xffaa00}));
                beak.rotation.x = Math.PI/2; beak.position.z = -6.5;
                group.add(body, beak);
                const ang = Math.random() * Math.PI * 2;
                const dist = 500 + Math.random() * 400; 
                group.position.set(Math.cos(ang)*dist + this.yaw.position.x, 6, Math.sin(ang)*dist + this.yaw.position.z);
                this.mobs.push({ m: group, hp: 100 + (this.waveNum * 40), spd: 100 + (this.waveNum * 20), v: new THREE.Vector3(), time: Math.random() * 10 });
                this.scene.add(group);
                this.updateThreatUI();
            }

            handleCombat() {
                if(this.stats.reloading) return;
                if(this.stats.mode === 1) {
                    if(this.stats.ammo > 0) this.shoot();
                    else this.reloadAmmo();
                } else {
                    this.punch();
                }
            }

            shoot() {
                this.stats.ammo--;
                this.updateUI();
                this.hand.position.z += 1.6;
                this.hand.rotation.x -= 0.3;
                const orb = new THREE.Mesh(new THREE.SphereGeometry(0.8, 10, 10), new THREE.MeshBasicMaterial({color: this.stats.ammo % 2 === 0 ? 0x0099ff : 0xff0033}));
                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(this.cam.getWorldQuaternion(new THREE.Quaternion()));
                orb.position.copy(this.yaw.position).add(dir.clone().multiplyScalar(5));
                this.bullets.push({ m: orb, d: dir, life: 3.5 });
                this.scene.add(orb);
            }

            punch() {
                let start = Date.now();
                const dur = 240;
                const anim = () => {
                    if(this.isPaused) { requestAnimationFrame(anim); return; }
                    let elapsed = Date.now() - start;
                    let p = elapsed / dur;
                    if (p < 0.2) { this.hand.position.z = -4.5 + (p * 5); } 
                    else if (p < 0.6) { this.hand.position.z = -1 - (p * 18); } 
                    else if (p < 1) { this.hand.position.z = -4.5; } 
                    else { return; }
                    requestAnimationFrame(anim);
                };
                anim();
                this.mobs.forEach(m => {
                    if(m.m.position.distanceTo(this.yaw.position) < 95) {
                        m.hp -= 350;
                        m.v.add(m.m.position.clone().sub(this.yaw.position).normalize().multiplyScalar(300));
                    }
                });
            }

            reloadAmmo() {
                if(this.stats.reloading) return;
                this.stats.reloading = true;
                this.handTargPos.y = -8; 
                setTimeout(() => {
                    this.stats.ammo = this.stats.max;
                    this.stats.reloading = false;
                    this.setMode(this.stats.mode);
                    this.updateUI();
                }, 1000);
            }

            useVoid() {
                if(this.stats.souls < 15) return;
                this.stats.souls = 0;
                document.getElementById('flash').style.opacity = '1';
                this.mobs.forEach(m => m.hp = 0);
                setTimeout(() => { document.getElementById('flash').style.opacity = '0'; }, 300);
                this.updateUI();
            }

            updateUI() {
                document.getElementById('hp-txt').innerText = Math.ceil(this.stats.hp) + "%";
                document.getElementById('soul-txt').innerText = `${this.stats.souls} / 15`;
                document.getElementById('ammo-txt').innerText = this.stats.ammo;
                document.getElementById('ammo-bar').style.width = (this.stats.ammo/this.stats.max)*100 + "%";
                if(this.stats.souls >= 15) document.getElementById('slotQ').classList.add('ready');
                else document.getElementById('slotQ').classList.remove('ready');
            }

            updateThreatUI() {
                document.getElementById('mob-stats').innerText = `THREATS_IN_BOUNDS: ${this.mobs.length + this.waveQueue}`;
            }

            gameLoop() {
                requestAnimationFrame(() => this.gameLoop());
                
                // CRITICAL: Stop logic processing if paused
                if(!this.isLive || this.isPaused) return;
                
                const dt = this.clock.getDelta();

                const targetH = this.crouched ? this.phys.cH : this.phys.h;
                this.yaw.position.y = THREE.MathUtils.lerp(this.yaw.position.y, targetH, 0.1);
                this.hand.position.lerp(this.handTargPos, 0.15);
                this.hand.rotation.set(THREE.MathUtils.lerp(this.hand.rotation.x, 0, 0.1), THREE.MathUtils.lerp(this.hand.rotation.y, 0, 0.1), THREE.MathUtils.lerp(this.hand.rotation.z, 0, 0.1));

                const spd = this.crouched ? this.phys.cSpd : this.phys.spd;
                const move = new THREE.Vector3(this.keys.d - this.keys.a, 0, this.keys.s - this.keys.w).normalize().applyQuaternion(this.yaw.quaternion);
                this.phys.v.x = move.x * spd;
                this.phys.v.z = move.z * spd;
                this.yaw.position.add(this.phys.v.clone().multiplyScalar(dt));
                this.yaw.position.add(this.phys.kb.clone().multiplyScalar(dt));
                this.phys.kb.multiplyScalar(0.85);

                for(let i=this.bullets.length-1; i>=0; i--) {
                    const b = this.bullets[i];
                    b.m.position.add(b.d.clone().multiplyScalar(2800 * dt));
                    b.life -= dt;
                    this.mobs.forEach(m => { if(b.m.position.distanceTo(m.m.position) < 35) { m.hp -= 150; b.life = 0; }});
                    if(b.life <= 0) { this.scene.remove(b.m); this.bullets.splice(i,1); }
                }

                for(let i=this.mobs.length-1; i>=0; i--) {
                    const m = this.mobs[i];
                    m.time += dt;
                    const bob = Math.sin(m.time * 15) * 4;
                    const stutter = Math.abs(Math.sin(m.time * 5)) > 0.3 ? 1 : 0;
                    m.m.lookAt(this.yaw.position.x, 6 + bob, this.yaw.position.z);
                    m.m.translateZ(m.spd * stutter * dt);
                    m.m.position.y = 6 + bob;
                    m.m.position.add(m.v.clone().multiplyScalar(dt));
                    m.v.multiplyScalar(0.9);

                    if(m.m.position.distanceTo(this.yaw.position) < 35) {
                        this.stats.hp -= 35 * dt;
                        this.phys.kb.add(this.yaw.position.clone().sub(m.m.position).normalize().multiplyScalar(150));
                        document.getElementById('vignette').style.opacity = "1";
                        setTimeout(()=> document.getElementById('vignette').style.opacity = "0", 100);
                        this.updateUI();
                        if(this.stats.hp <= 0) location.reload();
                    }

                    if(m.hp <= 0) {
                        this.stats.souls = Math.min(15, this.stats.souls + 1);
                        this.scene.remove(m.m);
                        this.mobs.splice(i,1);
                        this.updateUI();
                        this.updateThreatUI();
                    }
                }

                if(this.mobs.length === 0 && this.waveQueue === 0 && this.isWaveRunning) {
                    this.isWaveRunning = false;
                    this.waveNum++;
                    setTimeout(() => this.launchWave(), 4000);
                }

                this.renderer.render(this.scene, this.cam);
            }
        }
        window.onload = () => new MonarchGame();
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Orphanage: Triple Gold Escape</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #hud { width: 550px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; border-bottom: 2px solid #444; padding-bottom: 5px; }
        canvas { border: 2px solid #222; background: #050505; }
        .gold-text { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .boost-active { animation: pulse 0.3s infinite; color: #fff; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

    <div id="hud">
        <span id="msg">FIND THE 3 GOLDEN APPLES</span>
        <span class="gold-text">GOLD: <span id="count">0</span>/3</span>
    </div>
    <canvas id="tripleCanvas" width="550" height="650"></canvas>

    <script>
        const canvas = document.getElementById('tripleCanvas');
        const ctx = canvas.getContext('2d');

        let leader = { x: 275, y: 600, size: 6, speed: 2.5 };
        let ally = { x: 275, y: 620, size: 4, speed: 2.1 };
        let hunter = { x: 275, y: 50, size: 28, speed: 1.5, color: '#f00' };
        
        // Progression Logic
        let apples = [
            { x: 150, y: 450, active: true },
            { x: 400, y: 300, active: true },
            { x: 275, y: 150, active: true }
        ];
        let goldCount = 0;
        let lightPower = 0;
        const keys = {};

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function update() {
            // Player Movement
            if (keys['KeyW'] && leader.y > 10) leader.y -= leader.speed;
            if (keys['KeyS'] && leader.y < 640) leader.y += leader.speed;
            if (keys['KeyA'] && leader.x > 90) leader.x -= leader.speed;
            if (keys['KeyD'] && leader.x < 460) leader.x += leader.speed;

            // Ally Follows
            let dToLeader = Math.hypot(leader.x - ally.x, leader.y - ally.y);
            if (dToLeader > 30) {
                let angle = Math.atan2(leader.y - ally.y, leader.x - ally.x);
                ally.x += Math.cos(angle) * ally.speed;
                ally.y += Math.sin(angle) * ally.speed;
            }

            // Hunter Logic (Stunned if light is high)
            if (lightPower <= 0) {
                let angleH = Math.atan2(leader.y - hunter.y, leader.x - hunter.x);
                hunter.x += Math.cos(angleH) * hunter.speed;
                hunter.y += Math.sin(angleH) * hunter.speed;
            } else {
                lightPower--;
            }

            // Collecting Apples
            apples.forEach(a => {
                if (a.active && Math.hypot(leader.x - a.x, leader.y - a.y) < 20) {
                    a.active = false;
                    goldCount++;
                    document.getElementById('count').innerText = goldCount;
                    
                    if (goldCount === 1) {
                        lightPower = 200; // First apple stuns
                        document.getElementById('msg').innerText = "LIGHT UP! FIND MORE!";
                    } else if (goldCount === 3) {
                        lightPower = 600; // Final 2 apples make you super fast
                        leader.speed = 4.5;
                        ally.speed = 4.1;
                        document.getElementById('msg').innerText = "OVERDRIVE! ESCAPE NOW!";
                        document.getElementById('msg').className = "boost-active";
                    }
                }
            });

            // Collision
            [leader, ally].forEach(p => {
                if (Math.hypot(p.x - hunter.x, p.y - hunter.y) < hunter.size && lightPower <= 0) {
                    alert("THE HUNTER CAUGHT YOU IN THE DARK.");
                    location.reload();
                }
            });

            // Arrive
            if (leader.y < 20 && ally.y < 50) {
                alert("THE GOLDEN APPLES SAVED YOU. YOU ARE FREE!");
                location.reload();
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Orphanage Walls
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, 85, 650);
            ctx.fillRect(465, 0, 85, 650);

            // Draw Apples
            apples.forEach(a => {
                if (a.active) {
                    ctx.fillStyle = '#ffd700';
                    ctx.beginPath(); ctx.arc(a.x, a.y, 8, 0, Math.PI*2); ctx.fill();
                    // Glow effect
                    ctx.shadowBlur = 10; ctx.shadowColor = "#ffd700";
                }
            });

            // Draw Hunter
            ctx.fillStyle = lightPower > 0 ? '#333' : '#f00';
            ctx.beginPath(); ctx.arc(hunter.x, hunter.y, hunter.size, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Duo
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(leader.x, leader.y, leader.size, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath(); ctx.arc(ally.x, ally.y, ally.size, 0, Math.PI*2); ctx.fill();

            // Light Play
            if (lightPower > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${lightPower / 600})`;
                ctx.fillRect(0,0,550,650);
            } else {
                let g = ctx.createRadialGradient(leader.x, leader.y, 10, leader.x, leader.y, 150);
                g.addColorStop(0, 'rgba(0,0,0,0)');
                g.addColorStop(1, 'rgba(0,0,0,0.98)');
                ctx.fillStyle = g;
                ctx.fillRect(0,0,550,650);
            }

            requestAnimationFrame(() => { update(); draw(); });
        }
        draw();
    </script>
</body>
</html>DW

<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <title>NBA 3D: 顛倒世界大亂鬥</title>
    <style>
      /* --- CSS 樣式 --- */
      body {
        margin: 0;
        background-color: #050505;
        color: white;
        font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        transition: transform 1s ease-in-out; /* 顛倒特效 */
      }

      /* 頂部轉播介面 */
      .tv-header {
        width: 1100px;
        background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
        border-bottom: 4px solid #fdb927;
        padding: 10px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        border-radius: 0 0 20px 20px;
        z-index: 10;
        position: relative;
      }

      .team-box {
        width: 300px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .team-name {
        font-size: 24px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 5px;
      }
      .score {
        font-size: 70px;
        font-weight: 900;
        line-height: 0.9;
        font-family: 'Impact', sans-serif;
      }

      .lakers-col {
        color: #fdb927;
        text-shadow: 2px 2px 0px #552583;
      }
      .clippers-col {
        color: #fff;
        text-shadow: 2px 2px 0px #1d428a;
      }

      .center-info {
        width: 220px;
        text-align: center;
        background: #111;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #333;
      }
      .timer {
        font-family: 'Courier New', monospace;
        font-size: 45px;
        color: #ff3b30;
        font-weight: bold;
        letter-spacing: 2px;
      }
      .quarter {
        color: #888;
        font-size: 14px;
        font-weight: bold;
        margin-top: 5px;
        text-transform: uppercase;
      }

      /* 3D 遊戲畫布 */
      canvas {
        background: radial-gradient(circle at center, #2c3e50, #000);
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.7);
        cursor: none;
        border-left: 10px solid #552583;
        border-right: 10px solid #1d428a;
        margin-top: 20px;
        transition: transform 1s;
      }

      /* 跑馬燈 */
      .ticker-bar {
        width: 1100px;
        height: 40px;
        background: #000;
        border: 2px solid #333;
        border-top: none;
        display: flex;
        align-items: center;
        overflow: hidden;
        position: relative;
      }
      .live-tag {
        background: #e74c3c;
        color: white;
        padding: 0 15px;
        height: 100%;
        display: flex;
        align-items: center;
        font-weight: bold;
        z-index: 2;
        font-size: 14px;
      }
      .ticker-text {
        position: absolute;
        white-space: nowrap;
        color: #fdb927;
        font-size: 18px;
        font-weight: bold;
        animation: scroll 15s linear infinite;
        left: 100%;
      }
      @keyframes scroll {
        0% {
          left: 100%;
        }
        100% {
          left: -100%;
        }
      }

      /* 控制說明 */
      .controls-hint {
        margin-top: 15px;
        color: #666;
        font-size: 13px;
        text-align: center;
        font-family: monospace;
      }
      .key {
        background: #333;
        padding: 2px 6px;
        border-radius: 4px;
        color: #ccc;
        border: 1px solid #555;
      }

      /* 顛倒按鈕 */
      .btn-upside-down {
        margin-top: 10px;
        padding: 10px 20px;
        background: #e1b12c;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        color: black;
        box-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
      }
      .btn-upside-down:hover {
        background: #fbc531;
      }

      /* 顛倒特效 class */
      .upside-down-mode {
        transform: rotate(180deg);
      }

      /* 遮罩 */
      #overlay {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        transform: rotate(0deg) !important; /* 確保遮罩永遠是正的 */
      }
      h1 {
        font-size: 60px;
        color: gold;
        text-shadow: 0 0 30px orange;
        margin: 0;
      }
      h2 {
        font-size: 24px;
        color: #aaa;
        margin-bottom: 40px;
        font-weight: normal;
      }
      button.start-btn {
        padding: 15px 60px;
        font-size: 28px;
        font-weight: bold;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        background: linear-gradient(90deg, #fdb927, #ff6b6b);
        color: #000;
        box-shadow: 0 0 20px rgba(253, 185, 39, 0.5);
        transition: transform 0.2s;
      }
      button.start-btn:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <div class="main-container" id="gameContainer">
      <div class="tv-header">
        <div class="team-box">
          <div class="team-name lakers-col">LAKERS (P1)</div>
          <div class="score lakers-col" id="scoreLakers">0</div>
        </div>

        <div class="center-info">
          <div class="timer" id="timerDisplay">6:00</div>
          <div class="quarter" id="quarterDisplay">1st QUARTER</div>
        </div>

        <div class="team-box">
          <div class="team-name clippers-col">CLIPPERS (P2)</div>
          <div class="score clippers-col" id="scoreClippers">0</div>
        </div>
      </div>

      <canvas id="gameCanvas" width="1100" height="600"></canvas>

      <div class="ticker-bar">
        <div class="live-tag">LIVE</div>
        <div class="ticker-text" id="ticker">
          🔥 顛倒世界 NBA 決賽！4節大戰，每節6分鐘！半場換邊！誰能適應重力反轉？
        </div>
      </div>
    </div>

    <div class="controls-hint">
      🟣 P1: <span class="key">WASD</span> 移動 |
      <span class="key">Space</span> 跳投/籃板 |
      <span class="key">Shift</span> 衝刺 <br />
      🔵 P2: <span class="key">方向鍵</span> 移動 |
      <span class="key">Enter</span> 跳投/籃板 |
      <span class="key">右Shift</span> 衝刺
    </div>

    <button class="btn-upside-down" onclick="toggleUpsideDown()">
      🙃 切換顛倒模式 (Upside Down)
    </button>

    <div id="overlay">
      <h1>UPSIDE DOWN NBA</h1>
      <h2>4 節賽制 | 6 分鐘/節 | 自動換邊 | 3D 合成人型</h2>
      <button class="start-btn" onclick="startGame()">START GAME</button>
    </div>

    <script>
      /**
       * 3D 引擎與遊戲核心
       */
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const gameContainer = document.getElementById('gameContainer');

      // 世界參數
      const WORLD_W = 1200;
      const WORLD_D = 800; // Z軸深度

      // 物理參數
      const GRAVITY = 0.55;
      const FRICTION = 0.9;
      const WALL_BOUNCE = 0.9;
      const FLOOR_BOUNCE = 0.75;

      // 賽制
      const QUARTER_TIME = 360; // 6分鐘 = 360秒
      const MAX_QUARTERS = 4;

      // 狀態
      let gameState = 'MENU';
      let currentQuarter = 1;
      let timeRemaining = QUARTER_TIME;
      let scores = { lakers: 0, clippers: 0 };
      let timerInterval = null;
      let particles = [];
      let ball = null;
      let players = [];
      let switchSides = false; // 是否換邊
      let isUpsideDown = false; // 顛倒狀態

      // --- 3D 投影核心 (Projection) ---
      function project(x, y, z) {
        const FL = 600; // 焦距
        const offsetZ = 400;
        const scale = FL / (FL + z + offsetZ);

        const sx = canvas.width / 2 + (x - WORLD_W / 2) * scale;
        const sy = canvas.height / 2 + (y - 200) * scale;

        return { sx, sy, scale };
      }

      // --- 物件類別 ---

      class Object3D {
        constructor(x, y, z) {
          this.x = x;
          this.y = y;
          this.z = z;
          this.vx = 0;
          this.vy = 0;
          this.vz = 0;
        }
      }

      // 籃球
      class Ball extends Object3D {
        constructor() {
          super(WORLD_W / 2, 400, WORLD_D / 2);
          this.r = 14;
        }
        update() {
          this.vy -= GRAVITY;
          this.vx *= 0.99;
          this.vz *= 0.99;

          this.x += this.vx;
          this.y += this.vy;
          this.z += this.vz;

          // 地板反彈
          if (this.y < 0) {
            this.y = 0;
            this.vy *= -FLOOR_BOUNCE;
            if (Math.abs(this.vy) < 2) this.vy = 0;
          }

          // --- 3D 邊界反彈邏輯 ---
          if (this.x < 0) {
            this.x = 0;
            this.vx *= -WALL_BOUNCE;
            this.spawnEffect('BANG!');
          }
          if (this.x > WORLD_W) {
            this.x = WORLD_W;
            this.vx *= -WALL_BOUNCE;
            this.spawnEffect('BANG!');
          }
          if (this.z < -200) {
            this.z = -200;
            this.vz *= -WALL_BOUNCE;
            this.spawnEffect('BACKBOARD!');
          }
          if (this.z > WORLD_D) {
            this.z = WORLD_D;
            this.vz *= -WALL_BOUNCE;
            this.spawnEffect('SCREEN!');
          }
        }

        spawnEffect(txt) {
          if (Math.abs(this.vx) > 5 || Math.abs(this.vz) > 5) {
            particles.push(new EffectText(this.x, this.y, this.z, txt));
          }
        }

        draw(ctx) {
          let p = project(this.x, this.y, this.z);
          let s = project(this.x, 0, this.z);

          // 影子
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.beginPath();
          ctx.ellipse(s.sx, s.sy, 15 * s.scale, 6 * s.scale, 0, 0, Math.PI * 2);
          ctx.fill();

          // 球體
          let r = this.r * p.scale;
          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
          ctx.fill();

          // 球紋
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 2 * p.scale;
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
          ctx.stroke();

          // 高光
          ctx.fillStyle = 'rgba(255,255,255,0.3)';
          ctx.beginPath();
          ctx.arc(p.sx - r * 0.3, p.sy - r * 0.3, r * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 合成人型 (Synthetic Human)
      class Player extends Object3D {
        constructor(x, z, team, data) {
          super(x, 0, z);
          this.team = team;
          this.name = data.name;
          this.role = data.role;
          this.stamina = 100;
          this.color = team === 'lakers' ? '#FDB927' : '#fff';
          this.limbColor = team === 'lakers' ? '#552583' : '#1D428A';

          this.walkFrame = Math.random() * 10;
          this.isMoving = false;
        }

        update() {
          let speed = this.role === 'BOT' ? 1.2 : 2.5;
          let sprint = false;
          let jump = false;
          this.isMoving = false;

          // 輸入處理
          if (this.role === 'P1') {
            if (keys['Shift'] && this.stamina > 0) {
              speed = 4.5;
              this.stamina -= 1;
              sprint = true;
            } else if (this.stamina < 100) this.stamina += 0.5;

            if (keys['w']) {
              this.vz -= speed;
              this.isMoving = true;
            }
            if (keys['s']) {
              this.vz += speed;
              this.isMoving = true;
            }
            if (keys['a']) {
              this.vx -= speed;
              this.isMoving = true;
            }
            if (keys['d']) {
              this.vx += speed;
              this.isMoving = true;
            }
            if (keys[' '] && this.y <= 0) jump = true;
          } else if (this.role === 'P2') {
            if ((keys['ShiftRight'] || keys['Control']) && this.stamina > 0) {
              speed = 4.5;
              this.stamina -= 1;
              sprint = true;
            } else if (this.stamina < 100) this.stamina += 0.5;

            if (keys['ArrowUp']) {
              this.vz -= speed;
              this.isMoving = true;
            }
            if (keys['ArrowDown']) {
              this.vz += speed;
              this.isMoving = true;
            }
            if (keys['ArrowLeft']) {
              this.vx -= speed;
              this.isMoving = true;
            }
            if (keys['ArrowRight']) {
              this.vx += speed;
              this.isMoving = true;
            }
            if (keys['Enter'] && this.y <= 0) jump = true;
          } else {
            this.botAI(speed);
            if (this.stamina < 100) this.stamina += 0.5;
          }

          if (jump) {
            this.vy = 16;
            this.tryRebound();
          }

          // 物理
          this.vy -= GRAVITY;
          this.vx *= FRICTION;
          this.vz *= FRICTION;
          this.x += this.vx;
          this.y += this.vy;
          this.z += this.vz;

          // 邊界
          if (this.y < 0) {
            this.y = 0;
            this.vy = 0;
          }
          if (this.x < 0) {
            this.x = 0;
            this.vx = 0;
          }
          if (this.x > WORLD_W) {
            this.x = WORLD_W;
            this.vx = 0;
          }
          if (this.z < -200) {
            this.z = -200;
            this.vz = 0;
          }
          if (this.z > WORLD_D) {
            this.z = WORLD_D;
            this.vz = 0;
          }

          // 動畫幀
          if (this.isMoving) this.walkFrame += 0.25;
          else this.walkFrame = 0;
        }

        botAI(spd) {
          let dx = ball.x - this.x;
          let dz = ball.z - this.z;

          // 換邊邏輯
          let targetX =
            this.team === 'lakers'
              ? switchSides
                ? 0
                : WORLD_W
              : switchSides
              ? WORLD_W
              : 0;

          // 追球
          let dist = Math.sqrt(dx * dx + dz * dz);
          if (dist > 30) {
            if (dx > 20) {
              this.vx += 0.5;
              this.isMoving = true;
            }
            if (dx < -20) {
              this.vx -= 0.5;
              this.isMoving = true;
            }
            if (dz > 20) {
              this.vz += 0.5;
              this.isMoving = true;
            }
            if (dz < -20) {
              this.vz -= 0.5;
              this.isMoving = true;
            }
          }

          // 限制速度
          if (this.vx > spd) this.vx = spd;
          if (this.vx < -spd) this.vx = -spd;
          if (this.vz > spd) this.vz = spd;
          if (this.vz < -spd) this.vz = -spd;

          if (this.y === 0 && ball.y > this.y && ball.vy < 0 && dist < 60) {
            if (Math.random() < 0.05) {
              this.vy = 16;
              this.tryRebound();
            }
          }
        }

        tryRebound() {
          let dist = Math.sqrt(
            (this.x - ball.x) ** 2 +
              (this.y + 60 - ball.y) ** 2 +
              (this.z - ball.z) ** 2
          );
          if (ball.vy < 0 && dist < 80) {
            ball.vx = (this.x - ball.x) * 0.15;
            ball.vz = (this.z - ball.z) * 0.15;
            ball.vy = 9;
            particles.push(
              new EffectText(this.x, this.y + 100, this.z, 'TOUCH')
            );
          }
        }

        draw(ctx) {
          // 合成動畫計算
          let bob = Math.sin(this.walkFrame) * 5;
          let legSwing = Math.sin(this.walkFrame) * 20;
          let armSwing = Math.cos(this.walkFrame) * 20;

          let head = project(this.x, this.y + 70 + bob, this.z);
          let hips = project(this.x, this.y + 35 + bob, this.z);
          let footL = project(this.x - 10, 0, this.z + legSwing);
          let footR = project(this.x + 10, 0, this.z - legSwing);
          let handL = project(this.x - 25, this.y + 35 + armSwing, this.z);
          let handR = project(this.x + 25, this.y + 35 - armSwing, this.z);

          let scale = head.scale;

          // 影子
          let s = project(this.x, 0, this.z);
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(s.sx, s.sy, 18 * scale, 8 * scale, 0, 0, Math.PI * 2);
          ctx.fill();

          // 繪製骨架
          ctx.lineCap = 'round';

          // 腿
          ctx.strokeStyle = this.limbColor;
          ctx.lineWidth = 9 * scale;
          ctx.beginPath();
          ctx.moveTo(hips.sx, hips.sy);
          ctx.lineTo(footL.sx, footL.sy);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(hips.sx, hips.sy);
          ctx.lineTo(footR.sx, footR.sy);
          ctx.stroke();

          // 軀幹
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 16 * scale;
          ctx.beginPath();
          ctx.moveTo(hips.sx, hips.sy);
          ctx.lineTo(head.sx, head.sy + 10 * scale);
          ctx.stroke();

          // 手臂
          ctx.strokeStyle = this.limbColor;
          ctx.lineWidth = 8 * scale;
          ctx.beginPath();
          ctx.moveTo(head.sx, head.sy + 10 * scale);
          ctx.lineTo(handL.sx, handL.sy);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(head.sx, head.sy + 10 * scale);
          ctx.lineTo(handR.sx, handR.sy);
          ctx.stroke();

          // 頭
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(head.sx, head.sy, 12 * scale, 0, Math.PI * 2);
          ctx.fill();

          // 名字
          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.font = `bold ${12 * scale}px Arial`;
          ctx.fillText(this.name, head.sx, head.sy - 25 * scale);

          // 玩家箭頭
          if (this.role.startsWith('P')) {
            ctx.fillStyle = this.role === 'P1' ? 'gold' : 'cyan';
            ctx.beginPath();
            ctx.moveTo(head.sx, head.sy - 40 * scale);
            ctx.lineTo(head.sx - 6, head.sy - 50 * scale);
            ctx.lineTo(head.sx + 6, head.sy - 50 * scale);
            ctx.fill();
          }
        }
      }

      class EffectText {
        constructor(x, y, z, text) {
          this.x = x;
          this.y = y;
          this.z = z;
          this.text = text;
          this.life = 40;
          this.vy = 2;
        }
        update() {
          this.y += this.vy;
          this.life--;
        }
        draw(ctx) {
          let p = project(this.x, this.y, this.z);
          ctx.globalAlpha = this.life / 40;
          ctx.fillStyle = '#fff';
          ctx.font = `bold ${24 * p.scale}px Arial`;
          ctx.fillText(this.text, p.sx, p.sy);
          ctx.globalAlpha = 1.0;
        }
      }

      // --- 遊戲邏輯 ---
      const keys = {};
      ball = new Ball();

      const ROSTER = {
        lakers: [
          { name: 'LEBRON', role: 'P1' },
          { name: 'DAVIS', role: 'BOT' },
          { name: 'REAVES', role: 'BOT' },
          { name: 'RUSSELL', role: 'BOT' },
          { name: 'HACHIMURA', role: 'BOT' },
        ],
        clippers: [
          { name: 'KAWHI', role: 'P2' },
          { name: 'HARDEN', role: 'BOT' },
          { name: 'ZUBAC', role: 'BOT' },
          { name: 'MANN', role: 'BOT' },
          { name: 'POWELL', role: 'BOT' },
        ],
      };

      function initGame() {
        players = [];
        // 換邊配置
        let lakerX = switchSides ? 1000 : 200;
        let clipperX = switchSides ? 200 : 1000;

        ROSTER.lakers.forEach((d, i) =>
          players.push(
            new Player(
              lakerX + (switchSides ? -1 : 1) * i * 30,
              100 + i * 50,
              'lakers',
              d
            )
          )
        );
        ROSTER.clippers.forEach((d, i) =>
          players.push(
            new Player(
              clipperX + (switchSides ? 1 : -1) * i * 30,
              100 + i * 50,
              'clippers',
              d
            )
          )
        );
        resetBall();
      }

      function resetBall() {
        ball.x = WORLD_W / 2;
        ball.y = 400;
        ball.z = WORLD_D / 2;
        ball.vx = 0;
        ball.vz = 0;
        ball.vy = 0;
      }

      function toggleUpsideDown() {
        isUpsideDown = !isUpsideDown;
        if (isUpsideDown) {
          gameContainer.classList.add('upside-down-mode');
          updateTicker('⚠️ 警告：重力系統已反轉！世界顛倒了！');
        } else {
          gameContainer.classList.remove('upside-down-mode');
          updateTicker('✅ 重力系統恢復正常。');
        }
      }

      function startGame() {
        document.getElementById('overlay').style.display = 'none';
        gameState = 'PLAYING';
        initGame();
        startClock();
        loop();
      }

      function startClock() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (gameState === 'PLAYING' && timeRemaining > 0) {
            timeRemaining--;
            let m = Math.floor(timeRemaining / 60);
            let s = timeRemaining % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${
              s < 10 ? '0' + s : s
            }`;
            if (Math.random() < 0.01) updateTicker('LeBron 正在呼叫戰術...');
          } else if (timeRemaining <= 0) {
            nextQuarter();
          }
        }, 1000);
      }

      function nextQuarter() {
        gameState = 'PAUSED';
        if (currentQuarter < MAX_QUARTERS) {
          currentQuarter++;
          if (currentQuarter === 3) switchSides = true;

          document.getElementById('quarterDisplay').innerText =
            ['1st', '2nd', '3rd', '4th'][currentQuarter - 1] + ' QUARTER';
          timeRemaining = QUARTER_TIME;

          let title = `第 ${currentQuarter - 1} 節結束`;
          let sub =
            currentQuarter === 3 ? '半場休息！交換場地！' : '準備開始下一節';
          showModal(title, sub);
          initGame();
        } else {
          endGame();
        }
      }

      function endGame() {
        gameState = 'END';
        let msg =
          scores.lakers > scores.clippers ? 'LAKERS WIN!' : 'CLIPPERS WIN!';
        showModal('比賽結束', msg);
      }

      function showModal(h1, h2) {
        const ov = document.getElementById('overlay');
        ov.style.display = 'flex';
        ov.querySelector('h1').innerText = h1;
        ov.querySelector('h2').innerText = h2;
        ov.querySelector('button').onclick = () => {
          ov.style.display = 'none';
          if (gameState === 'END') location.reload();
          else gameState = 'PLAYING';
        };
      }

      function update() {
        if (gameState !== 'PLAYING') return;
        ball.update();
        players.forEach((p) => p.update());

        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        // 碰撞檢測
        players.forEach((p) => {
          let dx = p.x - ball.x;
          let dy = p.y + 45 - ball.y;
          let dz = p.z - ball.z;
          let dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
          if (dist < 40) {
            let angleXZ = Math.atan2(dz, dx);
            let force = p.isMoving ? 18 : 10;
            ball.vx = -Math.cos(angleXZ) * force;
            ball.vz = -Math.sin(angleXZ) * force;
            ball.vy = 12;
            particles.push(new EffectText(p.x, p.y + 80, p.z, 'HIT'));
          }
        });

        checkScore();
      }

      function checkScore() {
        // 籃框區域
        let inLeftHoop =
          ball.x < 60 && ball.y > 200 && ball.z > 250 && ball.z < 350;
        let inRightHoop =
          ball.x > WORLD_W - 60 && ball.y > 200 && ball.z > 250 && ball.z < 350;

        if (inLeftHoop || inRightHoop) {
          // 換邊得分邏輯
          if (inRightHoop) {
            if (!switchSides) {
              scores.lakers += 2;
              updateTicker('湖人隊得分！');
            } else {
              scores.clippers += 2;
              updateTicker('快艇隊得分！');
            }
          }
          if (inLeftHoop) {
            if (!switchSides) {
              scores.clippers += 2;
              updateTicker('快艇隊得分！');
            } else {
              scores.lakers += 2;
              updateTicker('湖人隊得分！');
            }
          }
          resetBall();
        }
        document.getElementById('scoreLakers').innerText = scores.lakers;
        document.getElementById('scoreClippers').innerText = scores.clippers;
      }

      function updateTicker(msg) {
        const el = document.getElementById('ticker');
        el.innerText = msg;
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'scroll 15s linear infinite';
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 3D 地板
        let bl = project(0, 0, -200);
        let br = project(WORLD_W, 0, -200);
        let fl = project(0, 0, WORLD_D);
        let fr = project(WORLD_W, 0, WORLD_D);

        let grad = ctx.createLinearGradient(0, bl.sy, 0, fl.sy);
        grad.addColorStop(0, '#d35400');
        grad.addColorStop(1, '#e67e22');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(bl.sx, bl.sy);
        ctx.lineTo(br.sx, br.sy);
        ctx.lineTo(fr.sx, fr.sy);
        ctx.lineTo(fl.sx, fl.sy);
        ctx.fill();

        // 禁區線
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let mid1 = project(WORLD_W / 2, 0, -200);
        let mid2 = project(WORLD_W / 2, 0, WORLD_D);
        ctx.moveTo(mid1.sx, mid1.sy);
        ctx.lineTo(mid2.sx, mid2.sy);
        ctx.stroke();

        // Z-Sort
        let allObjs = [...players, ball, ...particles].sort(
          (a, b) => a.z - b.z
        );
        allObjs.forEach((o) => o.draw(ctx));

        // 籃框
        let lh = project(30, 260, 300);
        ctx.strokeStyle = 'orange';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(lh.sx, lh.sy, 30 * lh.scale, 0, Math.PI * 2);
        ctx.stroke();

        let rh = project(WORLD_W - 30, 260, 300);
        ctx.beginPath();
        ctx.arc(rh.sx, rh.sy, 30 * rh.scale, 0, Math.PI * 2);
        ctx.stroke();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Shift') {
          if (e.location === 2) keys['ShiftRight'] = true;
          else keys['Shift'] = true;
        } else keys[e.key] = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'Shift') {
          if (e.location === 2) keys['ShiftRight'] = false;
          else keys['Shift'] = false;
        } else keys[e.key] = false;
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA 3-Point Contest</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
        }

        h1 {
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 2px 2px 0 #C9082A; /* NBA Red */
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 4px solid #1D428A; /* NBA Blue */
        }

        canvas {
            display: block;
            background: radial-gradient(#d6c098, #a88b5e); /* Hardwood floor */
        }

        #scoreboard {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 5px;
            font-size: 20px;
            pointer-events: none;
            border-left: 5px solid #C9082A;
        }

        #instructions {
            margin-top: 15px;
            color: #ccc;
            font-size: 14px;
            text-align: center;
        }

        kbd {
            background-color: #444;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            border: 1px solid #777;
        }
        
        #feedback {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            font-weight: 900;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            text-shadow: 3px 3px 0 #000;
        }
    </style>
</head>
<body>

    <h1>NBA 3-Point Contest</h1>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="scoreboard">
            <div>POINTS: <span id="scoreVal" style="color:#FFFF00">0</span></div>
            <div>SHOTS: <span id="shotsVal">0</span></div>
        </div>
        <div id="feedback">SWISH!</div>
    </div>

    <div id="instructions">
        Move: <kbd>←</kbd> <kbd>→</kbd> &nbsp;|&nbsp; Shoot: Hold <kbd>SPACE</kbd> to Power Up, Release to Fire
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreVal');
        const shotsEl = document.getElementById('shotsVal');
        const feedbackEl = document.getElementById('feedback');

        // Game Constants
        const GRAVITY = 0.55;
        const FRICTION = 0.8;
        const GROUND_Y = 450;
        
        // Game State
        let score = 0;
        let shots = 0;
        let balls = [];

        // The Hoop Dimensions
        const HOOP = {
            poleX: 720,
            rimY: 220,
            rimX: 680, // Front of rim
            backboardH: 90
        };

        // Player Object
        const player = {
            x: 100,
            y: GROUND_Y,
            w: 30,
            h: 90,
            color: '#1D428A', // NBA Blue
            dx: 5,
            charging: false,
            power: 0,
            maxPower: 26,
            powerDir: 1
        };

        // Ball Class
        class Ball {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.r = 12; // Radius
                this.active = true;
                this.scored = false;
            }

            update() {
                // Physics
                this.vy += GRAVITY;
                this.x += this.vx;
                this.y += this.vy;

                // Ground Collision
                if (this.y + this.r > GROUND_Y) {
                    this.y = GROUND_Y - this.r;
                    this.vy *= -0.65; // Bounce
                    this.vx *= FRICTION;
                    
                    // Stop ball if slow
                    if (Math.abs(this.vy) < 1) this.active = false;
                }

                // Backboard Collision
                if (this.x + this.r > HOOP.poleX && this.x - this.r < HOOP.poleX + 10 &&
                    this.y > HOOP.rimY - HOOP.backboardH && this.y < HOOP.rimY + 20) {
                    this.vx *= -0.7;
                    this.x = HOOP.poleX - this.r;
                }

                // Rim (Front Lip) Collision
                let distToRim = Math.hypot(this.x - HOOP.rimX, this.y - HOOP.rimY);
                if (distToRim < this.r + 3) {
                    this.vx *= -0.8;
                    this.vy *= -0.8;
                }

                // Scoring Logic (Crossing the rim plane downwards)
                if (!this.scored && this.vy > 0 && 
                    this.x > HOOP.rimX && this.x < HOOP.poleX && 
                    this.y > HOOP.rimY && this.y < HOOP.rimY + 20) {
                    
                    score += 3; // It's a 3-pointer!
                    this.scored = true;
                    updateUI();
                    showFeedback("SWISH!", "#00FF00");
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
                ctx.fillStyle = '#C9082A'; // Ball color
                ctx.fill();
                ctx.strokeStyle = '#000';
                ctx.stroke();
                
                // Ball lines detail
                ctx.beginPath();
                ctx.moveTo(this.x - this.r, this.y);
                ctx.lineTo(this.x + this.r, this.y);
                ctx.stroke();
            }
        }

        // Input Handling
        const keys = {};
        
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' && !player.charging) {
                player.charging = true;
                player.power = 10; // Min power
            }
        });

        document.addEventListener('keyup', e => {
            keys[e.code] = false;
            if (e.code === 'Space') {
                shoot();
                player.charging = false;
            }
        });

        function shoot() {
            shots++;
            updateUI();
            
            // Calculate Shot Vector
            let p = player.power;
            let vx = p * 0.55; 
            let vy = p * -0.95; 

            balls.push(new Ball(player.x + 20, player.y - 80, vx, vy));
        }

        function updateUI() {
            scoreEl.innerText = score;
            shotsEl.innerText = shots;
        }

        function showFeedback(text, color) {
            feedbackEl.innerText = text;
            feedbackEl.style.color = color;
            feedbackEl.style.opacity = 1;
            feedbackEl.style.transform = "translate(-50%, -60%) scale(1.2)";
            
            setTimeout(() => {
                feedbackEl.style.opacity = 0;
                feedbackEl.style.transform = "translate(-50%, -50%) scale(1)";
            }, 800);
        }

        function update() {
            // Player Move
            if (keys['ArrowLeft'] && player.x > 30) player.x -= player.dx;
            if (keys['ArrowRight'] && player.x < 400) player.x += player.dx;

            // Power Meter Logic
            if (player.charging) {
                player.power += 0.4 * player.powerDir;
                if (player.power >= player.maxPower || player.power <= 10) {
                    player.powerDir *= -1;
                }
            } else {
                player.powerDir = 1; // Reset
            }

            // Balls
            balls.forEach(b => b.update());
            balls = balls.filter(b => b.active || b.x < canvas.width);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Court Paint (Key)
            ctx.fillStyle = "rgba(29, 66, 138, 0.4)";
            ctx.fillRect(HOOP.poleX - 160, GROUND_Y - 140, 160, 140);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 3;
            ctx.strokeRect(HOOP.poleX - 160, GROUND_Y - 140, 160, 140);

            // 3-Point Line
            ctx.beginPath();
            ctx.arc(HOOP.poleX, 220, 480, Math.PI * 0.6, Math.PI * 1.3);
            ctx.stroke();

            // Draw Hoop
            // Pole
            ctx.fillStyle = "#555";
            ctx.fillRect(HOOP.poleX, HOOP.rimY - 100, 15, 330);
            // Backboard
            ctx.fillStyle = "#fff";
            ctx.fillRect(HOOP.poleX - 5, HOOP.rimY - HOOP.backboardH, 5, HOOP.backboardH);
            // Rim
            ctx.strokeStyle = "orange";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(HOOP.poleX - 5, HOOP.rimY);
            ctx.lineTo(HOOP.rimX, HOOP.rimY);
            ctx.stroke();
            // Net
            ctx.strokeStyle = "white";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(HOOP.rimX, HOOP.rimY);
            ctx.lineTo(HOOP.rimX + 10, HOOP.rimY + 25);
            ctx.lineTo(HOOP.poleX - 5, HOOP.rimY);
            ctx.stroke();

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - player.w/2, player.y - player.h, player.w, player.h);
            // Head
            ctx.fillStyle = "#ffcc99";
            ctx.beginPath();
            ctx.arc(player.x, player.y - player.h - 10, 12, 0, Math.PI*2);
            ctx.fill();

            // Power Bar (when charging)
            if (player.charging) {
                let barH = 60;
                let pct = (player.power - 10) / (player.maxPower - 10);
                ctx.fillStyle = "white";
                ctx.fillRect(player.x + 25, player.y - 80, 10, barH);
                ctx.fillStyle = pct > 0.8 ? "red" : "lime";
                ctx.fillRect(player.x + 26, player.y - 80 + (barH * (1-pct)), 8, barH * pct);
            }

            // Draw Balls
            balls.forEach(b => b.draw());
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();

    </script>
</body>
</html>

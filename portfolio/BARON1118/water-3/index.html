<!DOCTYPE html>
<html>
<head>
    <title>3D River Run: Streamline Evolution</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001a0d; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,1); pointer-events: none; z-index: 10;
        }
        #warning { color: #ff4444; display: none; font-weight: bold; font-size: 2em; animation: blink 0.5s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>
    <div id="ui">
        <div style="font-size: 1.8em; font-weight: 800;">距離: <span id="dist">0</span>m</div>
        <div style="font-size: 1.1em; color: #ffcc00;">最高紀錄: <span id="best">0</span>m</div>
        <div id="stageInfo" style="color: #00ffcc;">環境: 山間溪流</div>
        <div id="warning">⚠️ 掠食者接近中 ⚠️</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const SPEEDS = { UPSTREAM: 0.4, STREAM: 0.8, OCEAN: 1.5 };
        let scene, camera, renderer, player, shark, riverBed, banks;
        let obstacles = [];
        let distance = 0;
        let bestDistance = localStorage.getItem('fish_run_v4_best') || 0;
        let currentSpeed = SPEEDS.UPSTREAM;
        let gameActive = true;
        let keys = {};
        let clock = new THREE.Clock();

        document.getElementById('best').innerText = bestDistance;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a2a24, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 15);
            camera.lookAt(0, 1, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
            scene.add(hemiLight);
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(5, 15, 10);
            scene.add(sun);

            // --- 移除黑線，整合地形 ---
            const terrainGroup = new THREE.Group();
            
            // 中央河床
            const floorGeo = new THREE.PlaneGeometry(40, 2000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x142b26 });
            riverBed = new THREE.Mesh(floorGeo, floorMat);
            riverBed.rotation.x = -Math.PI / 2;
            riverBed.position.y = -4.5;
            terrainGroup.add(riverBed);

            // 兩側岸邊 (使用與河床相近的顏色，並稍微抬高以移除縫隙黑影)
            const bankGeo = new THREE.PlaneGeometry(120, 2000);
            const bankMat = new THREE.MeshStandardMaterial({ color: 0x0d211a });
            const leftBank = new THREE.Mesh(bankGeo, bankMat);
            leftBank.rotation.x = -Math.PI / 2;
            leftBank.position.set(-80, -4.48, 0); 
            terrainGroup.add(leftBank);

            const rightBank = leftBank.clone();
            rightBank.position.x = 80;
            terrainGroup.add(rightBank);
            
            banks = [leftBank, rightBank];
            scene.add(terrainGroup);

            createSlimGoldfish();
            createDetailedShark();

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        function createSlimGoldfish() {
            player = new THREE.Group();
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0xff6600, shininess: 90 });
            const finMat = new THREE.MeshPhongMaterial({ color: 0xff9933, transparent: true, opacity: 0.8, side: THREE.DoubleSide });

            // 1. 拉長的魚身
            const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), bodyMat);
            body.scale.set(0.5, 0.7, 2.2); // 更長、更流線
            player.add(body);

            // 2. 純黑精緻眼珠
            const eyeGeo = new THREE.SphereGeometry(0.18, 16, 16);
            const blackMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            [[-0.35, 0.2, -1.6], [0.35, 0.2, -1.6]].forEach(pos => {
                const eye = new THREE.Mesh(eyeGeo, blackMat);
                eye.position.set(...pos);
                player.add(eye);
            });

            // 3. 三角形胸鰭 (側翼)
            const sideFinShape = new THREE.Shape();
            sideFinShape.moveTo(0,0);
            sideFinShape.lineTo(1, -0.5);
            sideFinShape.lineTo(0.8, 0.5);
            sideFinShape.lineTo(0,0);
            const sideFinGeo = new THREE.ShapeGeometry(sideFinShape);
            
            const leftFin = new THREE.Mesh(sideFinGeo, finMat);
            leftFin.position.set(0.3, -0.2, -0.5);
            leftFin.rotation.set(Math.PI/2, 0, -0.5);
            leftFin.scale.set(0.8, 0.8, 0.8);
            player.add(leftFin);

            const rightFin = leftFin.clone();
            rightFin.position.x = -0.3;
            rightFin.rotation.z = 0.5 + Math.PI;
            player.add(rightFin);

            // 4. 三角形大尾鰭
            player.tailGroup = new THREE.Group();
            const tailShape = new THREE.Shape();
            tailShape.moveTo(0,0);
            tailShape.lineTo(1.5, 1.2);
            tailShape.lineTo(1.5, -1.2);
            tailShape.lineTo(0,0);
            const tailGeo = new THREE.ShapeGeometry(tailShape);
            
            const tailFin = new THREE.Mesh(tailGeo, finMat);
            tailFin.rotation.y = Math.PI / 2;
            tailFin.position.z = 0;
            player.tailGroup.add(tailFin);
            player.tailGroup.position.z = 2.0;
            player.add(player.tailGroup);

            scene.add(player);
        }

        function createDetailedShark() {
            shark = new THREE.Group();
            const sMat = new THREE.MeshStandardMaterial({ color: 0x334455 });
            const sBody = new THREE.Mesh(new THREE.SphereGeometry(2, 32, 16), sMat);
            sBody.scale.set(0.8, 1, 4.5);
            shark.add(sBody);

            // 三角形背鰭
            const sFin = new THREE.Mesh(new THREE.ConeGeometry(0.6, 2, 3), sMat);
            sFin.position.y = 1.6;
            sFin.rotation.x = 0.4;
            shark.add(sFin);

            shark.position.set(0, 0, 70);
            scene.add(shark);
        }

        function spawnRock() {
            const size = Math.random() * 2 + 0.8;
            const geo = new THREE.IcosahedronGeometry(size, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d });
            const rock = new THREE.Mesh(geo, mat);
            rock.position.set((Math.random() - 0.5) * 32, -3.5, -120);
            
            // 縮小石頭的實際判定範圍，讓邊緣更寬容
            rock.hitRadius = size * 0.75; 
            scene.add(rock);
            obstacles.push(rock);
        }

        function update() {
            if (!gameActive) return;
            const time = clock.getElapsedTime();

            // 控制
            if (keys['ArrowLeft'] && player.position.x > -15) {
                player.position.x -= 0.35;
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0.5, 0.1);
            } else if (keys['ArrowRight'] && player.position.x < 15) {
                player.position.x += 0.35;
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -0.5, 0.1);
            } else {
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 0.1);
            }

            // 動畫
            player.tailGroup.rotation.y = Math.sin(time * 12) * 0.4;
            player.position.y = Math.sin(time * 2.5) * 0.15;

            distance += currentSpeed * 0.5;
            document.getElementById('dist').innerText = Math.floor(distance);

            // 階段與環境變化
            if (distance < 300) {
                currentSpeed = SPEEDS.UPSTREAM;
            } else if (distance < 800) {
                currentSpeed = SPEEDS.STREAM;
                document.getElementById('stageInfo').innerText = "環境: 下游出口";
                scene.fog.color.set(0x003344);
                scene.background = new THREE.Color(0x003344);
            } else {
                currentSpeed = SPEEDS.OCEAN;
                document.getElementById('stageInfo').innerText = "環境: 開闊海洋";
                document.getElementById('warning').style.display = 'block';
                
                // 海洋階段移除岸邊
                banks.forEach(b => b.position.y = THREE.MathUtils.lerp(b.position.y, -20, 0.01));
                scene.fog.color.set(0x000d1a);
                scene.background = new THREE.Color(0x000d1a);

                // 鯊魚邏輯
                shark.position.z = THREE.MathUtils.lerp(shark.position.z, 6, 0.004);
                shark.position.x = THREE.MathUtils.lerp(shark.position.x, player.position.x, 0.015);
                
                if (shark.position.distanceTo(player.position) < 3.5) {
                    gameOver("被掠食者抓住了...");
                }
            }

            // --- 優化後的 Hitbox 判定 ---
            if (Math.random() < 0.1) spawnRock();
            obstacles.forEach((rock, i) => {
                rock.position.z += currentSpeed * 2.5;

                const dx = player.position.x - rock.position.x;
                const dz = player.position.z - rock.position.z;
                const distanceXZ = Math.sqrt(dx * dx + dz * dz);
                
                // 金魚拉長了，但寬度沒變，所以 Hitbox 半徑縮小到 0.45 左右更精準
                const fishHitRadius = 0.45; 
                if (distanceXZ < (rock.hitRadius + fishHitRadius)) {
                    gameOver("撞到岩石了！");
                }

                if (rock.position.z > 20) {
                    scene.remove(rock);
                    obstacles.splice(i, 1);
                }
            });
        }

        function gameOver(msg) {
            gameActive = false;
            const finalDist = Math.floor(distance);
            if (finalDist > bestDistance) {
                localStorage.setItem('fish_run_v4_best', finalDist);
                alert(msg + "\n新紀錄: " + finalDist + "m");
            } else {
                alert(msg + "\n距離: " + finalDist + "m");
            }
            location.reload();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>

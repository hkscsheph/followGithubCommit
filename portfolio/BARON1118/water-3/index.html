<!DOCTYPE html>
<html>
<head>
    <title>3D River Run: Predator Peak</title>
    <style>
        body { margin: 0; overflow: hidden; background: #001e0f; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none;
            z-index: 10;
        }
        .speed-indicator { color: #00ffcc; font-weight: bold; font-size: 1.2em; }
        #sharkWarning { color: #ff4444; display: none; font-weight: bold; font-size: 2em; animation: blink 0.5s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>
    <div id="ui">
        <div style="font-size: 1.5em;">DISTANCE: <span id="dist">0</span>m</div>
        <div>BEST: <span id="best">0</span>m</div>
        <div id="stageInfo" class="speed-indicator">STAGE: RIVER (Calm)</div>
        <div id="sharkWarning">⚠️ PREDATOR DETECTED ⚠️</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const SPEEDS = { RIVER: 0.6, RAPIDS: 1.1, OCEAN: 1.8 };
        let scene, camera, renderer, player, shark, waterPlane;
        let obstacles = [];
        let distance = 0;
        let currentSpeed = SPEEDS.RIVER;
        let gameActive = true;
        let keys = {};
        let clock = new THREE.Clock();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x001e0f);
            scene.fog = new THREE.FogExp2(0x001e0f, 0.03); // Deep water feel

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting for "realistic" shimmer
            const sun = new THREE.DirectionalLight(0xffffff, 2);
            sun.position.set(5, 10, 7);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0x407080, 0.5));

            // Ground/Riverbed
            const floorGeo = new THREE.PlaneGeometry(100, 1000);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            scene.add(floor);

            createPlayer();
            createShark();

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Body - Slender for fish
            const bodyGeo = new THREE.SphereGeometry(0.5, 32, 16);
            bodyGeo.scale(0.6, 1, 1.8);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: 0xffa500, metalness: 0.6, roughness: 0.2 
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            player.add(body);

            // Tail Fin
            const tailGeo = new THREE.ConeGeometry(0.4, 0.8, 3);
            const tail = new THREE.Mesh(tailGeo, bodyMat);
            tail.position.z = 1.2;
            tail.rotation.x = Math.PI / 2;
            player.tail = tail;
            player.add(tail);

            player.position.y = 0;
            scene.add(player);
        }

        function createShark() {
            shark = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x44494d, roughness: 0.3 });
            
            // Torpedo Body
            const bodyGeo = new THREE.SphereGeometry(1, 32, 16);
            bodyGeo.scale(0.8, 1, 3.5);
            shark.add(new THREE.Mesh(bodyGeo, mat));

            // Dorsal Fin
            const finGeo = new THREE.ConeGeometry(0.3, 1.2, 3);
            const fin = new THREE.Mesh(finGeo, mat);
            fin.position.y = 1;
            fin.rotation.z = Math.PI;
            shark.add(fin);

            shark.position.set(0, 0, 30); // Way behind
            scene.add(shark);
        }

        function update() {
            if (!gameActive) return;
            const time = clock.getElapsedTime();

            // 1. Input with tilt realism
            if (keys['ArrowLeft'] && player.position.x > -8) {
                player.position.x -= 0.2;
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0.4, 0.1);
            } else if (keys['ArrowRight'] && player.position.x < 8) {
                player.position.x += 0.2;
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, -0.4, 0.1);
            } else {
                player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, 0, 0.1);
            }

            // 2. Realistic Swimming Animation (Sinuosity)
            player.rotation.y = Math.sin(time * 10) * 0.15;
            player.tail.rotation.z = Math.sin(time * 10) * 0.8;

            // 3. Game Progression
            distance += currentSpeed * 0.2;
            document.getElementById('dist').innerText = Math.floor(distance);

            if (distance < 150) {
                currentSpeed = SPEEDS.RIVER;
                scene.background.set(0x001e0f);
            } else if (distance < 300) {
                currentSpeed = SPEEDS.RAPIDS;
                document.getElementById('stageInfo').innerText = "STAGE: RAPIDS (Fast)";
                scene.background.set(0x002b36);
            } else {
                // THE SEA PHASE
                currentSpeed = SPEEDS.OCEAN;
                document.getElementById('stageInfo').innerText = "STAGE: THE SEA (Extreme)";
                document.getElementById('sharkWarning').style.display = 'block';
                scene.background.set(0x000d1a);

                // Shark AI
                shark.position.z = THREE.MathUtils.lerp(shark.position.z, 4, 0.01);
                shark.position.x = THREE.MathUtils.lerp(shark.position.x, player.position.x, 0.03);
                shark.rotation.y = Math.sin(time * 8) * 0.1;
                
                if (shark.position.distanceTo(player.position) < 2) gameOver();
            }

            // 4. Obstacle Logic (Rocks)
            if (Math.random() < 0.1) spawnRock();
            obstacles.forEach((rock, i) => {
                rock.position.z += currentSpeed;
                if (rock.position.distanceTo(player.position) < 1.2) gameOver();
                if (rock.position.z > 20) {
                    scene.remove(rock);
                    obstacles.splice(i, 1);
                }
            });
        }

        function spawnRock() {
            const geo = new THREE.IcosahedronGeometry(Math.random() * 1 + 0.5, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const rock = new THREE.Mesh(geo, mat);
            rock.position.set((Math.random() - 0.5) * 20, -0.5, -60);
            scene.add(rock);
            obstacles.push(rock);
        }

        function gameOver() {
            gameActive = false;
            alert("The journey ends here. Distance: " + Math.floor(distance) + "m");
            location.reload();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>

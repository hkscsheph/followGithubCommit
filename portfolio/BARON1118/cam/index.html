<!DOCTYPE html>
<html>
<head>
    <title>Gesture Cube Control</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #video-container { position: absolute; bottom: 20px; right: 20px; width: 240px; border: 2px solid #555; border-radius: 8px; overflow: hidden; }
        #webcam { transform: scaleX(-1); width: 100%; display: block; }
        #status { position: absolute; top: 20px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

    <div id="status">Loading AI Models...</div>
    <div id="video-container">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const videoElement = document.getElementById('webcam');
        const statusText = document.getElementById('status');
        
        // --- THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ffcc, wireframe: false });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 5, 5).normalize();
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        camera.position.z = 5;

        // --- MEDIAPIPE HANDS SETUP ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "Hand Detected: Move to Rotate";
                const hand = results.multiHandLandmarks[0];
                
                // Use the Index Finger Tip (Landmark 8) for rotation
                // Coordinates are normalized 0 to 1
                const x = hand[8].x - 0.5; 
                const y = hand[8].y - 0.5;

                // Map coordinates to cube rotation
                cube.rotation.y = x * 10;
                cube.rotation.x = y * 10;
                
                // Visual feedback: Scale cube based on pinch (index and thumb distance)
                const thumb = hand[4];
                const index = hand[8];
                const distance = Math.sqrt(
                    Math.pow(thumb.x - index.x, 2) + 
                    Math.pow(thumb.y - index.y, 2)
                );
                
                const scale = Math.max(0.5, distance * 5);
                cube.scale.set(scale, scale, scale);
            } else {
                statusText.innerText = "Show your hand to the camera";
            }
        });

        // --- CAMERA INIT ---
        const cameraPipe = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        cameraPipe.start();

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

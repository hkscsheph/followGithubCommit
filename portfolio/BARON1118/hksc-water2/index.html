<!DOCTYPE html>
<html>
<head>
    <title>3D River Run: Predator Peak</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); pointer-events: none;
        }
        .speed-indicator { color: #00ffcc; font-weight: bold; }
        .warning { color: #ff4444; display: none; font-weight: bold; animation: blink 0.5s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>
    <div id="ui">
        <div>DISTANCE: <span id="dist">0</span>m</div>
        <div>BEST: <span id="best">0</span>m</div>
        <div id="stageInfo" class="speed-indicator">STAGE: 1 (Calm)</div>
        <div id="sharkWarning" class="warning">SHARK SIGHTED! SWIM!</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIGURATION SPACE ---
        const SPEEDS = {
            STAGE_1: 0.5, // Current speed for 0-150m
            STAGE_2: 0.8, // Current speed for 150-250m
            STAGE_3: 1.2  // Current speed for 250-350m+
        };
        // ---------------------------

        let scene, camera, renderer, player, shark;
        let obstacles = [];
        let distance = 0;
        let currentSpeed = SPEEDS.STAGE_1;
        let gameActive = true;
        let keys = {};

        // Load Save Data
        let highscore = localStorage.getItem('riverRunHighscore') || 0;
        document.getElementById('best').innerText = highscore;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1d4e89);
            scene.fog = new THREE.Fog(0x1d4e89, 10, 50);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 12, 10);
            camera.lookAt(0, 0, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(0, 10, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Player (Orange Fish)
            const playerGeo = new THREE.CapsuleGeometry(0.4, 1, 4, 8);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0xff8c42 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.rotation.x = Math.PI / 2;
            player.position.y = 0.5;
            scene.add(player);

            // Shark (Hidden initially)
            const sharkGeo = new THREE.ConeGeometry(0.8, 3, 8);
            const sharkMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
            shark = new THREE.Mesh(sharkGeo, sharkMat);
            shark.rotation.x = -Math.PI / 2;
            shark.position.set(0, 0.5, 15); // Start behind the camera
            scene.add(shark);

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);
        }

        function spawnObstacle() {
            if (Math.random() < 0.08) {
                const geo = new THREE.DodecahedronGeometry(Math.random() * 0.8 + 0.4);
                const mat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a });
                const rock = new THREE.Mesh(geo, mat);
                rock.position.set((Math.random() - 0.5) * 15, 0.2, -40);
                scene.add(rock);
                obstacles.push(rock);
            }
        }

        function update() {
            if (!gameActive) return;

            // 1. Movement
            if (keys['ArrowLeft'] && player.position.x > -7) player.position.x -= 0.15;
            if (keys['ArrowRight'] && player.position.x < 7) player.position.x += 0.15;

            // 2. Stage Logic & Speed
            distance += 0.1;
            const distLabel = Math.floor(distance);
            document.getElementById('dist').innerText = distLabel;

            if (distLabel < 150) {
                currentSpeed = SPEEDS.STAGE_1;
                document.getElementById('stageInfo').innerText = "STAGE: 1 (Calm)";
            } else if (distLabel < 250) {
                currentSpeed = SPEEDS.STAGE_2;
                document.getElementById('stageInfo').innerText = "STAGE: 2 (Rapid)";
            } else {
                currentSpeed = SPEEDS.STAGE_3;
                document.getElementById('stageInfo').innerText = "STAGE: 3 (Danger)";
            }

            // 3. Shark AI (Stage 2 to 3 transition)
            if (distLabel >= 250 && distLabel <= 350) {
                shark.position.z = THREE.MathUtils.lerp(shark.position.z, 5, 0.01);
                shark.position.x = THREE.MathUtils.lerp(shark.position.x, player.position.x, 0.02);
                document.getElementById('sharkWarning').style.display = 'block';
                
                // Collision with shark
                if (shark.position.distanceTo(player.position) < 1.5) gameOver();
            } else if (distLabel > 350) {
                shark.position.z += 0.2; // Shark retreats
                document.getElementById('sharkWarning').style.display = 'none';
            }

            // 4. Obstacles Logic
            spawnObstacle();
            obstacles.forEach((rock, i) => {
                rock.position.z += currentSpeed;
                
                // Collision check
                const box = new THREE.Box3().setFromObject(rock);
                const playerBox = new THREE.Box3().setFromObject(player);
                if (box.intersectsBox(playerBox)) gameOver();

                if (rock.position.z > 10) {
                    scene.remove(rock);
                    obstacles.splice(i, 1);
                }
            });
        }

        function gameOver() {
            gameActive = false;
            if (distance > highscore) {
                localStorage.setItem('riverRunHighscore', Math.floor(distance));
            }
            alert(`Wipeout! Distance: ${Math.floor(distance)}m`);
            location.reload();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>

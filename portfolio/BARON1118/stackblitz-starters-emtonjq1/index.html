<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學園日常 - 異常記錄 (自由填寫版)</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --calendar-bg: #16213e;
            --accent: #e94560;
            --text-main: #e0e0e0;
            --text-muted: #8d99ae;
            --border: #0f3460;
            --modal-bg: #1a1a2e;
        }

        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif; 
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        main {
            width: 90%;
            max-width: 900px;
            background: var(--calendar-bg);
            border: 2px solid var(--border);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 8px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--accent);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .controls button {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-main);
            padding: 5px 15px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            border-radius: 4px;
        }

        .controls button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .day-name {
            text-align: center;
            color: var(--text-muted);
            font-weight: bold;
            padding: 10px 0;
        }

        .day {
            min-height: 120px;
            background: rgba(255,255,255,0.05);
            border: 1px solid transparent;
            padding: 5px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .day:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.1);
        }

        .day.current-day {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid var(--accent);
        }

        .day-number {
            font-weight: bold;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }

        .event-indicator {
            font-size: 0.75rem;
            margin-top: 2px;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .has-image-icon {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--modal-bg);
            border: 2px solid var(--accent);
            padding: 20px;
            width: 450px;
            max-width: 95%;
            border-radius: 5px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 { margin-top: 0; color: var(--text-main); }
        
        .form-group { margin-bottom: 15px; }
        
        label { display: block; margin-bottom: 5px; color: var(--text-muted); }
        
        /* 統一輸入框樣式 */
        input[type="text"], textarea {
            width: 100%;
            background: #0f3460;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px;
            font-family: inherit;
            box-sizing: border-box;
            border-radius: 4px;
        }
        
        input[type="text"]::placeholder, textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        input[type="file"] {
            border: none;
            padding: 5px 0;
            background: transparent;
            color: var(--text-muted);
        }

        .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        .btn-save { background: var(--accent); border: none; padding: 8px 20px; color: white; cursor: pointer; border-radius: 4px; }
        .btn-close { background: transparent; border: 1px solid var(--text-muted); padding: 8px 20px; color: var(--text-muted); cursor: pointer; border-radius: 4px; }
        .btn-close:hover { border-color: var(--text-main); color: var(--text-main); }

        #eventList {
            margin-top: 15px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .log-entry {
            font-size: 0.9rem;
            border-bottom: 1px solid #333;
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .log-header { display: flex; justify-content: space-between; color: var(--accent); font-weight: bold; }
        .log-img {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            border: 1px solid #555;
            margin-top: 5px;
            display: block;
            border-radius: 4px;
        }

    </style>
</head>
<body>

<main>
    <header>
        <div>
            <h1>書院日常</h1>
            <span id="currentDateDisplay" style="color: var(--text-muted)"></span>
        </div>
        <div class="controls">
            <button id="prevBtn">◀ 上個月</button>
            <button id="nextBtn">下個月 ▶</button>
        </div>
    </header>

    <div class="calendar-grid" id="calendar">
        </div>
</main>

<div id="eventModal" class="modal">
    <div class="modal-content">
        <h2 id="modalDateTitle">記錄異常</h2>
        
        <div id="eventList">
            </div>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">

        <div class="form-group">
            <label for="locationInput">發現地點 (Location)</label>
            <input type="text" id="locationInput" placeholder="例如：五樓廁所門外...">
        </div>

        <div class="form-group">
            <label for="eventDesc">觀察記錄 (Observation)</label>
            <textarea id="eventDesc" rows="3" placeholder="在此描述異常現象..."></textarea>
        </div>

        <div class="form-group">
            <label for="evidenceImg">上傳證據圖片 (Photo Evidence)</label>
            <input type="file" id="evidenceImg" accept="image/*">
        </div>

        <div class="btn-group">
            <button class="btn-close" id="closeModal">取消</button>
            <button class="btn-save" id="saveEvent">儲存記錄</button>
        </div>
    </div>
</div>

<script>
    // 1. 狀態管理
    let nav = 0; 
    let clickedDate = null; 
    // 使用新的 Key 'academyEvents_v3'，確保資料結構更新不衝突
    let events = localStorage.getItem('academyEvents_v3') ? JSON.parse(localStorage.getItem('academyEvents_v3')) : {};

    // 2. DOM 元素
    const calendar = document.getElementById('calendar');
    const dateDisplay = document.getElementById('currentDateDisplay');
    const modal = document.getElementById('eventModal');
    const modalTitle = document.getElementById('modalDateTitle');
    const eventList = document.getElementById('eventList');
    
    // 輸入框元素
    const eventDesc = document.getElementById('eventDesc');
    const locationInput = document.getElementById('locationInput'); // 變更為 Input
    const evidenceImg = document.getElementById('evidenceImg');

    // 3. 日曆核心邏輯
    function loadCalendar() {
        const dt = new Date();

        if (nav !== 0) {
            dt.setMonth(new Date().getMonth() + nav);
        }

        const day = dt.getDate();
        const month = dt.getMonth();
        const year = dt.getFullYear();

        const firstDayOfMonth = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const paddingDays = firstDayOfMonth.getDay();

        dateDisplay.innerText = `${year}年 ${month + 1}月`;
        calendar.innerHTML = '';

        const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
        weekdays.forEach(wd => {
            const div = document.createElement('div');
            div.classList.add('day-name');
            div.innerText = wd;
            calendar.appendChild(div);
        });

        for(let i = 1; i <= paddingDays + daysInMonth; i++) {
            const daySquare = document.createElement('div');
            daySquare.classList.add('day');

            if (i > paddingDays) {
                const dayNum = i - paddingDays;
                const fullDate = `${year}-${month + 1}-${dayNum}`;
                
                daySquare.innerHTML = `<span class="day-number">${dayNum}</span>`;

                if (dayNum === day && nav === 0) {
                    daySquare.classList.add('current-day');
                }

                if (events[fullDate]) {
                    events[fullDate].forEach(evt => {
                        const eventDiv = document.createElement('div');
                        eventDiv.classList.add('event-indicator');
                        const imgIcon = evt.image ? '<span class="has-image-icon"></span>' : '';
                        eventDiv.innerHTML = `${imgIcon}[${evt.loc}] ${evt.desc}`;
                        daySquare.appendChild(eventDiv);
                    });
                }

                daySquare.addEventListener('click', () => openModal(fullDate));
            } else {
                daySquare.style.cursor = 'default';
                daySquare.style.visibility = 'hidden';
            }

            calendar.appendChild(daySquare);
        }
    }

    // 4. 彈窗與事件處理
    function openModal(date) {
        clickedDate = date;
        modalTitle.innerText = `記錄日期: ${date}`;
        modal.style.display = 'flex';
        
        // 清空所有輸入欄位
        eventDesc.value = '';
        locationInput.value = ''; // 清空地點輸入框
        evidenceImg.value = ''; 
        renderEventList();
    }

    function renderEventList() {
        eventList.innerHTML = '';
        if (events[clickedDate]) {
            events[clickedDate].forEach(evt => {
                const div = document.createElement('div');
                div.classList.add('log-entry');
                
                let imgHtml = '';
                if(evt.image) {
                    imgHtml = `<img src="${evt.image}" class="log-img" alt="證據圖片">`;
                }

                div.innerHTML = `
                    <div class="log-header"><span>${evt.loc}</span></div>
                    <div>${evt.desc}</div>
                    ${imgHtml}
                `;
                eventList.appendChild(div);
            });
        } else {
            eventList.innerHTML = '<p style="color:var(--text-muted); font-size:0.8rem;">尚無異常記錄</p>';
        }
    }

    function saveEvent() {
        const desc = eventDesc.value;
        const loc = locationInput.value; // 讀取手動輸入的地點
        const file = evidenceImg.files[0];

        // 簡單驗證：至少要輸入描述或有圖片，且建議輸入地點
        if (!desc && !file) {
            alert("請輸入觀察記錄或上傳圖片。");
            return;
        }

        const finalLoc = loc.trim() === "" ? "未知地點" : loc; // 如果沒寫地點，預設為未知

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                saveToStorage(finalLoc, desc, base64Img);
            };
            reader.readAsDataURL(file);
        } else {
            saveToStorage(finalLoc, desc, null);
        }
    }

    function saveToStorage(loc, desc, imgData) {
        if (!events[clickedDate]) {
            events[clickedDate] = [];
        }
        
        events[clickedDate].push({
            loc: loc,
            desc: desc,
            image: imgData
        });

        try {
            localStorage.setItem('academyEvents_v3', JSON.stringify(events));
            renderEventList();
            
            // 清空輸入框以便連續輸入
            eventDesc.value = '';
            locationInput.value = '';
            evidenceImg.value = '';
            
            loadCalendar();
        } catch (e) {
            alert("儲存失敗：圖片可能過大。");
            console.error(e);
        }
    }

    function closeModalFunc() {
        modal.style.display = 'none';
        clickedDate = null;
        loadCalendar();
    }

    // 5. 事件監聽器
    document.getElementById('nextBtn').addEventListener('click', () => { nav++; loadCalendar(); });
    document.getElementById('prevBtn').addEventListener('click', () => { nav--; loadCalendar(); });
    document.getElementById('saveEvent').addEventListener('click', saveEvent);
    document.getElementById('closeModal').addEventListener('click', closeModalFunc);
    
    loadCalendar();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alien Webcam Runner</title>
    <style>
      body {
        margin: 0;
        background: #0d0d2b;
        color: white;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }

      #game-container {
        position: relative;
        margin-top: 20px;
        border: 4px solid #4ecca3;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(78, 204, 163, 0.5);
      }

      canvas {
        display: block;
        background: linear-gradient(to bottom, #000000, #1a1a2e);
      }

      #ui {
        position: absolute;
        top: 10px;
        left: 10px;
        pointer-events: none;
      }

      .hidden-video {
        position: fixed;
        bottom: 10px;
        right: 10px;
        width: 160px;
        height: 120px;
        border: 2px solid white;
        transform: scaleX(-1); /* Mirror view */
        border-radius: 5px;
      }

      #controls {
        margin-top: 15px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        background: #4ecca3;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        font-weight: bold;
      }

      button:hover {
        background: #45b791;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <h1>Alien Space Escape</h1>
    <p>Move your head left/right to control the alien!</p>

    <div id="game-container">
      <canvas id="gameCanvas" width="600" height="400"></canvas>
      <div id="ui">
        <div>Score: <span id="score">0</span></div>
      </div>
    </div>

    <video id="webcam" class="hidden-video" autoplay playsinline></video>

    <div id="controls">
      <button id="startBtn">Start Game & Camera</button>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const video = document.getElementById('webcam');
      const startBtn = document.getElementById('startBtn');
      const scoreElement = document.getElementById('score');

      // Game State
      let score = 0;
      let gameActive = false;
      let alienX = 300;
      let obstacles = [];
      let animationId;

      // Alien Settings (Simple circle for now, you can replace with an image)
      const alien = { width: 40, height: 40, color: '#00ff00' };

      async function initCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          video.srcObject = stream;
        } catch (err) {
          alert('Camera access denied or not found.');
        }
      }

      function spawnObstacle() {
        if (Math.random() < 0.03) {
          obstacles.push({
            x: Math.random() * (canvas.width - 30),
            y: -30,
            size: 20 + Math.random() * 30,
            speed: 3 + Math.random() * 4,
          });
        }
      }

      function updateTracking() {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          // We create a temporary canvas to analyze the video frame
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = 40; // Low res for performance
          tempCanvas.height = 30;
          const tCtx = tempCanvas.getContext('2d');
          tCtx.drawImage(video, 0, 0, 40, 30);

          const pixels = tCtx.getImageData(0, 0, 40, 30).data;
          let maxBrightness = 0;
          let brightX = 20;

          // Simple algorithm: find the brightest horizontal spot (usually skin or movement)
          for (let i = 0; i < pixels.length; i += 4) {
            let brightness = pixels[i] + pixels[i + 1] + pixels[i + 2];
            if (brightness > maxBrightness) {
              maxBrightness = brightness;
              brightX = (i / 4) % 40;
            }
          }

          // Interpolate motion: (40 is temp canvas width, mirrored)
          let targetX = (1 - brightX / 40) * canvas.width;
          alienX += (targetX - alienX) * 0.15; // Smooth following
        }
      }

      function gameLoop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        updateTracking();

        // Draw Alien
        ctx.fillStyle = alien.color;
        ctx.beginPath();
        ctx.arc(alienX, canvas.height - 50, 20, 0, Math.PI * 2);
        ctx.fill();
        // Alien Antenna
        ctx.strokeStyle = '#fff';
        ctx.moveTo(alienX, canvas.height - 70);
        ctx.lineTo(alienX, canvas.height - 50);
        ctx.stroke();

        // Update & Draw Obstacles
        spawnObstacle();
        for (let i = obstacles.length - 1; i >= 0; i--) {
          let o = obstacles[i];
          o.y += o.speed;

          ctx.fillStyle = '#ff4d4d';
          ctx.fillRect(o.x, o.y, o.size, o.size);

          // Collision Detection
          if (
            o.y + o.size > canvas.height - 70 &&
            o.x < alienX + 20 &&
            o.x + o.size > alienX - 20
          ) {
            gameOver();
          }

          if (o.y > canvas.height) {
            obstacles.splice(i, 1);
            score++;
            scoreElement.innerText = score;
          }
        }

        animationId = requestAnimationFrame(gameLoop);
      }

      function gameOver() {
        gameActive = false;
        alert('Game Over! Score: ' + score);
        score = 0;
        scoreElement.innerText = 0;
        obstacles = [];
        startBtn.style.display = 'block';
      }

      startBtn.addEventListener('click', () => {
        initCamera();
        gameActive = true;
        startBtn.style.display = 'none';
        gameLoop();
      });
    </script>
  </body>
</html>

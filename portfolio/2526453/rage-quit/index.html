<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heli-Evasion: Sector 4</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #020406;
        font-family: 'Consolas', monospace;
      }
      #ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #00ff41;
        pointer-events: none;
        text-transform: uppercase;
      }
      #hud-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ff0044;
        font-weight: bold;
        text-align: center;
        pointer-events: none;
        display: none;
        font-size: 1.5rem;
        text-shadow: 0 0 10px #ff0044;
      }
      .status-bar {
        width: 200px;
        height: 10px;
        border: 1px solid #00ff41;
        margin-top: 5px;
      }
      #health-fill {
        width: 100%;
        height: 100%;
        background: #00ff41;
        transition: 0.2s;
      }
      canvas {
        display: block;
        cursor: none;
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="ui">
      <div>[ PILOT: SPECTER-1 ]</div>
      <div>ARMOR STATUS:</div>
      <div class="status-bar"><div id="health-fill"></div></div>
      <div id="threat-level" style="margin-top: 10px">THREAT: LOW</div>
    </div>

    <div id="hud-center">MISSILE LOCK</div>

    <canvas id="mapCanvas"></canvas>

    <script>
      const canvas = document.getElementById('mapCanvas');
      const ctx = canvas.getContext('2d');

      let width,
        height,
        health = 100;
      let keys = {};
      let mouse = { x: 0, y: 0, down: false };
      let cam = {
        x: 0,
        y: 0,
        zoom: 1,
        currentZoom: 1,
        rot: 0,
        tilt: 0,
        bob: 0,
      };
      let buildings = [],
        npcs = [],
        missiles = [],
        debris = [];

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      class Missile {
        constructor() {
          // Spawns off-screen and moves toward the helicopter (center)
          const angle = Math.random() * Math.PI * 2;
          const dist = 1000;
          this.x = -cam.x + Math.cos(angle) * dist;
          this.y = -cam.y + Math.sin(angle) * dist;
          this.speed = 4;
          this.alive = true;
        }
        update() {
          const targetX = -cam.x;
          const targetY = -cam.y;
          const dx = targetX - this.x;
          const dy = targetY - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          this.x += (dx / dist) * this.speed;
          this.y += (dy / dist) * this.speed;

          if (dist < 20) {
            health -= 25;
            this.alive = false;
            createExplosion(this.x, this.y, '#ff0000');
          }
        }
        draw() {
          ctx.fillStyle = '#ff0044';
          ctx.beginPath();
          ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
          ctx.fill();
          // Smoke trail
          ctx.strokeStyle = 'rgba(255, 0, 68, 0.3)';
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          ctx.lineTo(
            this.x - (-cam.x - this.x) * 0.1,
            this.y - (-cam.y - this.y) * 0.1
          );
          ctx.stroke();
        }
      }

      class Building {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.w = 100;
          this.h = 100;
          this.destroyed = false;
        }
        draw() {
          ctx.strokeStyle = this.destroyed ? '#222' : '#00ff41';
          ctx.strokeRect(this.x, this.y, this.w, this.h);
          if (!this.destroyed) {
            ctx.fillStyle = 'rgba(0, 255, 65, 0.05)';
            ctx.fillRect(this.x, this.y, this.w, this.h);
          }
        }
      }

      function createExplosion(x, y, color = '#00ff41') {
        for (let i = 0; i < 15; i++) {
          debris.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            life: 1.0,
            color,
          });
        }
      }

      function init() {
        resize();
        for (let i = 0; i < 15; i++)
          buildings.push(
            new Building(
              (Math.random() - 0.5) * 2000,
              (Math.random() - 0.5) * 2000
            )
          );
      }

      function update() {
        if (health <= 0) {
          alert('HELI DOWN - MISSION FAILED');
          health = 100;
          return;
        }

        // WASD Movement
        const spd = 10 / cam.currentZoom;
        if (keys['w']) cam.y += spd;
        if (keys['s']) cam.y -= spd;
        if (keys['a']) cam.x += spd;
        if (keys['d']) cam.x -= spd;

        cam.zoom = mouse.down ? 2 : 1;
        cam.currentZoom += (cam.zoom - cam.currentZoom) * 0.1;
        cam.bob = Math.sin(Date.now() * 0.002) * 5;

        // Missile Spawning
        if (Math.random() < 0.01) missiles.push(new Missile());

        missiles.forEach((m, i) => {
          m.update();
          if (!m.alive) missiles.splice(i, 1);
        });

        debris.forEach((d, i) => {
          d.x += d.vx;
          d.y += d.vy;
          d.life -= 0.02;
          if (d.life <= 0) debris.splice(i, 1);
        });

        // UI Updates
        document.getElementById('health-fill').style.width = health + '%';
        const lockWarning = document.getElementById('hud-center');
        if (missiles.length > 0) {
          lockWarning.style.display = 'block';
          document.getElementById('threat-level').innerText =
            'THREAT: MISSILE INBOUND';
          document.getElementById('threat-level').style.color = '#ff0044';
        } else {
          lockWarning.style.display = 'none';
          document.getElementById('threat-level').innerText = 'THREAT: LOW';
          document.getElementById('threat-level').style.color = '#00ff41';
        }
      }

      function draw() {
        ctx.fillStyle = '#020406';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(width / 2, height / 2);
        ctx.scale(cam.currentZoom, cam.currentZoom);
        ctx.translate(cam.x, cam.y + cam.bob);

        buildings.forEach((b) => b.draw());
        missiles.forEach((m) => m.draw());
        debris.forEach((d) => {
          ctx.globalAlpha = d.life;
          ctx.fillStyle = d.color;
          ctx.fillRect(d.x, d.y, 4, 4);
        });

        ctx.restore();

        // Crosshair
        ctx.strokeStyle = '#00ff41';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(width / 2, height / 2, 30, 0, Math.PI * 2);
        ctx.moveTo(width / 2 - 40, height / 2);
        ctx.lineTo(width / 2 + 40, height / 2);
        ctx.moveTo(width / 2, height / 2 - 40);
        ctx.lineTo(width / 2, height / 2 + 40);
        ctx.stroke();
      }

      function deployExplosion() {
        const wx = -cam.x;
        const wy = -cam.y;
        buildings.forEach((b) => {
          const dx = wx - (b.x + b.w / 2);
          const dy = wy - (b.y + b.h / 2);
          if (Math.sqrt(dx * dx + dy * dy) < 100) {
            b.destroyed = true;
            createExplosion(b.x + b.w / 2, b.y + b.h / 2, '#666');
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        keys[e.key.toLowerCase()] = true;
        if (e.key === 'Enter') deployExplosion();
      });
      window.addEventListener(
        'keyup',
        (e) => (keys[e.key.toLowerCase()] = false)
      );
      window.addEventListener('mousedown', () => (mouse.down = true));
      window.addEventListener('mouseup', () => (mouse.down = false));
      window.addEventListener('resize', resize);

      init();
      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }
      loop();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 雙人肉圓大亂鬥 - 血量與衝刺版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #2c3e50; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.8); color: white; z-index: 10;
        }
        .btn-container { display: flex; gap: 20px; margin-top: 20px; }
        button {
            padding: 15px 30px; font-size: 18px; cursor: pointer; border: none;
            border-radius: 8px; background: #e67e22; color: white; font-weight: bold; transition: 0.2s;
        }
        button:hover { background: #d35400; transform: scale(1.05); }
        #hud {
            position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; z-index: 5;
            text-shadow: 1px 1px 2px black; display: none;
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>

    <div id="ui">
        <h1>選擇你的武器</h1>
        <div class="btn-container">
            <button onclick="startGame('sword')">劍 (冷卻 0.7s | 傷害 10%)</button>
            <button onclick="startGame('bow')">弓 (冷卻 0.5s | 傷害 7%)</button>
            <button onclick="startGame('fist')">拳 (冷卻 0.1s | 傷害 5%)</button>
        </div>
        <p style="margin-top: 20px; color: #ccc;">WASD 移動 | 滑鼠點擊 攻擊 | E 鍵 衝刺</p>
    </div>

    <div id="hud">
        <div id="hpDisplay">HP: 100%</div>
        <div id="dashDisplay" style="font-size: 16px; color: #f1c40f;">衝刺準備就緒</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    // ==========================================
    // 1. Supabase 初始化設定
    // ==========================================
    const SUPABASE_URL = 'https://yjgctujlqebbnsbkguke.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_Cm-cXMLUshA1ppRXwcrytA_jblbiyGH';
    
    // 將變數名稱從 supabase 改為 supabaseClient，避免與 CDN 的全域變數衝突
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // 使用 supabaseClient 來建立 channel
    const channel = supabaseClient.channel('game_room', {
        config: { broadcast: { self: false } }
    });

    // ==========================================
    // 2. 遊戲狀態與變數
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const myId = crypto.randomUUID();
    const players = {}; 
    const arrows = [];

    // 本地玩家狀態 (新增 hp, 衝刺與無敵時間)
    let me = {
        x: Math.random() * 500 + 500, y: Math.random() * 500 + 500, 
        angle: 0, weapon: 'none', hp: 100,
        isAttacking: false, attackTime: 0, fistToggle: false,
        dashTimer: 0, dashCooldown: 0, dashAngle: 0,
        invulnTimer: 0 // 被擊中後的短暫無敵時間
    };

    // 控制與物理
    const keys = { w: false, a: false, s: false, d: false, e: false };
    let prevE = false; // 用於偵測 E 鍵單次按下
    const mouse = { x: 0, y: 0 };
    const SPEED = 300;
    const DASH_SPEED = 1200;
    const COOLDOWNS = { sword: 0.7, bow: 0.5, fist: 0.1 };
    let lastAttackTime = 0;
    let lastTime = performance.now();

    // 攝影機
    const camera = { x: 0, y: 0 };

    // ==========================================
    // 3. 輸入監聽
    // ==========================================
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

    window.addEventListener('mousedown', () => {
        if (me.weapon === 'none' || me.hp <= 0) return;
        
        const now = performance.now() / 1000;
        if (now - lastAttackTime >= COOLDOWNS[me.weapon]) {
            lastAttackTime = now;
            me.isAttacking = true;
            me.attackTime = 0;

            if (me.weapon === 'sword') {
                me.x += Math.cos(me.angle) * 40;
                me.y += Math.sin(me.angle) * 40;
            } else if (me.weapon === 'bow') {
                const arrow = {
                    id: crypto.randomUUID(), ownerId: myId, // 記錄是誰射的，避免射到自己
                    x: me.x + Math.cos(me.angle) * 30, y: me.y + Math.sin(me.angle) * 30,
                    vx: Math.cos(me.angle) * 800, vy: Math.sin(me.angle) * 800,
                    angle: me.angle, life: 1.5 
                };
                arrows.push(arrow);
                channel.send({ type: 'broadcast', event: 'shoot', payload: arrow });
            } else if (me.weapon === 'fist') {
                me.fistToggle = !me.fistToggle;
            }
        }
    });

    // ==========================================
    // 4. 遊戲主邏輯與廣播機制
    // ==========================================
    function startGame(selectedWeapon) {
        me.weapon = selectedWeapon;
        document.getElementById('ui').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        
        channel.on('broadcast', { event: 'state_update' }, ({ payload }) => {
            players[payload.id] = payload;
            players[payload.id].lastSeen = performance.now();
        });
        
        channel.on('broadcast', { event: 'shoot' }, ({ payload }) => {
            arrows.push(payload);
        });

        // 接收箭矢銷毀事件 (當別人被箭射中時)
        channel.on('broadcast', { event: 'arrow_hit' }, ({ payload }) => {
            const index = arrows.findIndex(a => a.id === payload.id);
            if (index !== -1) arrows.splice(index, 1);
        });

        channel.subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                requestAnimationFrame(gameLoop);
                setInterval(broadcastState, 33);
            }
        });
    }

    function broadcastState() {
        if (me.weapon === 'none') return;
        channel.send({
            type: 'broadcast', event: 'state_update',
            payload: {
                id: myId, x: me.x, y: me.y, angle: me.angle, hp: me.hp,
                weapon: me.weapon, isAttacking: me.isAttacking,
                attackTime: me.attackTime, fistToggle: me.fistToggle
            }
        });
    }

    // 扣血邏輯
    function takeDamage(amount) {
        if (me.hp <= 0) return;
        me.hp -= amount;
        if (me.hp < 0) me.hp = 0;
        me.invulnTimer = 0.5; // 給予 0.5 秒無敵時間，防止被同一次攻擊連續扣血
        document.getElementById('hpDisplay').innerText = `HP: ${me.hp}%`;
        if (me.hp <= 0) alert('你被打敗了！請重新整理網頁再來一局。');
    }

    function update(dt) {
        if (me.hp <= 0) return; // 死亡後停止動作

        const mouseWorldX = mouse.x + camera.x;
        const mouseWorldY = mouse.y + camera.y;
        me.angle = Math.atan2(mouseWorldY - me.y, mouseWorldX - me.x);

        // 衝刺邏輯 (E 鍵)
        if (keys['e'] && !prevE && me.dashCooldown <= 0) {
            me.dashTimer = 0.15; // 衝刺持續 0.15 秒
            me.dashCooldown = 2.0; // 衝刺冷卻 2 秒
            me.dashAngle = me.angle;
        }
        prevE = keys['e'];

        if (me.dashCooldown > 0) {
            me.dashCooldown -= dt;
            const hudDash = document.getElementById('dashDisplay');
            if (me.dashCooldown <= 0) hudDash.innerText = "衝刺準備就緒";
            else hudDash.innerText = `衝刺冷卻: ${me.dashCooldown.toFixed(1)}s`;
        }
        if (me.invulnTimer > 0) me.invulnTimer -= dt;

        // 移動更新
        if (me.dashTimer > 0) {
            me.dashTimer -= dt;
            me.x += Math.cos(me.dashAngle) * DASH_SPEED * dt;
            me.y += Math.sin(me.dashAngle) * DASH_SPEED * dt;
        } else {
            if (keys['w']) me.y -= SPEED * dt;
            if (keys['s']) me.y += SPEED * dt;
            if (keys['a']) me.x -= SPEED * dt;
            if (keys['d']) me.x += SPEED * dt;
        }

        // 攻擊動畫更新
        if (me.isAttacking) {
            me.attackTime += dt;
            let maxAnimTime = (me.weapon === 'sword') ? 0.2 : (me.weapon === 'fist') ? 0.08 : 0.1;
            if (me.attackTime >= maxAnimTime) me.isAttacking = false;
        }

        // 箭矢更新與碰撞判定
        for (let i = arrows.length - 1; i >= 0; i--) {
            arrows[i].x += arrows[i].vx * dt;
            arrows[i].y += arrows[i].vy * dt;
            arrows[i].life -= dt;
            
            // 檢測自己是否被別人的箭射中
            if (arrows[i].ownerId !== myId && me.invulnTimer <= 0 && me.hp > 0) {
                const dist = Math.hypot(arrows[i].x - me.x, arrows[i].y - me.y);
                if (dist < 30) { // 玩家半徑 25 + 箭矢大小
                    takeDamage(7); // 箭傷害 7%
                    // 廣播銷毀這根箭矢
                    channel.send({ type: 'broadcast', event: 'arrow_hit', payload: { id: arrows[i].id } });
                    arrows.splice(i, 1);
                    continue;
                }
            }

            if (arrows[i].life <= 0) arrows.splice(i, 1);
        }

        // 近戰傷害判定 (劍與拳)
        if (me.invulnTimer <= 0 && me.hp > 0) {
            for (let id in players) {
                let p = players[id];
                // 只有在對方剛發起攻擊的瞬間 (前 0.1 秒) 判斷受擊
                if (p.isAttacking && p.attackTime < 0.1 && p.hp > 0) {
                    let dx = me.x - p.x;
                    let dy = me.y - p.y;
                    let dist = Math.hypot(dx, dy);
                    
                    if (dist < 75) { // 近戰範圍
                        // 計算我在對方視角的角度
                        let angleToMe = Math.atan2(dy, dx);
                        let angleDiff = Math.abs(angleToMe - p.angle);
                        if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;
                        
                        // 如果在對方面前 (約 90 度扇形內)
                        if (angleDiff < Math.PI / 2) {
                            if (p.weapon === 'sword') takeDamage(10);
                            else if (p.weapon === 'fist') takeDamage(5);
                        }
                    }
                }
            }
        }

        camera.x = me.x - canvas.width / 2;
        camera.y = me.y - canvas.height / 2;

        const now = performance.now();
        for (let id in players) {
            if (now - players[id].lastSeen > 2000) delete players[id];
        }
    }

    // ==========================================
    // 5. 渲染邏輯
    // ==========================================
    function drawPlayer(p, isMe) {
        if (p.hp <= 0) return; // 死亡不繪製
        const displayHp = p.hp !== undefined ? p.hp : 100;

        ctx.save();
        ctx.translate(p.x, p.y);
        
        // 繪製頭頂血條
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-25, -45, 50, 6);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(-25, -45, 50 * (displayHp / 100), 6);
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
        ctx.strokeRect(-25, -45, 50, 6);

        // 如果是自己且在無敵狀態，讓身體閃爍 (透明度變化)
        if (isMe && me.invulnTimer > 0) {
            if (Math.floor(me.invulnTimer * 10) % 2 === 0) ctx.globalAlpha = 0.5;
        }

        ctx.rotate(p.angle);

        // 武器渲染
        if (p.weapon === 'sword') {
            ctx.save();
            let swingAngle = -Math.PI / 4;
            if (p.isAttacking) {
                let progress = Math.min(p.attackTime / 0.2, 1);
                swingAngle = -Math.PI / 4 + (Math.PI / 2) * progress;
            }
            ctx.rotate(swingAngle);
            ctx.fillStyle = '#808080'; ctx.fillRect(15, -5, 60, 10);
            ctx.fillStyle = '#333'; ctx.fillRect(15, -15, 8, 30);
            ctx.restore();
        } else if (p.weapon === 'bow') {
            ctx.beginPath(); ctx.arc(15, 0, 25, -Math.PI/2 + 0.3, Math.PI/2 - 0.3);
            ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
            ctx.beginPath(); ctx.moveTo(15, -24); ctx.lineTo(p.isAttacking ? -5 : 15, 0); ctx.lineTo(15, 24);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
        } else if (p.weapon === 'fist') {
            let leftOffset = 0, rightOffset = 0;
            if (p.isAttacking) {
                if (p.fistToggle) leftOffset = 20; else rightOffset = 20;
            }
            ctx.fillStyle = '#F5CBA7'; ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(18 + leftOffset, -15, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(18 + rightOffset, 15, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        }

        // 肉圓玩家本體
        ctx.fillStyle = '#F5CBA7';
        ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = isMe ? '#27AE60' : '#C0392B'; ctx.lineWidth = 3; ctx.stroke();

        // 眼睛
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(12, -10, 4, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(12, 10, 4, 0, Math.PI*2); ctx.fill();

        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1;
        const gridSize = 100;
        const startX = Math.floor(camera.x / gridSize) * gridSize;
        const startY = Math.floor(camera.y / gridSize) * gridSize;
        for (let x = startX; x < camera.x + canvas.width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, camera.y); ctx.lineTo(x, camera.y + canvas.height); ctx.stroke();
        }
        for (let y = startY; y < camera.y + canvas.height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(camera.x, y); ctx.lineTo(camera.x + canvas.width, y); ctx.stroke();
        }

        arrows.forEach(arrow => {
            ctx.save(); ctx.translate(arrow.x, arrow.y); ctx.rotate(arrow.angle);
            ctx.fillStyle = 'white'; ctx.fillRect(-15, -3, 30, 6); ctx.restore();
        });

        for (let id in players) drawPlayer(players[id], false);
        drawPlayer(me, true);

        ctx.restore();
    }

    function gameLoop() {
        const now = performance.now();
        const dt = (now - lastTime) / 1000;
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
    }

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Drawing Board - FIXED</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #canvas {
            flex: 1;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px;
            cursor: crosshair;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 12px;
            padding: 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            margin: 0 20px 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .room-input {
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .color-picker, .size-slider {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid #e1e5e9;
        }

        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .controls { padding: 16px; gap: 8px; }
            #canvas { margin: 16px; }
        }
    </style>
  <script src="/portfolio-auth-check.js"></script>
  </head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        <div class="controls">
            <input type="text" class="room-input" id="roomId" placeholder="Room ID (e.g: fun123)" value="testroom">
            <button onclick="joinRoom()">🎨 Join Room</button>
            <button onclick="clearCanvas()">🗑️ Clear</button>
            <input type="color" class="color-picker" id="colorPicker" value="#ff0000">
            <input type="range" class="size-slider" id="brushSize" min="2" max="30" value="8">
            <span id="sizeDisplay">8px</span>
        </div>
        <div class="status" id="status">Ready to draw! 📱💻</div>
    </div>

    <script>
        // ⚠️ REPLACE WITH YOUR SUPABASE CREDENTIALS
        const SUPABASE_URL = 'https://yjgctujlqebbnsbkguke.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Cm-cXMLUshA1ppRXwcrytA_jblbiyGH';
        
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let canvas, ctx;
        let isDrawing = false;
        let currentRoom = null;
        let lastX = 0;
        let lastY = 0;
        let channel = null;

        // Initialize everything
        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            
            // Set canvas size properly
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Setup drawing events
            setupDrawingEvents();
            
            // UI events
            document.getElementById('brushSize').addEventListener('input', (e) => {
                document.getElementById('sizeDisplay').textContent = e.target.value + 'px';
            });
            
            // Auto-join test room
            setTimeout(() => joinRoom(), 500);
        }

        function resizeCanvas() {
            const container = canvas.parentElement;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function setupDrawingEvents() {
            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Touch events (MOBILE)
            canvas.addEventListener('touchstart', handleTouch, { passive: false });
            canvas.addEventListener('touchmove', handleTouch, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            
            const clientX = touch.clientX - rect.left;
            const clientY = touch.clientY - rect.top;
            
            if (e.type === 'touchstart') {
                startDrawing({ clientX, clientY });
            } else if (e.type === 'touchmove') {
                draw({ clientX, clientY });
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
            document.getElementById('status').textContent = '🖌️ Drawing...';
        }

        function draw(e) {
            if (!isDrawing) return;
            
            const pos = getMousePos(e);
            
            // Draw stroke locally
            drawStroke(lastX, lastY, pos.x, pos.y);
            
            // Send to server
            if (currentRoom && channel) {
                sendStroke({
                    x0: lastX,
                    y0: lastY,
                    x1: pos.x,
                    y1: pos.y,
                    color: document.getElementById('colorPicker').value,
                    size: parseInt(document.getElementById('brushSize').value)
                });
            }
            
            lastX = pos.x;
            lastY = pos.y;
        }

        function stopDrawing() {
            isDrawing = false;
            if (currentRoom) {
                document.getElementById('status').textContent = `✅ Connected to ${currentRoom}`;
            }
        }

        function drawStroke(x0, y0, x1, y1) {
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineWidth = parseInt(document.getElementById('brushSize').value);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.stroke();
        }

        async function joinRoom() {
            const roomId = document.getElementById('roomId').value.trim() || 'testroom';
            currentRoom = roomId;
            
            document.getElementById('status').textContent = `🔗 Joining ${roomId}...`;
            
            // Unsubscribe from previous room
            if (channel) {
                supabase.removeChannel(channel);
            }
            
            // Subscribe to new room
            channel = supabase.channel(`room:${roomId}`);
            
            channel
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'drawings',
                    filter: `room_id=eq.${roomId}`
                }, (payload) => {
                    if (payload.eventType === 'INSERT') {
                        const strokes = payload.new.data;
                        strokes.forEach(stroke => {
                            drawStroke(stroke.x0, stroke.y0, stroke.x1, stroke.y1);
                        });
                    }
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        document.getElementById('status').textContent = `✅ Live in ${roomId} (${status})`;
                    }
                });
        }

        async function sendStroke(stroke) {
            try {
                const { error } = await supabase
                    .from('drawings')
                    .insert({
                        room_id: currentRoom,
                        data: stroke
                    });
                
                if (error) console.error('Send error:', error);
            } catch (err) {
                console.error('Send error:', err);
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('status').textContent = '🗑️ Canvas cleared';
        }

        // Start the app
        init();
    </script>
</body>
</html>

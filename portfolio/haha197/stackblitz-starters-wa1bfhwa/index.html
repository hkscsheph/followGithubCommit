<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D 雙人肉圓大亂鬥</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #2c3e50;
        font-family: sans-serif;
      }
      canvas {
        display: block;
      }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        z-index: 10;
      }
      .btn-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
      }
      button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #e67e22;
        color: white;
        font-weight: bold;
        transition: 0.2s;
      }
      button:hover {
        background: #d35400;
        transform: scale(1.05);
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div id="ui">
      <h1>選擇你的武器</h1>
      <div class="btn-container">
        <button onclick="startGame('sword')">劍 (冷卻 0.7s)</button>
        <button onclick="startGame('bow')">弓 (冷卻 0.5s)</button>
        <button onclick="startGame('fist')">拳 (冷卻 0.1s)</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
      // ==========================================
      // 1. Supabase 初始化設定 (請填入您的憑證)
      // ==========================================
      const SUPABASE_URL = 'YOUR_SUPABASE_URL';
      const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const channel = supabase.channel('game_room', {
        config: { broadcast: { self: false } },
      });

      // ==========================================
      // 2. 遊戲狀態與變數
      // ==========================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const myId = crypto.randomUUID();
      const players = {};
      const arrows = [];

      // 本地玩家狀態
      let me = {
        x: 1000,
        y: 1000,
        angle: 0,
        weapon: 'none',
        isAttacking: false,
        attackTime: 0,
        fistToggle: false,
      };

      // 控制與物理
      const keys = { w: false, a: false, s: false, d: false };
      const mouse = { x: 0, y: 0 };
      const SPEED = 300;
      const COOLDOWNS = { sword: 0.7, bow: 0.5, fist: 0.1 };
      let lastAttackTime = 0;
      let lastTime = performance.now();

      // 攝影機
      const camera = { x: 0, y: 0 };

      // ==========================================
      // 3. 輸入監聽
      // ==========================================
      window.addEventListener(
        'keydown',
        (e) => (keys[e.key.toLowerCase()] = true)
      );
      window.addEventListener(
        'keyup',
        (e) => (keys[e.key.toLowerCase()] = false)
      );

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener('mousedown', () => {
        if (me.weapon === 'none') return;

        const now = performance.now() / 1000;
        if (now - lastAttackTime >= COOLDOWNS[me.weapon]) {
          lastAttackTime = now;
          me.isAttacking = true;
          me.attackTime = 0;

          // 武器專屬攻擊邏輯
          if (me.weapon === 'sword') {
            // 劍：向前位移一小段距離
            me.x += Math.cos(me.angle) * 40;
            me.y += Math.sin(me.angle) * 40;
          } else if (me.weapon === 'bow') {
            // 弓：發射箭矢
            const arrow = {
              id: crypto.randomUUID(),
              x: me.x + Math.cos(me.angle) * 30,
              y: me.y + Math.sin(me.angle) * 30,
              vx: Math.cos(me.angle) * 800,
              vy: Math.sin(me.angle) * 800,
              angle: me.angle,
              life: 1.5,
            };
            arrows.push(arrow);
            // 廣播箭矢生成
            channel.send({ type: 'broadcast', event: 'shoot', payload: arrow });
          } else if (me.weapon === 'fist') {
            // 拳：交替左右
            me.fistToggle = !me.fistToggle;
          }
        }
      });

      // ==========================================
      // 4. 遊戲主邏輯與廣播機制
      // ==========================================
      function startGame(selectedWeapon) {
        me.weapon = selectedWeapon;
        document.getElementById('ui').style.display = 'none';

        // 訂閱 Supabase Broadcast
        channel.on('broadcast', { event: 'state_update' }, ({ payload }) => {
          players[payload.id] = payload;
          players[payload.id].lastSeen = performance.now();
        });

        channel.on('broadcast', { event: 'shoot' }, ({ payload }) => {
          arrows.push(payload);
        });

        channel.subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            requestAnimationFrame(gameLoop);
            // 固定頻率發送廣播 (約 30 FPS)
            setInterval(broadcastState, 33);
          }
        });
      }

      function broadcastState() {
        channel.send({
          type: 'broadcast',
          event: 'state_update',
          payload: {
            id: myId,
            x: me.x,
            y: me.y,
            angle: me.angle,
            weapon: me.weapon,
            isAttacking: me.isAttacking,
            attackTime: me.attackTime,
            fistToggle: me.fistToggle,
          },
        });
      }

      function update(dt) {
        // 計算面朝方向 (考量攝影機偏移)
        const mouseWorldX = mouse.x + camera.x;
        const mouseWorldY = mouse.y + camera.y;
        me.angle = Math.atan2(mouseWorldY - me.y, mouseWorldX - me.x);

        // 移動
        if (keys['w']) me.y -= SPEED * dt;
        if (keys['s']) me.y += SPEED * dt;
        if (keys['a']) me.x -= SPEED * dt;
        if (keys['d']) me.x += SPEED * dt;

        // 更新攻擊計時器
        if (me.isAttacking) {
          me.attackTime += dt;
          // 控制攻擊動畫時長
          let maxAnimTime =
            me.weapon === 'sword' ? 0.2 : me.weapon === 'fist' ? 0.08 : 0.1;
          if (me.attackTime >= maxAnimTime) {
            me.isAttacking = false;
          }
        }

        // 更新箭矢
        for (let i = arrows.length - 1; i >= 0; i--) {
          arrows[i].x += arrows[i].vx * dt;
          arrows[i].y += arrows[i].vy * dt;
          arrows[i].life -= dt;
          if (arrows[i].life <= 0) {
            arrows.splice(i, 1);
          }
        }

        // 更新攝影機 (置中玩家)
        camera.x = me.x - canvas.width / 2;
        camera.y = me.y - canvas.height / 2;

        // 清理斷線玩家 (> 2秒沒收到封包)
        const now = performance.now();
        for (let id in players) {
          if (now - players[id].lastSeen > 2000) delete players[id];
        }
      }

      // ==========================================
      // 5. 渲染邏輯
      // ==========================================
      function drawPlayer(p, isMe) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // 繪製武器 (處於玩家底層)
        if (p.weapon === 'sword') {
          ctx.save();
          let swingAngle = -Math.PI / 4; // 預設左前方
          if (p.isAttacking) {
            // 從左前方旋轉至右前方
            let progress = Math.min(p.attackTime / 0.2, 1);
            swingAngle = -Math.PI / 4 + (Math.PI / 2) * progress;
          }
          ctx.rotate(swingAngle);
          ctx.fillStyle = '#808080'; // 灰色細長方形
          ctx.fillRect(15, -5, 60, 10);
          // 劍鍔
          ctx.fillStyle = '#333';
          ctx.fillRect(15, -15, 8, 30);
          ctx.restore();
        } else if (p.weapon === 'bow') {
          // 啡色半圓曲線
          ctx.beginPath();
          ctx.arc(15, 0, 25, -Math.PI / 2 + 0.3, Math.PI / 2 - 0.3);
          ctx.strokeStyle = '#8B4513';
          ctx.lineWidth = 6;
          ctx.lineCap = 'round';
          ctx.stroke();
          // 弓弦
          ctx.beginPath();
          ctx.moveTo(15, -24);
          ctx.lineTo(p.isAttacking ? -5 : 15, 0);
          ctx.lineTo(15, 24);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1;
          ctx.stroke();
        } else if (p.weapon === 'fist') {
          let leftOffset = 0;
          let rightOffset = 0;
          if (p.isAttacking) {
            if (p.fistToggle) leftOffset = 20; // 左拳出擊
            else rightOffset = 20; // 右拳出擊
          }
          ctx.fillStyle = '#F5CBA7';
          ctx.strokeStyle = '#C0392B';
          ctx.lineWidth = 2;

          // 左拳
          ctx.beginPath();
          ctx.arc(18 + leftOffset, -15, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 右拳
          ctx.beginPath();
          ctx.arc(18 + rightOffset, 15, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // 繪製肉圓玩家本體
        ctx.fillStyle = '#F5CBA7'; // 肉色
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = isMe ? '#27AE60' : '#C0392B'; // 自己為綠邊，敵人為紅邊
        ctx.lineWidth = 3;
        ctx.stroke();

        // 眼睛 (指示正面方向)
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(12, -10, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(12, 10, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 繪製背景網格 (世界坐標感)
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        ctx.strokeStyle = 'rgba(255,255,255,0.1)';
        ctx.lineWidth = 1;
        const gridSize = 100;
        const startX = Math.floor(camera.x / gridSize) * gridSize;
        const startY = Math.floor(camera.y / gridSize) * gridSize;
        for (let x = startX; x < camera.x + canvas.width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, camera.y);
          ctx.lineTo(x, camera.y + canvas.height);
          ctx.stroke();
        }
        for (let y = startY; y < camera.y + canvas.height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(camera.x, y);
          ctx.lineTo(camera.x + canvas.width, y);
          ctx.stroke();
        }

        // 繪製箭矢
        arrows.forEach((arrow) => {
          ctx.save();
          ctx.translate(arrow.x, arrow.y);
          ctx.rotate(arrow.angle);
          ctx.fillStyle = 'white';
          ctx.fillRect(-15, -3, 30, 6); // 白色長條箭
          ctx.restore();
        });

        // 繪製其他玩家
        for (let id in players) {
          drawPlayer(players[id], false);
        }

        // 繪製自己
        drawPlayer(me, true);

        ctx.restore();
      }

      function gameLoop() {
        const now = performance.now();
        const dt = (now - lastTime) / 1000;
        lastTime = now;

        update(dt);
        draw();

        requestAnimationFrame(gameLoop);
      }

      // 視窗縮放處理
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>

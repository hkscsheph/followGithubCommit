<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-time Drawing Board - FIXED</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        overflow: hidden;
      }

      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      #canvas {
        flex: 1;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        margin: 20px;
        cursor: crosshair;
        touch-action: none;
      }

      .controls {
        display: flex;
        gap: 12px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        margin: 0 20px 20px;
        flex-wrap: wrap;
        align-items: center;
      }

      .room-input {
        padding: 12px 16px;
        border: 2px solid #e1e5e9;
        border-radius: 12px;
        font-size: 16px;
      }

      button {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }

      .color-picker,
      .size-slider {
        padding: 12px;
        border-radius: 12px;
        border: 2px solid #e1e5e9;
      }

      .status {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 12px 20px;
        border-radius: 25px;
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .controls {
          padding: 16px;
          gap: 8px;
        }
        #canvas {
          margin: 16px;
        }
      }
    </style>
    <script src="/portfolio-auth-check.js"></script>
  </head>
  <body>
    <div class="container">
      <canvas id="canvas"></canvas>
      <div class="controls">
        <input
          type="text"
          class="room-input"
          id="roomId"
          placeholder="Room ID (e.g: fun123)"
          value="testroom"
        />
        <button onclick="joinRoom()">🎨 Join Room</button>
        <button onclick="clearCanvas()">🗑️ Clear</button>
        <input
          type="color"
          class="color-picker"
          id="colorPicker"
          value="#ff0000"
        />
        <input
          type="range"
          class="size-slider"
          id="brushSize"
          min="2"
          max="30"
          value="8"
        />
        <span id="sizeDisplay">8px</span>
      </div>
      <div class="status" id="status">Ready to draw! 📱💻</div>
    </div>

    <script>
      // ✅ FIXED: Correct Supabase import & initialization
      const SUPABASE_URL = 'https://yjgctujlqebbnsbkguke.supabase.co';
      const SUPABASE_ANON_KEY =
        'sb_publishable_Cm-cXMLUshA1ppRXwcrytA_jblbiyGH';
      const { createClient } = supabase;
      const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      let canvas, ctx;
      let isDrawing = false;
      let currentRoom = null;
      let lastX = 0;
      let lastY = 0;
      let channel = null;

      function init() {
        canvas = document.getElementById('canvas');
        ctx = canvas.getContext('2d');

        // ✅ FIXED: Proper canvas sizing
        function setCanvasSize() {
          const containerRect = canvas.parentElement.getBoundingClientRect();
          canvas.width = containerRect.width - 40; // Account for margins
          canvas.height = containerRect.height - 20;
        }

        setCanvasSize();
        window.addEventListener('resize', () => {
          setCanvasSize();
        });

        setupDrawingEvents();

        document.getElementById('brushSize').addEventListener('input', (e) => {
          document.getElementById('sizeDisplay').textContent =
            e.target.value + 'px';
        });

        setTimeout(() => joinRoom(), 500);
      }

      // ✅ FIXED: Proper canvas coordinates
      function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height),
        };
      }

      function setupDrawingEvents() {
        // Mouse events - ✅ FIXED
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        // Touch events
        canvas.addEventListener('touchstart', handleTouch, { passive: false });
        canvas.addEventListener('touchmove', handleTouch, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchcancel', stopDrawing);
      }

      function handleTouch(e) {
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();

        const clientX =
          (touch.clientX - rect.left) * (canvas.width / rect.width);
        const clientY =
          (touch.clientY - rect.top) * (canvas.height / rect.height);

        if (e.type === 'touchstart') {
          startDrawing({ clientX: clientX, clientY: clientY });
        } else if (e.type === 'touchmove') {
          draw({ clientX: clientX, clientY: clientY });
        }
      }

      function startDrawing(e) {
        isDrawing = true;
        const pos = getMousePos(e);
        lastX = pos.x;
        lastY = pos.y;

        // ✅ Draw first point
        ctx.strokeStyle = document.getElementById('colorPicker').value;
        ctx.lineWidth = parseInt(document.getElementById('brushSize').value);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);

        document.getElementById('status').textContent = '🖌️ Drawing...';
      }

      function draw(e) {
        if (!isDrawing) return;

        const pos = getMousePos(e);
        drawLine(lastX, lastY, pos.x, pos.y);

        // Send to server
        if (currentRoom && channel) {
          sendStroke({
            x0: lastX,
            y0: lastY,
            x1: pos.x,
            y1: pos.y,
            color: document.getElementById('colorPicker').value,
            size: parseInt(document.getElementById('brushSize').value),
          });
        }

        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing() {
        isDrawing = false;
        if (currentRoom) {
          document.getElementById(
            'status'
          ).textContent = `✅ Connected to ${currentRoom}`;
        }
      }

      // ✅ FIXED: Proper line drawing
      function drawLine(x0, y0, x1, y1) {
        const color = document.getElementById('colorPicker').value;
        const size = parseInt(document.getElementById('brushSize').value);

        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.lineTo(x1, y1);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x1, y1);
      }

      async function joinRoom() {
        const roomId =
          document.getElementById('roomId').value.trim() || 'testroom';
        currentRoom = roomId;

        document.getElementById(
          'status'
        ).textContent = `🔗 Joining ${roomId}...`;

        if (channel) {
          _supabase.removeChannel(channel);
        }

        channel = _supabase.channel(`room:${roomId}`);

        // ✅ FIXED: Single stroke handling
        channel
          .on(
            'postgres_changes',
            {
              event: 'INSERT',
              schema: 'public',
              table: 'drawings',
              filter: `room_id=eq.${roomId}`,
            },
            (payload) => {
              const stroke = payload.new.data;
              ctx.strokeStyle = stroke.color;
              ctx.lineWidth = stroke.size;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';

              ctx.beginPath();
              ctx.moveTo(stroke.x0, stroke.y0);
              ctx.lineTo(stroke.x1, stroke.y1);
              ctx.stroke();
            }
          )
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
              document.getElementById(
                'status'
              ).textContent = `✅ Live in ${roomId}`;
            }
          });
      }

      async function sendStroke(stroke) {
        try {
          const { error } = await _supabase.from('drawings').insert({
            room_id: currentRoom,
            data: stroke,
          });
        } catch (err) {
          console.error('Send error:', err);
        }
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        document.getElementById('status').textContent = '🗑️ Canvas cleared';
      }

      // Start the app
      init();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作品集</title>
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --text-main: #c9d1d9;
        --text-secondary: #8b949e;
        --accent: #58a6ff;
        --border: #30363d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
      }

      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
        background-color: var(--card-bg);
      }

      h1 {
        font-size: 1.2rem;
        margin: 0;
      }

      .controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      button {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }

      button:hover {
        background-color: #79c0ff;
      }

      .portfolio-iframe {
        flex: 1;
        border: none;
        width: 100%;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      .sign-out-btn {
        background-color: var(--border);
        color: var(--text-main);
      }

      .sign-out-btn:hover {
        background-color: var(--text-secondary);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-guard.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>作品集</h1>
        <div class="controls">
          <button onclick="goBack()">← 返回</button>
        </div>
      </header>
      <iframe id="portfolioFrame" class="portfolio-iframe"></iframe>
    </div>

    <script>
      // Supabase Configuration
      const SUPABASE_URL = 'https://wnvgjuhxxwnihmjfrcvk.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_MR0Q28M6SwAHDyy5iqdQXA_U26L7s6b';
      
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const authGuard = new AuthGuard(supabaseClient);

      function goBack() {
        window.history.back();
      }

      // Get portfolio path from URL
      function getPortfolioPath() {
        const params = new URLSearchParams(window.location.search);
        return params.get('path');
      }

      // Initialize auth guard and load portfolio
      authGuard.init({
        containerSelector: 'header .controls',
        onAuthenticated: () => {
          const portfolioPath = getPortfolioPath();
          if (portfolioPath) {
            document.getElementById('portfolioFrame').src = portfolioPath;
          } else {
            alert('No portfolio path specified');
            window.location.href = '/index.html';
          }
        }
      });
    </script>
  </body>
</html>
